  var quizState = {
    questions: [],
    current: 0,
    score: 0,
    answered: 0,
    history: []
  };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    var shuffled = shuffle(QUESTIONS);
    quizState.questions = shuffled.map(function(q) {
      var indices = [0, 1, 2, 3];
      var order = shuffle(indices);
      return {
        q: q,
        order: order,
        answered: false,
        chosenIdx: -1,
        correctShuffledIdx: order.indexOf(q.correct)
      };
    });
    quizState.current = 0;
    quizState.score = 0;
    quizState.answered = 0;
    renderQuestion();
  }

  function renderQuestion() {
    var area = document.getElementById('quizArea');
    var total = quizState.questions.length;
    var idx = quizState.current;
    var item = quizState.questions[idx];
    var q = item.q;

    // Update progress
    var pct = Math.round((quizState.answered / total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = 'Otazka ' + (idx + 1) + ' z ' + total;
    document.getElementById('scoreText').textContent = 'Skore: ' + quizState.score + ' / ' + quizState.answered;

    // Build card HTML
    var answersHtml = '';
    for (var i = 0; i < 4; i++) {
      var origIdx = item.order[i];
      answersHtml += '<button class="answer-btn" data-shuffled="' + i + '">' + q.answers[origIdx] + '</button>';
    }

    var prevDisabled = (idx === 0) ? 'disabled' : '';
    // Next button: disabled only if not answered and we're on unanswered
    var nextDisabled = (!item.answered) ? 'disabled' : '';
    // If answered and not last
    if (item.answered && idx === total - 1) {
      nextDisabled = '';
    }

    area.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<span class="category-badge" style="background:' + q.color + '">' + q.category + '</span>' +
          '<span class="q-number">' + (idx + 1) + ' / ' + total + '</span>' +
        '</div>' +
        '<div class="question-text">' + q.text + '</div>' +
        '<div class="answers-grid" id="answersGrid">' + answersHtml + '</div>' +
        '<div class="explanation" id="explanationBox">' + q.explanation + '</div>' +
        '<div class="nav-row">' +
          '<button class="nav-btn secondary" id="btnPrev" ' + prevDisabled + '>&larr; Zpet</button>' +
          '<button class="nav-btn" id="btnNext" ' + nextDisabled + '>' +
            (item.answered && idx === total - 1 ? 'Vysledky' : 'Dalsi &rarr;') +
          '</button>' +
        '</div>' +
      '</div>';

    // If already answered, restore visual state
    if (item.answered) {
      restoreAnsweredState(item);
    }

    // Bind events
    var btns = document.querySelectorAll('.answer-btn');
    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (item.answered) return;
        var shuffledIdx = parseInt(btn.getAttribute('data-shuffled'));
        handleAnswer(shuffledIdx, item);
      });
    });

    document.getElementById('btnPrev').addEventListener('click', function() {
      if (quizState.current > 0) {
        quizState.current--;
        renderQuestion();
      }
    });

    document.getElementById('btnNext').addEventListener('click', function() {
      if (!item.answered) return;
      if (quizState.current === total - 1) {
        renderResults();
      } else {
        quizState.current++;
        renderQuestion();
      }
    });
  }

  function handleAnswer(shuffledIdx, item) {
    item.answered = true;
    item.chosenIdx = shuffledIdx;
    quizState.answered++;

    var isCorrect = (shuffledIdx === item.correctShuffledIdx);
    if (isCorrect) quizState.score++;

    restoreAnsweredState(item);

    // Update next button
    var total = quizState.questions.length;
    var idx = quizState.current;
    var btnNext = document.getElementById('btnNext');
    btnNext.disabled = false;
    if (idx === total - 1) {
      btnNext.innerHTML = 'Vysledky';
    } else {
      btnNext.innerHTML = 'Dalsi &rarr;';
    }

    // Update score
    document.getElementById('scoreText').textContent = 'Skore: ' + quizState.score + ' / ' + quizState.answered;
  }

  function restoreAnsweredState(item) {
    var btns = document.querySelectorAll('.answer-btn');
    btns.forEach(function(btn) {
      var shuffledIdx = parseInt(btn.getAttribute('data-shuffled'));
      btn.disabled = true;
      if (shuffledIdx === item.correctShuffledIdx) {
        btn.classList.add('correct');
      } else if (shuffledIdx === item.chosenIdx) {
        btn.classList.add('wrong');
      } else {
        btn.classList.add('neutral-disabled');
      }
    });
    var expl = document.getElementById('explanationBox');
    expl.classList.add('visible');
  }

  function renderResults() {
    var total = quizState.questions.length;
    var pct = Math.round((quizState.score / total) * 100);

    var emoji = '😔';
    var grade = 'Nezapomen procvicit slabsi okruhy!';
    if (pct >= 90) { emoji = '🏆'; grade = 'Vynikajici! Zvladate latek skvele.'; }
    else if (pct >= 75) { emoji = '😊'; grade = 'Dobre! Jeste par drobnosti dolouskat.'; }
    else if (pct >= 60) { emoji = '🙂'; grade = 'Prumerny vysledek - doporucuji zopakovat.'; }
    else if (pct >= 40) { emoji = '😐'; grade = 'Podprumerny vysledek - zacni s opakovani!'; }

    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = 'Hotovo!';
    document.getElementById('scoreText').textContent = 'Skore: ' + quizState.score + ' / ' + total;

    document.getElementById('quizArea').innerHTML =
      '<div class="results-card">' +
        '<div class="results-emoji">' + emoji + '</div>' +
        '<div class="results-title">Kviz dokoncen!</div>' +
        '<div class="results-pct">' + pct + '%</div>' +
        '<div class="results-sub">Spravne: ' + quizState.score + ' z ' + total + ' otazek</div>' +
        '<div class="results-grade">' + grade + '</div>' +
        '<button class="restart-btn" id="restartBtn">Zacit znovu</button>' +
      '</div>';

    document.getElementById('restartBtn').addEventListener('click', function() {
      initQuiz();
    });
  }

  initQuiz();
});
</script>
