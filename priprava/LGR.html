<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LGR Kviz - Logika a Teorie Grafu</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f4f8;
    color: #111827;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 4px;
    text-align: center;
  }

  .subtitle {
    color: #4b5563;
    text-align: center;
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  /* Progress bar */
  .progress-wrap {
    background: #d1d5db;
    border-radius: 999px;
    height: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar {
    background: #3b82f6;
    height: 100%;
    border-radius: 999px;
    transition: width 0.35s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: #6b7280;
    margin-bottom: 20px;
  }
  .score-badge {
    font-weight: 600;
    color: #1d4ed8;
  }

  /* Card */
  .card {
    background: #ffffff;
    border-radius: 14px;
    padding: 28px 28px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    color: #111827;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .q-number {
    font-size: 0.8rem;
    font-weight: 600;
    color: #6b7280;
    white-space: nowrap;
  }

  .category-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #ffffff;
  }
  .cat-vl  { background: #7c3aed; }
  .cat-pl  { background: #0891b2; }
  .cat-gr  { background: #059669; }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #111827;
    line-height: 1.55;
    margin-bottom: 20px;
  }

  /* Answer buttons */
  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .answer-btn {
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
    font-size: 0.95rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111827;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1.45;
  }
  .answer-btn:not(:disabled):hover {
    background: #eff6ff;
    border-color: #93c5fd;
    color: #1e40af;
  }
  .answer-btn:disabled {
    cursor: default;
  }
  .answer-btn.correct {
    background: #dcfce7;
    border-color: #22c55e;
    color: #14532d;
  }
  .answer-btn.wrong {
    background: #fee2e2;
    border-color: #ef4444;
    color: #7f1d1d;
  }

  /* Explanation */
  .explanation {
    background: #f0fdf4;
    border-left: 4px solid #22c55e;
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 0.88rem;
    color: #166534;
    line-height: 1.5;
    display: none;
    margin-bottom: 16px;
  }
  .explanation.show { display: block; }
  .explanation.wrong-exp {
    background: #fff7ed;
    border-color: #f97316;
    color: #7c2d12;
  }

  /* Navigation */
  .nav-row {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }

  .nav-btn {
    background: #3b82f6;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.92rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s, opacity 0.15s;
    display: none;
  }
  .nav-btn:hover:not(:disabled) { background: #2563eb; }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .nav-btn.show { display: inline-block; }
  .nav-btn.secondary {
    background: #6b7280;
  }
  .nav-btn.secondary:hover:not(:disabled) { background: #4b5563; }

  /* Results screen */
  .results {
    background: #ffffff;
    border-radius: 14px;
    padding: 36px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    text-align: center;
    color: #111827;
    display: none;
  }
  .results.show { display: block; }
  .result-emoji { font-size: 3rem; margin-bottom: 12px; }
  .result-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 8px;
  }
  .result-percent {
    font-size: 3rem;
    font-weight: 800;
    color: #3b82f6;
    margin: 12px 0;
  }
  .result-sub {
    font-size: 0.95rem;
    color: #4b5563;
    margin-bottom: 24px;
  }
  .result-breakdown {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .breakdown-item {
    background: #f9fafb;
    border-radius: 10px;
    padding: 12px 20px;
    min-width: 100px;
    color: #111827;
  }
  .breakdown-num {
    font-size: 1.8rem;
    font-weight: 700;
    color: #111827;
  }
  .breakdown-num.green { color: #16a34a; }
  .breakdown-num.red   { color: #dc2626; }
  .breakdown-label {
    font-size: 0.78rem;
    color: #6b7280;
    margin-top: 2px;
  }
  .restart-btn {
    background: #3b82f6;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 13px 32px;
    font-size: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .restart-btn:hover { background: #2563eb; }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    body {
      background: #0f172a;
      color: #f1f5f9;
    }
    h1 { color: #f1f5f9; }
    .subtitle { color: #94a3b8; }
    .progress-wrap { background: #334155; }
    .progress-label { color: #94a3b8; }
    .score-badge { color: #60a5fa; }
    .card {
      background: #1e293b;
      color: #f1f5f9;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .q-number { color: #94a3b8; }
    .question-text { color: #f1f5f9; }
    .answer-btn {
      background: #293548;
      border-color: #374151;
      color: #e2e8f0;
    }
    .answer-btn:not(:disabled):hover {
      background: #1e3a5f;
      border-color: #60a5fa;
      color: #93c5fd;
    }
    .answer-btn.correct {
      background: #14532d;
      border-color: #22c55e;
      color: #dcfce7;
    }
    .answer-btn.wrong {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fee2e2;
    }
    .explanation {
      background: #14532d;
      border-color: #22c55e;
      color: #bbf7d0;
    }
    .explanation.wrong-exp {
      background: #431407;
      border-color: #f97316;
      color: #fed7aa;
    }
    .nav-btn { background: #3b82f6; color: #ffffff; }
    .nav-btn.secondary { background: #4b5563; color: #ffffff; }
    .results {
      background: #1e293b;
      color: #f1f5f9;
    }
    .result-title { color: #f1f5f9; }
    .result-percent { color: #60a5fa; }
    .result-sub { color: #94a3b8; }
    .breakdown-item { background: #293548; color: #f1f5f9; }
    .breakdown-num { color: #f1f5f9; }
    .breakdown-num.green { color: #4ade80; }
    .breakdown-num.red   { color: #f87171; }
    .breakdown-label { color: #94a3b8; }
  }
</style>
</head>

      exp: 'Bipartitní graf ma vrcholy rozdeleleny do dvou disjunktnich mnozin (parity) a vsechny hrany vedou mezi temi dvema skupinami - nikdy uvnitr jedne skupiny. Uplny bipartitni graf K(m,n) ma m*n hran.'

  // Fisher-Yates shuffle
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var questions = shuffle(ALL_QUESTIONS);
  var total = questions.length;

  // State per question
  var states = [];
  for (var i = 0; i < total; i++) {
    states.push({
      answered: false,
      chosenIndex: -1,  // index in shuffled answers
      shuffledOrder: null  // indices into original answers array
    });
  }

  var current = 0;
  var score = 0;

  // DOM refs
  var progressBar = document.getElementById('progressBar');
  var progressLabel = document.getElementById('progressLabel');
  var scoreLabel = document.getElementById('scoreLabel');
  var qNumber = document.getElementById('qNumber');
  var catBadge = document.getElementById('catBadge');
  var questionText = document.getElementById('questionText');
  var answersContainer = document.getElementById('answersContainer');
  var explanationBox = document.getElementById('explanationBox');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var questionCard = document.getElementById('questionCard');
  var resultsScreen = document.getElementById('resultsScreen');
  var restartBtn = document.getElementById('restartBtn');

  function renderQuestion(idx) {
    var q = questions[idx];
    var st = states[idx];

    // Prepare shuffled order if not yet done
    if (!st.shuffledOrder) {
      var order = [];
      for (var k = 0; k < q.answers.length; k++) order.push(k);
      st.shuffledOrder = shuffle(order);
    }

    // Progress
    var pct = ((idx) / total) * 100;
    progressBar.style.width = pct + '%';
    progressLabel.textContent = 'Otazka ' + (idx + 1) + ' z ' + total;
    scoreLabel.textContent = 'Skore: ' + score;
    qNumber.textContent = (idx + 1) + ' / ' + total;

    // Category badge
    catBadge.textContent = q.catLabel;
    catBadge.className = 'category-badge cat-' + q.cat;

    // Question
    questionText.textContent = q.q;

    // Answers
    answersContainer.innerHTML = '';
    for (var ai = 0; ai < st.shuffledOrder.length; ai++) {
      var origIdx = st.shuffledOrder[ai];
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIdx];
      btn.setAttribute('data-ai', ai);
      if (st.answered) {
        btn.disabled = true;
        if (origIdx === q.correct) {
          btn.classList.add('correct');
        } else if (ai === st.chosenIndex) {
          btn.classList.add('wrong');
        }
      } else {
        btn.addEventListener('click', onAnswerClick);
      }
      answersContainer.appendChild(btn);
    }

    // Explanation
    if (st.answered) {
      explanationBox.textContent = q.exp;
      var wasWrong = (st.shuffledOrder[st.chosenIndex] !== q.correct);
      explanationBox.className = 'explanation show' + (wasWrong ? ' wrong-exp' : '');
    } else {
      explanationBox.className = 'explanation';
      explanationBox.textContent = '';
    }

    // Nav buttons
    prevBtn.className = 'nav-btn secondary' + (idx > 0 && st.answered ? ' show' : '');
    prevBtn.disabled = (idx === 0);

    if (st.answered) {
      nextBtn.className = 'nav-btn show';
      nextBtn.textContent = (idx === total - 1) ? 'Vysledky' : 'Dalsi \u2192';
    } else {
      nextBtn.className = 'nav-btn';
    }
  }

  function onAnswerClick(e) {
    var btn = e.currentTarget;
    var ai = parseInt(btn.getAttribute('data-ai'), 10);
    var q = questions[current];
    var st = states[current];

    if (st.answered) return;

    st.answered = true;
    st.chosenIndex = ai;

    var origIdx = st.shuffledOrder[ai];
    var correct = (origIdx === q.correct);
    if (correct) score++;

    // Disable all buttons and highlight
    var btns = answersContainer.querySelectorAll('.answer-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = true;
      var bOrigIdx = st.shuffledOrder[parseInt(btns[i].getAttribute('data-ai'), 10)];
      if (bOrigIdx === q.correct) {
        btns[i].classList.add('correct');
      } else if (parseInt(btns[i].getAttribute('data-ai'), 10) === ai) {
        btns[i].classList.add('wrong');
      }
    }

    // Show explanation
    explanationBox.textContent = q.exp;
    var wasWrong = !correct;
    explanationBox.className = 'explanation show' + (wasWrong ? ' wrong-exp' : '');

    // Show nav buttons
    prevBtn.className = 'nav-btn secondary' + (current > 0 ? ' show' : '');
    nextBtn.className = 'nav-btn show';
    nextBtn.textContent = (current === total - 1) ? 'Vysledky' : 'Dalsi \u2192';
    scoreLabel.textContent = 'Skore: ' + score;
  }

  prevBtn.addEventListener('click', function() {
    if (current > 0) {
      current--;
      renderQuestion(current);
    }
  });

  nextBtn.addEventListener('click', function() {
    if (current === total - 1) {
      showResults();
    } else {
      current++;
      renderQuestion(current);
    }
  });

  function showResults() {
    progressBar.style.width = '100%';
    progressLabel.textContent = 'Kviz dokoncen!';
    questionCard.style.display = 'none';
    resultsScreen.classList.add('show');

    var pct = Math.round((score / total) * 100);
    document.getElementById('resultPercent').textContent = pct + ' %';
    document.getElementById('bdCorrect').textContent = score;
    document.getElementById('bdWrong').textContent = (total - score);
    document.getElementById('bdTotal').textContent = total;

    var emoji, title, sub;
    if (pct >= 90) {
      emoji = '\uD83C\uDF89'; title = 'Vynikajici!'; sub = 'Logika a grafy jsou tve silne stranky!';
    } else if (pct >= 75) {
      emoji = '\uD83D\uDE0A'; title = 'Dobre!'; sub = 'Solidni znalosti, jen par mezer.';
    } else if (pct >= 50) {
      emoji = '\uD83D\uDCDA'; title = 'Ujde to.'; sub = 'Doporucujeme zopakovat slabsi oblasti.';
    } else {
      emoji = '\uD83D\uDE05'; title = 'Zkus to znovu!'; sub = 'Projdi si materialy a zkus to este jednou.';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultSub').textContent = sub;
  }

  restartBtn.addEventListener('click', function() {
    questions = shuffle(ALL_QUESTIONS);
    score = 0;
    current = 0;
    states = [];
    for (var i = 0; i < total; i++) {
      states.push({ answered: false, chosenIndex: -1, shuffledOrder: null });
    }
    resultsScreen.classList.remove('show');
    questionCard.style.display = '';
    renderQuestion(0);
  });

  renderQuestion(0);
});
</script>
