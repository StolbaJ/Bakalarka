<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kviz PST – Pravdepodobnost a statistika</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f4f8;
    color: #111827;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #111827;
    text-align: center;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: #4b5563;
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  /* Progress */
  .progress-wrap {
    background: #d1d5db;
    border-radius: 999px;
    height: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #2563eb;
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 20px;
  }
  .score-badge {
    font-weight: 600;
    color: #2563eb;
  }

  /* Card */
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    color: #111827;
  }

  .category-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
    color: #ffffff;
  }

  .cat-probability  { background: #7c3aed; }
  .cat-distributions { background: #0891b2; }
  .cat-statistics   { background: #059669; }
  .cat-tests        { background: #d97706; }
  .cat-markov       { background: #dc2626; }
  .cat-vectors      { background: #db2777; }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #111827;
    line-height: 1.5;
    margin-bottom: 22px;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .answer-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    background: #f9fafb;
    color: #1a1a2e;
    font-size: 0.97rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    line-height: 1.4;
  }
  .answer-btn:not(:disabled):hover {
    border-color: #2563eb;
    background: #eff6ff;
    color: #1a1a2e;
  }
  .answer-btn.correct {
    border-color: #16a34a;
    background: #dcfce7;
    color: #14532d;
    font-weight: 600;
  }
  .answer-btn.wrong {
    border-color: #dc2626;
    background: #fee2e2;
    color: #7f1d1d;
    font-weight: 600;
  }
  .answer-btn:disabled { cursor: default; }

  .explanation {
    display: none;
    background: #fffbeb;
    border-left: 4px solid #f59e0b;
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    font-size: 0.9rem;
    color: #78350f;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .explanation.visible { display: block; }

  .nav-row {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .nav-row.visible { display: flex; }

  .nav-btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: 2px solid #2563eb;
    background: #ffffff;
    color: #2563eb;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover:not(:disabled) {
    background: #2563eb;
    color: #ffffff;
  }
  .nav-btn:disabled {
    border-color: #d1d5db;
    color: #9ca3af;
    cursor: default;
    background: #f9fafb;
  }
  .nav-btn.primary {
    background: #2563eb;
    color: #ffffff;
  }
  .nav-btn.primary:hover:not(:disabled) {
    background: #1d4ed8;
    color: #ffffff;
  }

  /* Results */
  .results {
    display: none;
    text-align: center;
    padding: 20px 0;
  }
  .results h2 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 10px;
  }
  .result-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    border: 6px solid;
  }
  .result-circle .pct { color: #111827; }
  .result-circle .lbl { font-size: 0.75rem; font-weight: 400; color: #4b5563; margin-top: 2px; }
  .result-excellent  { border-color: #16a34a; background: #dcfce7; }
  .result-good       { border-color: #2563eb; background: #dbeafe; }
  .result-average    { border-color: #d97706; background: #fef3c7; }
  .result-poor       { border-color: #dc2626; background: #fee2e2; }

  .result-msg {
    font-size: 1rem;
    color: #374151;
    margin-bottom: 8px;
  }
  .result-detail {
    font-size: 0.9rem;
    color: #6b7280;
    margin-bottom: 24px;
  }
  .restart-btn {
    padding: 12px 32px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .restart-btn:hover { background: #1d4ed8; }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    body {
      background: #111827;
      color: #f9fafb;
    }
    h1 { color: #f9fafb; }
    .subtitle { color: #9ca3af; }
    .progress-wrap { background: #374151; }
    .progress-bar { background: #3b82f6; }
    .progress-info { color: #9ca3af; }
    .score-badge { color: #60a5fa; }
    .card {
      background: #1f2937;
      color: #f9fafb;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .question-text { color: #f9fafb; }
    .answer-btn {
      background: #374151;
      border-color: #4b5563;
      color: #f3f4f6;
    }
    .answer-btn:not(:disabled):hover {
      border-color: #60a5fa;
      background: #1e3a5f;
      color: #f3f4f6;
    }
    .answer-btn.correct {
      border-color: #16a34a;
      background: #14532d;
      color: #bbf7d0;
    }
    .answer-btn.wrong {
      border-color: #dc2626;
      background: #7f1d1d;
      color: #fecaca;
    }
    .answer-btn:disabled { background: #374151; }
    .explanation {
      background: #292524;
      border-color: #d97706;
      color: #fcd34d;
    }
    .nav-btn {
      border-color: #3b82f6;
      background: #1f2937;
      color: #60a5fa;
    }
    .nav-btn:hover:not(:disabled) {
      background: #3b82f6;
      color: #ffffff;
    }
    .nav-btn:disabled {
      border-color: #374151;
      color: #6b7280;
      background: #1f2937;
    }
    .nav-btn.primary {
      background: #3b82f6;
      color: #ffffff;
    }
    .nav-btn.primary:hover:not(:disabled) {
      background: #2563eb;
      color: #ffffff;
    }
    .results h2 { color: #f9fafb; }
    .result-circle .pct { color: #111827; }
    .result-circle .lbl { color: #374151; }
    .result-msg { color: #d1d5db; }
    .result-detail { color: #9ca3af; }
    .restart-btn { background: #3b82f6; }
    .restart-btn:hover { background: #2563eb; }
  }

  @media (max-width: 500px) {
    .card { padding: 20px 16px 18px; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Kviz PST</h1>
  <p class="subtitle">Pravdepodobnost a statistika &nbsp;|&nbsp; B0B01PST</p>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-info">
    <span id="progressLabel">Otazka 1 z 25</span>
    <span class="score-badge" id="scoreLabel">Skore: 0</span>
  </div>

  <div class="card" id="quizCard">
    <span class="category-tag" id="categoryTag"></span>
    <p class="question-text" id="questionText"></p>
    <div class="answers" id="answersDiv"></div>
    <div class="explanation" id="explanation"></div>
    <div class="nav-row" id="navRow">
      <button class="nav-btn" id="btnBack">&#8592; Zpet</button>
      <button class="nav-btn primary" id="btnNext">Dalsi &#8594;</button>
    </div>
  </div>

  <div class="results" id="resultsPanel">
    <h2>Vysledky kvizu</h2>
    <div class="result-circle" id="resultCircle">
      <span class="pct" id="resultPct"></span>
      <span class="lbl">uspesnost</span>
    </div>
    <p class="result-msg" id="resultMsg"></p>
    <p class="result-detail" id="resultDetail"></p>
    <button class="restart-btn" id="restartBtn">Znovu spustit kviz</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var ALL_QUESTIONS = [
    {
      cat: 'probability',
      catLabel: 'Pravdepodobnost',
      catClass: 'cat-probability',
      q: 'Co vyjadruje Kolmogorova definice pravdepodobnosti?',
      answers: [
        'Pravdepodobnost je relativni cetnost jevu pri opakovanem pokusu.',
        'Pravdepodobnost je funkce splnujici axiomy nezapornosti, normovanosti a sigma-aditivity.',
        'Pravdepodobnost je mira jistoty, ktera vzdy nabiva hodnot 0 nebo 1.',
        'Pravdepodobnost je pocet priaznivych vysledku deleny celkovym poctem moznych vysledku.'
      ],
      correct: 1,
      explanation: 'Kolmogorova definice stavi na trech axiomech: P(A) >= 0 pro kazdy jev A, P(Omega) = 1 a pro navzajem neslucitelne jevy plati P(sjednoceni) = suma pravdepodobnosti.'
    },
    {
      cat: 'probability',
      catLabel: 'Pravdepodobnost',
      catClass: 'cat-probability',
      q: 'Jevy A a B jsou nezavisle prave tehdy, kdyz:',
      answers: [
        'P(A ∩ B) = 0',
        'P(A ∪ B) = P(A) + P(B)',
        'P(A ∩ B) = P(A) · P(B)',
        'P(A | B) = P(B)'
      ],
      correct: 2,
      explanation: 'Nezavislost jevu A a B je definovana podminkuou P(A ∩ B) = P(A) · P(B). Ekvivalentne plati P(A|B) = P(A) a P(B|A) = P(B). Neslucitelnost (P(A ∩ B) = 0) neni to same co nezavislost!'
    },
    {
      cat: 'probability',
      catLabel: 'Pravdepodobnost',
      catClass: 'cat-probability',
      q: 'Bayesova veta umoznuje:',
      answers: [
        'Vypocitat pravdepodobnost sjednoceni dvou jevu.',
        'Odhadnout rozptyl nahodne veliciny z dat.',
        'Obratit podminene pravdepodobnosti – z P(B|A) ziskat P(A|B).',
        'Urcit, zda jsou dva jevy navzajem neslucitelne.'
      ],
      correct: 2,
      explanation: 'Bayesuv vzorec P(A|B) = P(B|A)·P(A) / P(B) umoznuje prepocitat apriori pravdepodobnost P(A) na aposteriori P(A|B) po zjisteni informace B. Typicke pouziti: diagnostika, klasifikatory.'
    },
    {
      cat: 'probability',
      catLabel: 'Pravdepodobnost',
      catClass: 'cat-probability',
      q: 'Podminska pravdepodobnost P(A|B) je definovana jako:',
      answers: [
        'P(A) · P(B)',
        'P(A ∩ B) / P(B), pokud P(B) > 0',
        'P(A) / P(B)',
        'P(A ∪ B) - P(B)'
      ],
      correct: 1,
      explanation: 'P(A|B) = P(A ∩ B) / P(B) je definice podminsene pravdepodobnosti – pravdepodobnost jevu A za predpokladu, ze nastal jev B. Vyzaduje P(B) > 0.'
    },
    {
      cat: 'probability',
      catLabel: 'Pravdepodobnost',
      catClass: 'cat-probability',
      q: 'Ukazal test pozitivni vysledek u pacienta. Dokter vi: prevalence nemoci je 1 %, senzitivita testu (true positive rate) je 90 % a specifita (true negative rate) je 95 %. Jaka pravdepodobnost uziva Bayesuv vzorec k vysvetleni vystupu?',
      answers: [
        'Apriori pravdepodobnost prevalence je primo aposteriori pravdepodobnosti nemoci po testu.',
        'Bayesuv vzorec kombinuje prevalenci, senzitivitu a specifitu pro vypocet aposteriori pravdepodobnosti nemoci.',
        'Bayesuv vzorec se v medicinske diagnostice nepouziva.',
        'Aposteriori pravdepodobnost nemoci je vzdy vyssi nez 50 % pri pozitivnim testu.'
      ],
      correct: 1,
      explanation: 'P(nemoc | pozitivni) = P(poz|nem)·P(nem) / [P(poz|nem)·P(nem) + P(poz|zdrav)·P(zdrav)]. Zde P(poz|nem)=0.9, P(nem)=0.01, P(poz|zdrav)=0.05, vysledek je cca 15 % – daleko niz nez 90 %!'
    },
    {
      cat: 'distributions',
      catLabel: 'Rozdeleni',
      catClass: 'cat-distributions',
      q: 'Distribuicni funkce F_X(t) nahodne veliciny je definovana jako:',
      answers: [
        'F_X(t) = P(X = t)',
        'F_X(t) = P(X > t)',
        'F_X(t) = P(X < t)',
        'F_X(t) = P(X ≤ t)'
      ],
      correct: 3,
      explanation: 'Distribucni funkce F_X(t) = P(X ≤ t) vyjadruje pravdepodobnost, ze nahodna velicina X nabude hodnoty mense nebo rovne t. Je neklesajici a zprava spojita.'
    },
    {
      cat: 'distributions',
      catLabel: 'Rozdeleni',
      catClass: 'cat-distributions',
      q: 'Pro binomicke rozdeleni Bin(n, p) plati:',
      answers: [
        'Stredni hodnota je p, rozptyl je np(1-p).',
        'Stredni hodnota je np, rozptyl je np(1-p).',
        'Stredni hodnota i rozptyl jsou rovny lambda.',
        'Stredni hodnota je (1-p)/p, rozptyl je (1-p)/p^2.'
      ],
      correct: 1,
      explanation: 'Binomicke rozdeleni popisuje pocet uspechu v n nezavislych Bernoulliho pokusech. E(X) = np a Var(X) = np(1-p). Stredni hodnotu lambda popisuje Poissonovo rozdeleni.'
    },
    {
      cat: 'distributions',
      catLabel: 'Rozdeleni',
      catClass: 'cat-distributions',
      q: 'Poissonovo rozdeleni Po(lambda) se pouziva k popisu:',
      answers: [
        'Poctu uspechu v n nezavislych pokusech s pravdepodobnosti p.',
        'Doby cekani do prvni udalosti.',
        'Poctu udalosti v pevnem casovem intervalu pri konstantni intenzite lambda.',
        'Poctu neuspesnych pokusu pred prvnim uspechem.'
      ],
      correct: 2,
      explanation: 'Poissonovo rozdeleni modeluje pocet udalosti v pevnem intervalu (cas, delka, plocha) pri konstantni intenzite lambda. Plati E(X) = Var(X) = lambda.'
    },
    {
      cat: 'distributions',
      catLabel: 'Rozdeleni',
      catClass: 'cat-distributions',
      q: 'Hustota pravdepodobnosti spojite nahodne veliciny f_X(t) splnuje:',
      answers: [
        'Soucet vsech hodnot f_X(t) pro t ∈ R je roven 1.',
        'Integral f_X(t) od -∞ do +∞ je roven 1, a f_X(t) ≥ 0.',
        'f_X(t) = P(X = t) pro kazde t.',
        'f_X(t) muze nabyvat i zaporne hodnoty, pokud je celkovy integral roven 1.'
      ],
      correct: 1,
      explanation: 'Hustota pravdepodobnosti musi byt nezaporna a mit integralni plochu rovnou 1. Dulezite: P(X = t) = 0 pro spojite veliciny – pravdepodobnost konkretni hodnoty je vzdy nulova.'
    },
    {
      cat: 'distributions',
      catLabel: 'Rozdeleni',
      catClass: 'cat-distributions',
      q: 'Steinerova veta (koenig-Steiner) pro vypocet rozptylu rika, ze Var(X) se rovna:',
      answers: [
        'E(X^2) - (E(X))^2',
        '(E(X))^2 - E(X^2)',
        'E((X - mu)^3)',
        'sqrt(E((X - E(X))^2))'
      ],
      correct: 0,
      explanation: 'Var(X) = E(X^2) - (E(X))^2 je ekvivalentni prepis definice Var(X) = E((X - E(X))^2). Umoznuje jednodussi vypocet – staci znat E(X) a E(X^2).'
    },
    {
      cat: 'vectors',
      catLabel: 'Nahodne vektory',
      catClass: 'cat-vectors',
      q: 'Kovariance Cov(X, Y) = 0 znamena, ze:',
      answers: [
        'Veliciny X a Y jsou navzajem nezavisle.',
        'Mezi X a Y neexistuje zadna statisticka zavislost.',
        'Mezi X a Y neexistuje linearni zavislost, ale nelinearni zavislost byt muze.',
        'Korelace mezi X a Y je rovna 1.'
      ],
      correct: 2,
      explanation: 'Cov(X, Y) = 0 znamena pouze absenci linearni zavislosti. X a Y mohou byt nelinearne zavisle (napr. Y = X^2 pri symetrickem rozdeleni X). Nezavislost naopak vzdy implikuje nulovou kovarianci, ale ne obracene.'
    },
    {
      cat: 'vectors',
      catLabel: 'Nahodne vektory',
      catClass: 'cat-vectors',
      q: 'Pearsonuv korelacni koeficient rho(X, Y) nabiva hodnot:',
      answers: [
        'Od 0 do 1 vcetne.',
        'Od -1 do 1 vcetne.',
        'Od -∞ do +∞.',
        'Od 0 do +∞.'
      ],
      correct: 1,
      explanation: 'rho(X,Y) = Cov(X,Y) / (sigma_X · sigma_Y) lezi vzdy v intervalu [-1, 1]. Hodnota +1 znamena dokonalou kladnou linearni zavislost, -1 dokonalou zapournou, 0 absenci linearni zavislosti.'
    },
    {
      cat: 'vectors',
      catLabel: 'Nahodne vektory',
      catClass: 'cat-vectors',
      q: 'Jakou operaci popisuje konvoluce rozdeleni v kontextu souctu nahodnych velicin?',
      answers: [
        'Konvoluce popisuje vyber minima ze dvou nahodnych velicin.',
        'Konvoluce da distribucni funkci souctu Z = X + Y dvou nezavislych nahodnych velicin.',
        'Konvoluce se pouziva vyhradne na diskretni rozdeleni.',
        'Konvoluce popisuje rozdeleni rozdilu X - Y dvou velicin.'
      ],
      correct: 1,
      explanation: 'Pro nezavisle X a Y je distribucni funkce jejich souctu Z = X+Y dana konvoluci. Pro spojite: f_Z(z) = integral f_X(t) · f_Y(z-t) dt. Napr. N(mu1, s1^2) + N(mu2, s2^2) = N(mu1+mu2, s1^2+s2^2).'
    },
    {
      cat: 'statistics',
      catLabel: 'Statistika',
      catClass: 'cat-statistics',
      q: 'Cebyseova nerovnost rika, ze pro nahodnou velicinu X s rozptylem Var(X) a kazdou epsilon > 0 plati:',
      answers: [
        'P(|X - E(X)| >= epsilon) <= Var(X) / epsilon^2',
        'P(|X - E(X)| >= epsilon) >= Var(X) / epsilon^2',
        'P(|X - E(X)| >= epsilon) = Var(X) / epsilon',
        'P(|X - E(X)| >= epsilon) <= epsilon / Var(X)'
      ],
      correct: 0,
      explanation: 'Cebyseova nerovnost P(|X - E(X)| >= epsilon) <= Var(X)/epsilon^2 je plati pro jakekoli rozdeleni – staci znat E(X) a Var(X). Poskytuje horni odhad pravdepodobnosti odlehlych hodnot.'
    },
    {
      cat: 'statistics',
      catLabel: 'Statistika',
      catClass: 'cat-statistics',
      q: 'Centralni limitni veta (CLV) rika, ze:',
      answers: [
        'Prumer n i.i.d. velicin ma vzdy presne normalni rozdeleni.',
        'Soucet n i.i.d. velicin ma pri n → ∞ asymptoticky normalni rozdeleni N(0,1) po standardizaci.',
        'Velke mnozstvi dat vzdy pochazi z normalniho rozdeleni.',
        'Soucet nahodnych velicin ma vzdy Poissonovo rozdeleni.'
      ],
      correct: 1,
      explanation: 'CLV: Z_n = (suma X_k - n*mu) / (sigma * sqrt(n)) konverguje v rozdeleni k N(0,1) pro n → ∞. Veliciny musi byt i.i.d. s konecnym rozptylem. Vysledek je asymptoticky (priblizny), ne presny.'
    },
    {
      cat: 'statistics',
      catLabel: 'Statistika',
      catClass: 'cat-statistics',
      q: 'Empiricka distribucni funkce F_n(x) je definovana jako:',
      answers: [
        'Hustota pravdepodobnosti odhadnuta z dat pomoci jadra.',
        'Relativni cetnost hodnot vyberu mensich nebo rovnych x.',
        'Prumer hodnot vyberu mensich nez x.',
        'Kumulativni sucet absolutnich cetnosti delenych (n-1).'

  var questions = [];
  var questionStates = [];
  var current = 0;
  var score = 0;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(ALL_QUESTIONS);
    questionStates = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var order = shuffle([0, 1, 2, 3]);
      questionStates.push({
        answered: false,
        chosenIdx: -1,
        shuffledOrder: order
      });
    }
    current = 0;
    score = 0;
    document.getElementById('quizCard').style.display = '';
    document.getElementById('resultsPanel').style.display = 'none';
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[current];
    var state = questionStates[current];
    var total = questions.length;

    document.getElementById('progressBar').style.width = (((current) / total) * 100) + '%';
    document.getElementById('progressLabel').textContent = 'Otazka ' + (current + 1) + ' z ' + total;
    document.getElementById('scoreLabel').textContent = 'Skore: ' + score;

    var tag = document.getElementById('categoryTag');
    tag.textContent = q.catLabel;
    tag.className = 'category-tag ' + q.catClass;

    document.getElementById('questionText').textContent = q.q;

    var answersDiv = document.getElementById('answersDiv');
    answersDiv.innerHTML = '';

    var order = state.shuffledOrder;
    for (var k = 0; k < order.length; k++) {
      (function(k, origIdx) {
        var btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = q.answers[origIdx];
        btn.setAttribute('data-orig', origIdx);

        if (state.answered) {
          btn.disabled = true;
          if (origIdx === q.correct) {
            btn.classList.add('correct');
          } else if (origIdx === state.chosenIdx && state.chosenIdx !== q.correct) {
            btn.classList.add('wrong');
          }
        } else {
          btn.addEventListener('click', function() {
            onAnswer(origIdx);
          });
        }

        answersDiv.appendChild(btn);
      })(k, order[k]);
    }

    var explanation = document.getElementById('explanation');
    if (state.answered) {
      explanation.textContent = q.explanation;
      explanation.classList.add('visible');
    } else {
      explanation.textContent = '';
      explanation.classList.remove('visible');
    }

    var navRow = document.getElementById('navRow');
    var btnBack = document.getElementById('btnBack');
    var btnNext = document.getElementById('btnNext');

    if (state.answered) {
      navRow.classList.add('visible');
      btnBack.disabled = (current === 0);
      var isLast = (current === total - 1);
      if (isLast) {
        btnNext.textContent = 'Zobrazit vysledky';
        btnNext.disabled = false;
      } else {
        btnNext.textContent = 'Dalsi →';
        btnNext.disabled = false;
      }
    } else {
      if (current > 0) {
        navRow.classList.add('visible');
        btnBack.disabled = false;
        btnNext.disabled = true;
      } else {
        navRow.classList.remove('visible');
      }
    }
  }

  function onAnswer(origIdx) {
    var q = questions[current];
    var state = questionStates[current];
    if (state.answered) return;

    state.answered = true;
    state.chosenIdx = origIdx;
    if (origIdx === q.correct) score++;

    var btns = document.querySelectorAll('.answer-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = true;
      var idx = parseInt(btns[i].getAttribute('data-orig'));
      if (idx === q.correct) {
        btns[i].classList.add('correct');
      } else if (idx === origIdx) {
        btns[i].classList.add('wrong');
      }
    }

    document.getElementById('explanation').textContent = q.explanation;
    document.getElementById('explanation').classList.add('visible');

    var navRow = document.getElementById('navRow');
    var btnBack = document.getElementById('btnBack');
    var btnNext = document.getElementById('btnNext');

    navRow.classList.add('visible');
    btnBack.disabled = (current === 0);
    var isLast = (current === questions.length - 1);
    btnNext.textContent = isLast ? 'Zobrazit vysledky' : 'Dalsi →';
    btnNext.disabled = false;

    document.getElementById('scoreLabel').textContent = 'Skore: ' + score;
  }

  document.getElementById('btnBack').addEventListener('click', function() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  });

  document.getElementById('btnNext').addEventListener('click', function() {
    if (current === questions.length - 1) {
      showResults();
    } else {
      current++;
      renderQuestion();
    }
  });

  function showResults() {
    document.getElementById('quizCard').style.display = 'none';
    var panel = document.getElementById('resultsPanel');
    panel.style.display = 'block';

    var total = questions.length;
    var pct = Math.round((score / total) * 100);

    document.getElementById('resultPct').textContent = pct + '%';
    document.getElementById('resultDetail').textContent = 'Spravne: ' + score + ' z ' + total + ' otazek';

    var circle = document.getElementById('resultCircle');
    var msg = document.getElementById('resultMsg');
    circle.className = 'result-circle';

    if (pct >= 85) {
      circle.classList.add('result-excellent');
      msg.textContent = 'Vyborne! Latku zvladate perfektne.';
    } else if (pct >= 65) {
      circle.classList.add('result-good');
      msg.textContent = 'Dobry vysledek! Nektera temata zopakovat.';
    } else if (pct >= 45) {
      circle.classList.add('result-average');
      msg.textContent = 'Prumerne. Doporucujeme projit materialy znovu.';
    } else {
      circle.classList.add('result-poor');
      msg.textContent = 'Je potreba si latku radneji projit.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressLabel').textContent = 'Hotovo!';
    document.getElementById('scoreLabel').textContent = 'Skore: ' + score;
  }

  document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
  });

  initQuiz();
});
</script>
