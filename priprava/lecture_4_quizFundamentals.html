  }
  .summary-card {
    text-align: center;
    padding: 32px 22px;
  }
  .summary-card h2 {
    font-size: 22px;
    margin: 0 0 10px 0;
    color: #111827;
  }
  .summary-score {

<script>
document.addEventListener('DOMContentLoaded', function () {

  var categoryColors = {

    {

      explanation: 'Alice picks a random private value x, computes g^x mod p, and sends that public value to Bob. Bob does the same with y.'
    },
    {
      category: 'Diffie-Hellman',
      question: 'According to the lecture, what is it called when it is hard to find x given g^x mod p?',
      options: [
        'The factorization problem',
        'The Discrete Logarithm (DL) problem',
        'The elliptic curve problem',
        'The birthday problem'
      ],
      correct: 1,
      explanation: 'Recovering the private exponent x from the public value g^x mod p is the Discrete Logarithm problem, believed to be computationally hard.'
    },
    {
      category: 'Diffie-Hellman',
      question: 'What is the "Computational Diffie-Hellman problem"?',
      options: [
        'Given g^x and g^y, it is hard to find x or y',
        'Given g^x and g^y, it is hard to compute g^xy',
        'Given g^xy, it is hard to find g',
        'Given p, it is hard to find a generator g'
      ],
      correct: 1,
      explanation: 'The lecture states: given g^x and g^y it is hard to find g^xy - this is the Computational Diffie-Hellman (CDH) problem.'
    },
    {
      category: 'Diffie-Hellman',
      question: 'In the worked example with P = 13, G = 6, Alice private key = 5, what is Alice\'s public key (6^5 mod 13)?',
      options: [
        '9',
        '3',
        '2',
        '4'
      ],
      correct: 2,
      explanation: '6^5 = 7776, and 7776 mod 13 = 2, matching the slide\'s worked example.'
    },
    {
      category: 'Diffie-Hellman',
      question: 'In that same numeric example, what shared secret do Alice and Bob both compute?',
      options: [
        '2',
        '9',
        '13',
        '3'
      ],
      correct: 3,
      explanation: 'Both sides independently compute the shared secret as 3, showing the protocol produces a matching value on both ends.'
    },
    {
      category: 'DH Security',
      question: 'Against which type of attacker is plain Diffie-Hellman considered safe?',
      options: [
        'Active attackers',
        'Passive attackers observing the network',
        'Both active and passive attackers',
        'Neither active nor passive attackers'
      ],
      correct: 1,
      explanation: 'The lecture states DH is safe against passive attackers who merely observe traffic, but not against active attackers.'
    },
    {
      category: 'DH Security',
      question: 'Why is plain Diffie-Hellman vulnerable to man-in-the-middle attacks?',
      options: [
        'It uses weak prime numbers',
        'It does not offer authentication of the sender by default',
        'It transmits the private key in cleartext',
        'It requires a certificate authority to function'
      ],
      correct: 1,
      explanation: 'DH does not authenticate who sent a given public value, so an active attacker can intercept and replace it without detection.'
    },
    {
      category: 'DH Security',
      question: 'In the Diffie-Hellman man-in-the-middle attack diagram, who is the attacker positioned between Alice and Bob?',
      options: [
        'Trent',
        'Eve',
        'Mallory',
        'Oscar'
      ],
      correct: 2,
      explanation: 'The lecture diagram names the active man-in-the-middle attacker "Mallory", who negotiates separate secrets with Alice and Bob.'
    },
    {
      category: 'DH Security',
      question: 'How is Diffie-Hellman typically protected against man-in-the-middle attacks in practice today?',
      options: [
        'By choosing a larger prime p only',
        'By combining it with RSA/signatures to authenticate the exchanged public values',
        'By encrypting the exchanged values with AES',
        'By avoiding elliptic curves entirely'
      ],
      correct: 1,
      explanation: 'Nowadays DH is used together with RSA: the public exponents are signed, giving "authenticated Diffie-Hellman" and protection against MITM.'
    },
    {
      category: 'RSA vs DH',
      question: 'According to the lecture, why isn\'t RSA alone used instead of Diffie-Hellman for establishing session keys?',
      options: [
        'RSA cannot generate public/private key pairs',
        'RSA is comparatively slow and we want symmetric session keys such as AES',
        'RSA does not support authentication at all',
        'RSA requires elliptic curve parameters'
      ],
      correct: 1,
      explanation: 'The slides give two reasons: RSA is much slower than symmetric crypto, and we want a symmetric session key (e.g. for AES), which DH helps establish.'
    },
    {
      category: 'RSA vs DH',
      question: 'In the "Putting it all together" comparison table, which capabilities does Diffie-Hellman NOT provide?',
      options: [
        'Key exchange only is missing',
        'Encryption/decryption and digital signature',
        'Only digital signature is missing',
        'Only encryption/decryption is missing'
      ],
      correct: 1,
      explanation: 'The table marks Diffie-Hellman as "No" for both Encryption/Decryption and Digital Signature, and "Yes" only for Key Exchange.'
    },
    {
      category: 'RSA vs DH',
      question: 'Which algorithm(s) in the comparison table support all three: encryption/decryption, digital signature, AND key exchange?',
      options: [
        'Diffie-Hellman only',
        'RSA and Elliptic Curve',
        'Elliptic Curve only',
        'RSA only'
      ],
      correct: 1,
      explanation: 'The table shows both RSA and Elliptic Curve marked "Yes" across all three categories, unlike plain Diffie-Hellman.'
    },
    {
      category: 'Elliptic Curves',
      question: 'What is the general equation form of an elliptic curve used in cryptography, as shown in the lecture?',
      options: [
        'y = x^2 + ax + b',
        'y^2 = x^3 + ax + b',
        'x^2 + y^2 = r^2',
        'y^3 = x^2 + ax + b'
      ],
      correct: 1,
      explanation: 'The lecture defines elliptic curves as plane algebraic curves of the form y^2 = x^3 + ax + b.'
    },
    {
      category: 'Elliptic Curves',
      question: 'What is the main advantage of Elliptic Curve Cryptography (ECC) over RSA, according to the slides?',
      options: [
        'ECC cannot be broken under any circumstances',
        'ECC uses smaller keys for equivalent security, giving faster computation',
        'ECC does not require a private key',
        'ECC can only be used for digital signatures'
      ],
      correct: 1,
      explanation: 'ECC\'s main advantage listed is smaller sized keys while providing equivalent security, which means faster computation.'
    },
    {
      category: 'Elliptic Curves',
      question: 'What mathematical problem underlies the security of elliptic curve cryptography?',
      options: [
        'The integer factorization problem',
        'The elliptic curve discrete logarithm problem',
        'The subset sum problem',
        'The traveling salesman problem'
      ],
      correct: 1,
      explanation: 'ECC security is based on the elliptic curve discrete logarithm problem: finding the discrete log of a curve element is infeasible.'
    },
    {
      category: 'Elliptic Curves',
      question: 'Which NIST Suite B algorithm is used for key exchange based on elliptic curves?',
      options: [
        'ECDSA',
        'ECDH',
        'RSA-OAEP',
        'AES-GCM'
      ],
      correct: 1,
      explanation: 'The lecture lists Elliptic Curve Diffie-Hellman (ECDH) as the Suite B algorithm for key exchange.'
    },
    {
      category: 'Elliptic Curves',
      question: 'Which NIST Suite B algorithm is used for digital signatures based on elliptic curves?',
      options: [
        'ECDH',
        'ECDSA',
        'HMAC',
        'Plain Diffie-Hellman'
      ],
      correct: 1,
      explanation: 'The Elliptic Curve Digital Signature Algorithm (ECDSA) is listed as the Suite B algorithm for digital signatures.'
    },
    {
      category: 'Certificates',
      question: 'What does a public-key certificate primarily consist of?',
      options: [
        'Only the private key of the owner',
        'A public key plus the user ID of the owner, with the block signed by a trusted third party',
        'A symmetric session key generated by AES',
        'A hash of the message only'
      ],
      correct: 1,
      explanation: 'A certificate binds a public key to a user ID, and the whole block is signed by a trusted third party (the CA).'
    },
    {
      category: 'Certificates',
      question: 'What is the role of a Certificate Authority (CA)?',
      options: [
        'It generates AES session keys for VPN tunnels',
        'It is a trusted third party that signs certificates, binding public keys to identities',
        'It performs the HMAC calculation for message integrity',
        'It stores users\' private keys centrally'
      ],
      correct: 1,
      explanation: 'The CA is a trusted third party (e.g. a government agency or financial institution) that signs users\' public keys to produce certificates.'
    },
    {
      category: 'Certificates',
      question: 'Why can certificates be placed in a public directory without special protection, according to the lecture?',
      options: [
        'Because they are encrypted with AES',
        'Because they are unforgeable - only the CA can modify them without detection',
        'Because they automatically expire after one day',
        'Because they never contain identifying information'
      ],
      correct: 1,
      explanation: 'Because no party other than the CA can modify a certificate undetected, certificates are unforgeable and safe to distribute openly.'
    },
    {
      category: 'Certificates',
      question: 'Which of the following is NOT part of the X.509 certificate structure described in the lecture?',
      options: [
        'Version Number',
        'Subject Public Key Info',
        'A symmetric AES session key',
        'Certificate Signature'
      ],
      correct: 2,
      explanation: 'X.509 certificates hold identity and public-key information plus a signature - they do not carry a symmetric session key.'
    },
    {
      category: 'HMAC',
      question: 'What is the main goal of HMAC, according to the lecture?',
      options: [
        'To encrypt a message for confidentiality',
        'To achieve authenticated integrity of a sent message',
        'To exchange a shared secret between two parties',
        'To generate digital certificates'
      ],
      correct: 1,
      explanation: 'HMAC\'s stated goal is authenticated integrity: proving that a message has not been tampered with.'
    },
    {
      category: 'HMAC',
      question: 'What does the receiver do to verify a message protected with HMAC?',
      options: [
        'Decrypt the message using the sender\'s public key',
        'Recalculate the HMAC using the shared key and check whether it matches the received HMAC',
        'Compare the length of the received message only',
        'Check the expiry date on a certificate'
      ],
      correct: 1,
      explanation: 'The receiver recomputes the HMAC over the received message using the shared key, and if it matches, the message is authentic and unaltered.'
    },
    {
      category: 'HMAC',
      question: 'What is required as a prerequisite for using the HMAC algorithm?',
      options: [
        'A public/private key pair',
        'A pre-shared key',
        'A certificate authority',
        'An elliptic curve group'
      ],
      correct: 1,
      explanation: 'HMAC requires a pre-shared key that both sender and receiver use to generate and verify the MAC value.'
    },
    {
      category: 'Security Goals',
      question: 'According to the lecture\'s Security Goals table, which primitives achieve confidentiality?',
      options: [
        'HMAC and SHA-1',
        'AES (symmetric) and RSA/ECC (asymmetric)',
        'Diffie-Hellman only',
        'Certificates only'
      ],
      correct: 1,
      explanation: 'Confidentiality is achieved via symmetric crypto like AES and asymmetric crypto like RSA/ECC.'
    },
    {
      category: 'Security Goals',
      question: 'Which primitives achieve integrity according to the Security Goals table?',
      options: [
        'RSA and ECC digital signatures',
        'SHA-1/MD5 (hashing) and HMAC',
        'Diffie-Hellman',
        'AES only'
      ],
      correct: 1,
      explanation: 'Integrity (detecting changes) is achieved through hashing algorithms like SHA-1/MD5 and through HMAC.'
    },
    {
      category: 'Security Goals',
      question: 'Which primitives achieve the "Key Exchange" security goal according to the table?',
      options: [
        'Diffie-Hellman and RSA/ECC',
        'HMAC only',
        'SHA-1/MD5 only',
        'X.509 certificates only'
      ],
      correct: 0,
      explanation: 'The Security Goals table lists Diffie-Hellman and RSA/ECC as achieving secure key exchange, e.g. during a TLS handshake.'
    },

      category: 'VPN Design',
      question: 'In the VPN tunnel example, what is used first to authenticate the corporate VPN server to the client?',
      options: [
        'An HMAC key',
        'An RSA/ECC public key certificate',
        'A shared AES key',
        'A certificate revocation list'
      ],
      correct: 1,
      explanation: 'The server first presents an RSA public key certificate so the client can be sure it is talking to the real VPN server.'
    },
    {
      category: 'VPN Design',
      question: 'In the VPN example, what is derived from the Diffie-Hellman shared secret to produce the AES and HMAC keys?',

        'The client\'s own certificate',
        'The CA\'s digital signature'

      correct: 1,
      explanation: 'The Master Secret is computed as a hash of the DH shared secret, and the AES and HMAC keys are then derived from that Master Secret.'

        'Data integrity',

      correct: 1,

    },
    {
      category: 'VPN Design',
      question: 'In the VPN packet-sending steps, what order are the cryptographic operations applied to outgoing data?',
      options: [
        'Sign the data, then hash it, then send',
        'Encrypt the data with AES, then compute an HMAC over the encrypted blob, then send both plus the IV',

      ],
      correct: 1,
      explanation: 'The lecture\'s steps are: encrypt with AES-256 to get an encrypted blob, then compute HMAC-SHA256 over that blob to get a tag, then send blob + IV + tag.'

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  var order = shuffleArray(questions.map(function (q, i) { return i; }));
  var total = order.length;

  var states = [];
  for (var i = 0; i < total; i++) {
    states.push({
      answered: false,
      selectedShuffledPos: null,
      optionOrder: null
    });
  }

  var viewIndex = 0;
  var furthestIndex = 0;
  var finished = false;

  var topBar = document.getElementById('topBar');
  var progressInner = document.getElementById('progressInner');
  var quizArea = document.getElementById('quizArea');

  function countAnsweredCorrect() {
    var correctCount = 0;
    var answeredCount = 0;
    for (var i = 0; i < states.length; i++) {
      if (states[i].answered) {
        answeredCount++;
        var qIdx = order[i];
        var q = questions[qIdx];
        var chosenOriginal = states[i].optionOrder[states[i].selectedShuffledPos];
        if (chosenOriginal === q.correct) {
          correctCount++;
        }
      }
    }
    return { correct: correctCount, answered: answeredCount };
  }

  function updateTopBarAndProgress() {
    var stats = countAnsweredCorrect();
    topBar.textContent = '';
    var scoreSpan = document.createElement('span');
    scoreSpan.textContent = 'Score: ' + stats.correct + ' / ' + stats.answered;
    var posSpan = document.createElement('span');
    posSpan.textContent = 'Question ' + (viewIndex + 1) + ' of ' + total;
    topBar.appendChild(posSpan);
    topBar.appendChild(scoreSpan);
    var pct = Math.round((stats.answered / total) * 100);
    progressInner.style.width = pct + '%';
  }

  function renderQuestion() {
    quizArea.textContent = '';
    updateTopBarAndProgress();

    var qIdx = order[viewIndex];
    var q = questions[qIdx];
    var state = states[viewIndex];

    if (state.optionOrder === null) {
      state.optionOrder = shuffleArray([0, 1, 2, 3]);
    }

    var card = document.createElement('div');
    card.className = 'card';
    card.style.color = '#111827';

    var badge = document.createElement('span');
    badge.className = 'category-badge';
    var color = categoryColors[q.category];
    if (!color) {
      color = '#6b7280';
    }
    badge.style.backgroundColor = color;
    badge.textContent = q.category;
    card.appendChild(badge);

    var qText = document.createElement('p');
    qText.className = 'question-text';
    qText.textContent = q.question;
    card.appendChild(qText);

    var buttons = [];
    for (var i = 0; i < 4; i++) {
      var originalIdx = state.optionOrder[i];
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.type = 'button';
      btn.textContent = q.options[originalIdx];

      (function (buttonRef, shuffledPos, origIdx) {
        buttonRef.addEventListener('click', function () {
          if (state.answered) {
            return;
          }
          state.answered = true;
          state.selectedShuffledPos = shuffledPos;
          if (viewIndex === furthestIndex && furthestIndex < total - 1) {
            furthestIndex++;
          }
          renderQuestion();
        });
      })(btn, i, originalIdx);

      buttons.push(btn);
      card.appendChild(btn);
    }

    if (state.answered) {
      for (var j = 0; j < 4; j++) {
        buttons[j].disabled = true;
        var origIdx2 = state.optionOrder[j];
        if (origIdx2 === q.correct) {
          buttons[j].classList.add('correct-answer');
        } else if (j === state.selectedShuffledPos) {
          buttons[j].classList.add('wrong-answer');
        }
      }

      var explanation = document.createElement('div');
      explanation.className = 'explanation';
      var strongLabel = document.createElement('strong');
      var chosenOriginal2 = state.optionOrder[state.selectedShuffledPos];
      if (chosenOriginal2 === q.correct) {
        strongLabel.textContent = 'Correct! ';
      } else {
        strongLabel.textContent = 'Not quite. ';
      }
      explanation.appendChild(strongLabel);
      var explanationText = document.createElement('span');
      explanationText.textContent = q.explanation;
      explanation.appendChild(explanationText);
      card.appendChild(explanation);
    }

    quizArea.appendChild(card);

    var navRow = document.createElement('div');
    navRow.className = 'nav-row';

    var backBtn = document.createElement('button');
    backBtn.className = 'nav-btn secondary';
    backBtn.type = 'button';
    backBtn.textContent = '\u2190 Back';
    backBtn.disabled = (viewIndex === 0);
    backBtn.addEventListener('click', function () {
      if (viewIndex > 0) {
        viewIndex--;
        renderQuestion();
      }
    });
    navRow.appendChild(backBtn);

    var isLast = (viewIndex === total - 1);
    var nextBtn = document.createElement('button');
    nextBtn.className = 'nav-btn';
    nextBtn.type = 'button';

    if (isLast) {
      nextBtn.textContent = 'See Results';
      nextBtn.disabled = !state.answered;
      nextBtn.addEventListener('click', function () {
        if (states[total - 1].answered) {
          showSummary();
        }
      });
    } else {
      nextBtn.textContent = 'Next \u2192';
      var canGoNext = (viewIndex < furthestIndex);
      nextBtn.disabled = !canGoNext;
      nextBtn.addEventListener('click', function () {
        if (viewIndex < furthestIndex) {
          viewIndex++;
          renderQuestion();
        }
      });
    }
    navRow.appendChild(nextBtn);

    quizArea.appendChild(navRow);
  }

  function showSummary() {
    finished = true;
    quizArea.textContent = '';
    topBar.textContent = '';
    progressInner.style.width = '100%';

    var stats = countAnsweredCorrect();
    var pct = Math.round((stats.correct / total) * 100);

    var card = document.createElement('div');
    card.className = 'card summary-card';

    var heading = document.createElement('h2');
    heading.textContent = 'Quiz Complete!';
    card.appendChild(heading);

    var scoreDiv = document.createElement('div');
    scoreDiv.className = 'summary-score';
    scoreDiv.textContent = pct + '%';
    card.appendChild(scoreDiv);

    var detail = document.createElement('div');
    detail.className = 'summary-detail';
    detail.textContent = 'You answered ' + stats.correct + ' out of ' + total + ' questions correctly.';
    card.appendChild(detail);

    var restartBtn = document.createElement('button');
    restartBtn.className = 'restart-btn';
    restartBtn.type = 'button';
    restartBtn.textContent = 'Restart Quiz';
    restartBtn.addEventListener('click', function () {
      window.location.reload();
    });
    card.appendChild(restartBtn);

    quizArea.appendChild(card);
  }

  renderQuestion();
});
</script>
</body>
</html>
