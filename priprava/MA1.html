<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kviz: MA1 – Funkce, integraly, rady</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f4f8;
    color: #111827;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .shell {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #111827;
    letter-spacing: -0.02em;
  }

  header p {
    margin-top: 6px;
    font-size: 0.9rem;
    color: #4b5563;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 24px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #4b5563;
    margin-bottom: 6px;
  }

  .progress-bar-bg {
    height: 6px;
    background: #d1d5db;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #2563eb;
    border-radius: 99px;
    transition: width 0.35s ease;
  }

  /* Score chip */
  .score-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #dbeafe;
    color: #1d4ed8;
    font-weight: 600;
    font-size: 0.82rem;
    padding: 4px 12px;
    border-radius: 99px;
  }

  /* Card */
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
    color: #111827;
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .tag {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    color: #ffffff;
    white-space: nowrap;
  }

  .q-number {
    font-size: 0.78rem;
    color: #6b7280;
    margin-left: auto;
    white-space: nowrap;
  }

  .question-text {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.55;
    color: #111827;
    margin-bottom: 20px;
  }

  /* Answers */
  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .answer-btn {
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
    font-size: 0.92rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a2e;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1.45;
  }

  .answer-btn:not(:disabled):hover {
    background: #eff6ff;
    border-color: #93c5fd;
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    background: #d1fae5;
    border-color: #34d399;
    color: #064e3b;
  }

  .answer-btn.wrong {
    background: #fee2e2;
    border-color: #f87171;
    color: #7f1d1d;
  }

  .answer-btn.neutral-disabled {
    background: #f3f4f6;
    border-color: #d1d5db;
    color: #6b7280;
  }

  /* Explanation */
  .explanation {
    background: #fefce8;
    border-left: 4px solid #fbbf24;
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    font-size: 0.875rem;
    line-height: 1.55;
    color: #1c1917;
    display: none;
    margin-bottom: 4px;
  }

  .explanation.visible {
    display: block;
  }

  /* Navigation */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 12px;
  }

  .nav-btn {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    color: #ffffff;
  }

  .nav-btn.back {
    background: #6b7280;
    color: #ffffff;
  }

  .nav-btn.back:hover:not(:disabled) {
    background: #4b5563;
  }

  .nav-btn.next {
    background: #2563eb;
    color: #ffffff;
  }

  .nav-btn.next:hover:not(:disabled) {
    background: #1d4ed8;
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .nav-hidden {
    visibility: hidden;
  }

  /* Results */
  .results {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
    text-align: center;
    display: none;
    color: #111827;
  }

  .results.visible {
    display: block;
  }

  .result-emoji {
    font-size: 3.5rem;
    margin-bottom: 12px;
  }

  .result-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 8px;
  }

  .result-pct {
    font-size: 3.2rem;
    font-weight: 800;
    color: #2563eb;
    margin: 12px 0 4px;
  }

  .result-sub {
    color: #4b5563;
    font-size: 0.9rem;
    margin-bottom: 28px;
  }

  .result-restart {
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background 0.15s;
  }

  .result-restart:hover {
    background: #1d4ed8;
  }

  /* Tag colors */
  .tag-suprema  { background: #7c3aed; }
  .tag-funkce   { background: #0891b2; }
  .tag-limita   { background: #0d9488; }
  .tag-spojitost{ background: #16a34a; }
  .tag-derivace { background: #d97706; }
  .tag-integral { background: #dc2626; }
  .tag-rady     { background: #9333ea; }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    body {
      background: #0f172a;
      color: #f1f5f9;
    }
    header h1 { color: #f1f5f9; }
    header p  { color: #94a3b8; }
    .progress-meta { color: #94a3b8; }
    .progress-bar-bg { background: #334155; }
    .progress-bar-fill { background: #3b82f6; }
    .score-chip { background: #1e3a5f; color: #93c5fd; }
    .card { background: #1e293b; box-shadow: 0 1px 4px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2); color: #f1f5f9; }
    .q-number { color: #94a3b8; }
    .question-text { color: #f1f5f9; }
    .answer-btn { background: #0f172a; border-color: #334155; color: #e2e8f0; }
    .answer-btn:not(:disabled):hover { background: #1e3a5f; border-color: #3b82f6; }
    .answer-btn.correct { background: #052e16; border-color: #34d399; color: #bbf7d0; }
    .answer-btn.wrong   { background: #450a0a; border-color: #f87171; color: #fecaca; }
    .answer-btn.neutral-disabled { background: #1e293b; border-color: #334155; color: #64748b; }
    .explanation { background: #1c1a05; border-color: #f59e0b; color: #fef9c3; }
    .nav-btn.back { background: #374151; color: #f1f5f9; }
    .nav-btn.back:hover:not(:disabled) { background: #4b5563; }
    .nav-btn.next { background: #2563eb; color: #ffffff; }
    .results { background: #1e293b; color: #f1f5f9; }
    .result-title { color: #f1f5f9; }
    .result-pct   { color: #60a5fa; }
    .result-sub   { color: #94a3b8; }
  }

  @media (max-width: 480px) {
    .card { padding: 20px 16px 18px; }
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 0.95rem; }
    .answer-btn { font-size: 0.87rem; padding: 10px 13px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>MA1 – Funkce, integraly, rady</h1>
    <p>B0B01MA1 &nbsp;·&nbsp; 20 otazek ze vsech tematu</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">Otazka 1 z 20</span>
      <span class="score-chip" id="score-chip">Skore: 0 / 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="card" id="quiz-card">
    <div class="card-top">
      <span class="tag" id="tag-el"></span>
      <span class="q-number" id="q-number-el"></span>
    </div>
    <div class="question-text" id="question-el"></div>
    <div class="answers" id="answers-el"></div>
    <div class="explanation" id="explanation-el"></div>
    <div class="nav-row">
      <button class="nav-btn back" id="btn-back">&#8592; Zpet</button>
      <button class="nav-btn next nav-hidden" id="btn-next">Dalsi &#8594;</button>
    </div>
  </div>

  <div class="results" id="results-panel">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-title">Kviz dokoncen!</div>
    <div class="result-pct" id="result-pct"></div>
    <div class="result-sub" id="result-sub"></div>
    <button class="result-restart" id="btn-restart">Spustit znovu</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var QUESTIONS = [
    {
      category: 'Suprema a infima',
      tagClass: 'tag-suprema',
      text: 'Co je supremum mnoziny M?',
      answers: [
        'Nejmensi prvek mnoziny M',
        'Nejmensi cislo, ktere je vetsi nebo rovno vsem prvkum mnoziny',
        'Nejvetsi prvek mnoziny M',
        'Nejvetsi cislo, ktere je mensi nebo rovno vsem prvkum mnoziny'
      ],
      correct: 1,
      explanation: 'Supremum je nejmensi horni mez mnoziny. Nemusi byt prvkem mnoziny – napr. sup(0,1) = 1, ale 1 do otevreneho intervalu (0,1) nepatri.'
    },
    {
      category: 'Suprema a infima',
      tagClass: 'tag-suprema',
      text: 'Pro otevreny interval (0, 1), ktere tvrzeni je spravne?',
      answers: [
        'max = 1, min = 0',
        'sup = 1, inf = 0, maximum ani minimum neexistuje',
        'sup = 0, inf = 1',
        'sup = 1, max = 1, min = 0'
      ],
      correct: 1,
      explanation: 'U otevreneho intervalu okrajove body do mnoziny nepatri, takze maximum ani minimum neexistuje. Supremum je 1 a infimum je 0 – jsou to nejmensi horni, resp. nejvetsi dolni meze.'
    },
    {
      category: 'Suprema a infima',
      tagClass: 'tag-suprema',
      text: 'Ktere z nasledujicich tvrzeni o mnozine B = N (prirozena cisla) je pravdive?',
      answers: [
        'B je omezena shora i zdola',
        'B je omezena zdola, ale ne shora',
        'B neni omezena zdola ani shora',
        'B je omezena shora, ale ne zdola'
      ],
      correct: 1,
      explanation: 'Prirozena cisla zacobinaji od 0 (nebo 1), takze maji dolni mez – jsou omezena zdola (inf N = 0). Shora vsak omezena nejsou, protoze N roste nade vsechny meze.'
    },
    {
      category: 'Funkce',
      tagClass: 'tag-funkce',
      text: 'Kdy ma funkce f: A -> B inverzni funkci?',
      answers: [
        'Vzdy, kdyz je surjektivni (na)',
        'Vzdy, kdyz je injektivni (prosta)',
        'Pouze kdyz je bijektivni (prosta i na)',
        'Pouze kdyz je definovana na celem R'
      ],
      correct: 1,
      explanation: 'Inverzni funkce existuje prave tehdy, kdyz je funkce prosta (injektivni) – kazdy prvek oboru hodnot ma nejvyse jeden vzor. Surjektivita neni nutna podminka pro existenci inverze na R(f).'
    },
    {
      category: 'Funkce',
      tagClass: 'tag-funkce',
      text: 'Funkce f(x) = x * e^x ma lokalni minimum v bode:',
      answers: [
        'x = 0',
        'x = 1',
        'x = -1',
        'x = e'
      ],
      correct: 2,
      explanation: 'Derivace f\'(x) = e^x(1+x) = 0 prave pro x = -1. Druha derivace f\'\'(-1) = e^{-1} > 0, tedy jde o lokalni minimum. Hodnota minima je f(-1) = -1/e.'
    },
    {
      category: 'Funkce',
      tagClass: 'tag-funkce',
      text: 'Co plati pro grafy funkce a jeji inverzni funkce?',
      answers: [
        'Jsou totozne',
        'Jsou symetricke podle osy x',
        'Jsou symetricke podle primky y = x',
        'Jsou symetricke podle osy y'
      ],
      correct: 2,
      explanation: 'Graf inverzni funkce ziskame zrcadlenim puvodniho grafu podle primky y = x. Tato primka je osou prvniho a tretiho kvadrantu.'
    },
    {
      category: 'Funkce',
      tagClass: 'tag-funkce',
      text: 'Ktera z nasledujicich funkci je suda?',
      answers: [
        'f(x) = x^3',
        'f(x) = x',
        'f(x) = x^2',
        'f(x) = x * e^x'
      ],
      correct: 2,
      explanation: 'Suda funkce splnuje f(-x) = f(x). Pro f(x) = x^2 plati f(-x) = (-x)^2 = x^2 = f(x). Funkce x^3 je licha, ostatni nejsou ani sude ani liche.'
    },
    {
      category: 'Limita',
      tagClass: 'tag-limita',
      text: 'L\'Hospitalovo pravidlo se pouziva, kdyz nastane neurciity tvar:',
      answers: [
        'Pouze 0/0',
        'Pouze inf/inf',
        '0/0 nebo inf/inf',
        'Jakekoliv podeli funkci'
      ],
      correct: 2,
      explanation: 'L\'Hospitalovo pravidlo plati prave pro neurcite tvary 0/0 a inf/inf. Naplnuje-li se tato podminka, muze se derivovat citatel a jmenovatel zvlast.'
    },
    {
      category: 'Limita',
      tagClass: 'tag-limita',
      text: 'Kolik limit muze mit funkce v danem bode?',
      answers: [
        'Libovolne mnoho',
        'Nejvyse dve (leva a prava)',
        'Prave jednu – limita je vzdy jednoznacna',
        'Zadnou, pokud je funkce nespojita'
      ],
      correct: 2,
      explanation: 'Limita je vzdy jednoznacna. Kdybychom predpokladali dve ruzne limity b a c, jejich okoli by musela byt disjunktni, coz by odporovalo definici limity.'
    },
    {
      category: 'Limita',
      tagClass: 'tag-limita',
      text: 'Jaka je hodnota limity lim_{x->inf} (ln x) / x?',
      answers: [
        'nekonecno',
        '1',
        '0',
        'e'
      ],
      correct: 2,
      explanation: 'Tvar je inf/inf, pouzijeme L\'Hospital: (1/x)/1 = 1/x -> 0. Exponencialni rust x tedy dominuje logaritmicke rustici ln x.'
    },
    {
      category: 'Spojitost',
      tagClass: 'tag-spojitost',
      text: 'Funkce f je spojita v bode x_0, pokud:',
      answers: [
        'Je definovana v x_0',
        'Existuje limita v x_0',
        'Je definovana v x_0, existuje limita v x_0 a tato limita se rovna f(x_0)',
        'Jeji derivace v x_0 existuje'
      ],
      correct: 2,
      explanation: 'Vsechny tri podminky musi byt splneny zaroven: f(x_0) je definovana, limita existuje, a lim_{x->x_0} f(x) = f(x_0). Samo splneni jedne nebo dvou podminek nestaci.'
    },
    {
      category: 'Spojitost',
      tagClass: 'tag-spojitost',
      text: 'Co rika veta o mezihodnotach pro spojitou funkci na intervalu?',
      answers: [
        'Funkce nabyvá maxima a minima pouze v krajnich bodech',
        'Funkce nabyvá vsech hodnot mezi svym minimem a maximem na danem intervalu',
        'Funkce je na kazdem intervalu monotonni',
        'Spojita funkce nema zadne extrémy'
      ],
      correct: 1,
      explanation: 'Veta o mezihodnotach (Bolzano-Cauchyho) rika: je-li f spojita na I a nabyvá hodnot m a M, pak nabyvá kazde hodnoty z intervalu <m, M>. To zarucuje napr. existenci nuloveho bodu.'
    },
    {
      category: 'Derivace',
      tagClass: 'tag-derivace',
      text: 'Jaky je vzorec pro derivaci soucinu dvou funkci (f * g)\'?',
      answers: [
        'f\' * g\'',
        'f\' * g + f * g\'',
        '(f\' * g - f * g\') / g^2',
        'f\' + g\''
      ],
      correct: 1,
      explanation: 'Leibnizovo pravidlo pro soucin: (f*g)\' = f\'*g + f*g\'. Pozor – nestaci derivovat obe funkce zvlast a vynasobit, jak se casto mylne predpoklada.'
    },
    {
      category: 'Derivace',
      tagClass: 'tag-derivace',
      text: 'Co geometricky predstavuje derivace f\'(a)?',
      answers: [
        'Plocha pod grafem funkce v bode a',
        'Smernice tecny ke grafu funkce v bode a',
        'Hodnota funkce v bode a',
        'Vzdalenost grafu od osy x'
      ],
      correct: 1,
      explanation: 'Derivace f\'(a) je limita pomerne zmeny, ktera odpovida smernici tecny v bode [a, f(a)]. Geometricky vyjadruje sklon grafu v danem bode.'
    },
    {
      category: 'Derivace',
      tagClass: 'tag-derivace',
      text: 'Plati-li f\'(a) = 0 a f\'\'(a) > 0, pak f ma v bode a:',
      answers: [
        'Lokalni maximum',
        'Inflexi',
        'Lokalni minimum',
        'Zadny extre – jde o sedlovy bod'
      ],
      correct: 2,
      explanation: 'Kdyz prvni derivace je nula (stacionarni bod) a druha derivace je kladna (funkce je v dane oblasti konvexni), jde o lokalni minimum. Pro lokalni maximum musi byt f\'\'(a) < 0.'
    },
    {
      category: 'Integral',
      tagClass: 'tag-integral',
      text: 'Newton-Leibnizova formula rika, ze:',
      answers: [
        'int_a^b f(x)dx = F(a) - F(b)',
        'int_a^b f(x)dx = F(b) - F(a), kde F je primitivni funkce k f',
        'int_a^b f(x)dx = f(b) - f(a)',
        'int_a^b f(x)dx = f\'(b) - f\'(a)'
      ],
      correct: 1,
      explanation: 'Newton-Leibnizova formula propojuje urcity integral s primitivni funkci: int_a^b f(x)dx = F(b) - F(a). Staci tedy najit jednu primitivni funkci F a dosadit meze.'
    },
    {
      category: 'Integral',
      tagClass: 'tag-integral',
      text: 'Jaka je primitivni funkce k f(x) = sin(x)?',
      answers: [
        'cos(x) + C',
        '-cos(x) + C',
        'sin(x) + C',
        '-sin(x) + C'
      ],
      correct: 1,
      explanation: 'Protoze (cos x)\' = -sin x, plati ze (-cos x)\' = sin x. Proto int sin(x)dx = -cos(x) + C. Casto se pri derivovani trigonometrickych funkci zameni znamenko.'
    },
    {
      category: 'Integral',
      tagClass: 'tag-integral',
      text: 'Metoda integrace per partes je zvlaste vhodna pro:',
      answers: [
        'Integraci souctu dvou funkci',
        'Integraci soucinu dvou funkci, kdyz jednu snadno derivujeme a druhou integrujeme',
        'Integraci slozene funkce pres substituci',
        'Integraci racionalnich funkci'
      ],
      correct: 1,
      explanation: 'Per partes: int u dv = uv - int v du. Typicky se pouziva pro souciny jako x*e^x, x*sin(x), ln(x). Jednu cast zvolime jako u (derivujeme), druhou jako dv (integrujeme).'
    },
    {
      category: 'Rady',
      tagClass: 'tag-rady',
      text: 'Nutna podminka konvergence rady sum a_n rika:',
      answers: [
        'Cleny a_n musi byt kladne',
        'lim_{n->inf} a_n = 0',
        'Rada musi byt absolutne konvergentni',
        'Cleny a_n musi byt klesajici'
      ],
      correct: 1,
      explanation: 'Nutna podminka: clen a_n musi jit k nule. Ale pozor – tato podminka nestaci! Harmonicka rada splnuje a_n = 1/n -> 0, ale presto diverguje.'
    },
    {
      category: 'Rady',
      tagClass: 'tag-rady',
      text: 'Geometricka rada sum_{n=0}^inf q^n konverguje, pokud:',
      answers: [
        '|q| > 1',
        '|q| = 1',
        '|q| < 1',
        'q > 0'
      ],
      correct: 2,
      explanation: 'Geometricka rada konverguje prave tehdy, kdyz |q| < 1. Jeji soucet je pak a_0 / (1-q). Pro |q| >= 1 rada diverguje.'
    },
    {
      category: 'Rady',
      tagClass: 'tag-rady',
      text: 'Leibnizovo kriterium se pouziva pro:',
      answers: [
        'Rady s kladnymi cleny',
        'Geometricke rady',
        'Alternujici rady, kde cleny klesaji k nule',
        'Rady obsahujici faktorial'
      ],
      correct: 2,
      explanation: 'Leibnizovo kriterium plati pro alternujici rady tvaru sum (-1)^n * a_n, kde a_n je nerostouci a konverguje k nule. Klasicky priklad: alternujici harmonicka rada sum (-1)^{n+1}/n konverguje (ale ne absolutne).'
    }
  ];

  // State
  var shuffledQuestions = [];
  var current = 0;
  var score = 0;
  var answered = 0;
  // Per-question state: {answered: bool, chosen: int|null, shuffledOrder: int[]}
  var qState = [];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    shuffledQuestions = shuffle(QUESTIONS.slice());
    current = 0;
    score = 0;
    answered = 0;
    qState = shuffledQuestions.map(function() {
      return { answered: false, chosen: null, shuffledOrder: null };
    });

    document.getElementById('quiz-card').style.display = '';
    document.getElementById('results-panel').classList.remove('visible');
    renderQuestion();
  }

  function renderQuestion() {
    var q = shuffledQuestions[current];
    var state = qState[current];
    var total = shuffledQuestions.length;

    // Progress
    document.getElementById('prog-label').textContent = 'Otazka ' + (current + 1) + ' z ' + total;
    document.getElementById('score-chip').textContent = 'Skore: ' + score + ' / ' + answered;
    var pct = Math.round((current / total) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';

    // Tag
    var tagEl = document.getElementById('tag-el');
    tagEl.textContent = q.category;
    tagEl.className = 'tag ' + q.tagClass;

    document.getElementById('q-number-el').textContent = (current + 1) + ' / ' + total;
    document.getElementById('question-el').textContent = q.text;

    // Build shuffled order once per question
    if (!state.shuffledOrder) {
      state.shuffledOrder = shuffle([0, 1, 2, 3]);
    }
    var order = state.shuffledOrder;

    var answersEl = document.getElementById('answers-el');
    answersEl.innerHTML = '';

    order.forEach(function(origIdx) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIdx];
      btn.setAttribute('data-orig', origIdx);

      if (state.answered) {
        btn.disabled = true;
        if (origIdx === q.correct) {
          btn.classList.add('correct');
        } else if (origIdx === state.chosen) {
          btn.classList.add('wrong');
        } else {
          btn.classList.add('neutral-disabled');
        }
      } else {
        btn.addEventListener('click', function() { handleAnswer(origIdx); });
      }
      answersEl.appendChild(btn);
    });

    // Explanation
    var expEl = document.getElementById('explanation-el');
    if (state.answered) {
      expEl.textContent = q.explanation;
      expEl.classList.add('visible');
    } else {
      expEl.textContent = '';
      expEl.classList.remove('visible');
    }

    // Back button
    var btnBack = document.getElementById('btn-back');
    btnBack.disabled = (current === 0);

    // Next button
    var btnNext = document.getElementById('btn-next');
    if (state.answered) {
      btnNext.classList.remove('nav-hidden');
      if (current === total - 1) {
        btnNext.textContent = 'Vysledky';
      } else {
        btnNext.textContent = 'Dalsi \u2192';
      }
    } else {
      btnNext.classList.add('nav-hidden');
    }
  }

  function handleAnswer(chosenIdx) {
    var q = shuffledQuestions[current];
    var state = qState[current];
    if (state.answered) return;

    state.answered = true;
    state.chosen = chosenIdx;
    answered++;
    if (chosenIdx === q.correct) score++;

    // Update score chip immediately
    document.getElementById('score-chip').textContent = 'Skore: ' + score + ' / ' + answered;

    // Update buttons
    var buttons = document.querySelectorAll('#answers-el .answer-btn');
    buttons.forEach(function(btn) {
      var origIdx = parseInt(btn.getAttribute('data-orig'), 10);
      btn.disabled = true;
      if (origIdx === q.correct) {
        btn.classList.add('correct');
      } else if (origIdx === chosenIdx) {
        btn.classList.add('wrong');
      } else {
        btn.classList.add('neutral-disabled');
      }
    });

    // Show explanation
    var expEl = document.getElementById('explanation-el');
    expEl.textContent = q.explanation;
    expEl.classList.add('visible');

    // Show next button
    var btnNext = document.getElementById('btn-next');
    btnNext.classList.remove('nav-hidden');
    if (current === shuffledQuestions.length - 1) {
      btnNext.textContent = 'Vysledky';
    } else {
      btnNext.textContent = 'Dalsi \u2192';
    }
  }

  function showResults() {
    document.getElementById('quiz-card').style.display = 'none';
    var panel = document.getElementById('results-panel');
    panel.classList.add('visible');

    var pct = Math.round((score / shuffledQuestions.length) * 100);
    document.getElementById('result-pct').textContent = pct + '%';
    document.getElementById('result-sub').textContent = 'Spravne: ' + score + ' z ' + shuffledQuestions.length + ' otazek';

    var emoji, msg;
    if (pct >= 90) { emoji = '\uD83C\uDF89'; }
    else if (pct >= 70) { emoji = '\uD83D\uDCAA'; }
    else if (pct >= 50) { emoji = '\uD83D\uDC4D'; }
    else { emoji = '\uD83D\uDCDA'; }
    document.getElementById('result-emoji').textContent = emoji;
  }

  // Event listeners
  document.getElementById('btn-back').addEventListener('click', function() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  });

  document.getElementById('btn-next').addEventListener('click', function() {
    if (current === shuffledQuestions.length - 1) {
      showResults();
    } else {
      current++;
      renderQuestion();
    }
  });

  document.getElementById('btn-restart').addEventListener('click', function() {
    initQuiz();
  });

  initQuiz();
});
</script>
</body>
</html>
