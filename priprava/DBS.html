<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBS Kviz - Databazove systemy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f4f8;
    color: #111827;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: #1e3a5f;
    font-size: 1.7rem;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #4b5563;
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  .progress-bar-wrap {
    background: #d1d5db;
    border-radius: 8px;
    height: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #2563eb;
    border-radius: 8px;
    transition: width 0.4s ease;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    color: #374151;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  .score-badge {
    background: #2563eb;
    color: #ffffff;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 600;
  }

  .card {
    background: #ffffff;
    border-radius: 14px;
    padding: 28px 28px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    color: #111827;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .category-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    color: #ffffff;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .cat-er       { background: #7c3aed; }
  .cat-reldb    { background: #0369a1; }
  .cat-sql      { background: #0f766e; }
  .cat-fyzicka  { background: #b45309; }
  .cat-fd       { background: #be185d; }
  .cat-transakce{ background: #1d4ed8; }

  .q-number {
    color: #6b7280;
    font-size: 0.85rem;
    font-weight: 600;
    margin-left: auto;
  }

  .question-text {
    color: #111827;
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 20px;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .answer-btn {
    background: #f3f4f6;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
    cursor: pointer;
    font-size: 0.97rem;
    font-family: inherit;
    color: #1a1a2e;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1.45;
  }

  .answer-btn:hover:not(:disabled) {
    background: #e0e7ff;
    border-color: #a5b4fc;
    color: #1a1a2e;
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    background: #d1fae5;
    border-color: #059669;
    color: #064e3b;
  }

  .answer-btn.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #7f1d1d;
  }

  .explanation {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    border-radius: 6px;
    padding: 12px 14px;
    color: #1e3a5f;
    font-size: 0.92rem;
    line-height: 1.5;
    margin-bottom: 18px;
    display: none;
  }

  .explanation.visible {
    display: block;
  }

  .nav-row {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .nav-btn {
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    display: none;
  }

  .nav-btn.visible {
    display: inline-block;
  }

  .nav-btn:hover:not(:disabled) {
    background: #1d4ed8;
    color: #ffffff;
  }

  .nav-btn:disabled {
    background: #9ca3af;
    color: #ffffff;
    cursor: default;
  }

  .nav-btn.secondary {
    background: #6b7280;
    color: #ffffff;
  }

  .nav-btn.secondary:hover:not(:disabled) {
    background: #4b5563;
    color: #ffffff;
  }

  /* Results screen */
  .results {
    display: none;
  }

  .results.visible {
    display: block;
  }

  .results-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 36px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    text-align: center;
    color: #111827;
  }

  .results-emoji {
    font-size: 3.5rem;
    margin-bottom: 12px;
  }

  .results-title {
    color: #1e3a5f;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .results-pct {
    font-size: 3rem;
    font-weight: 800;
    color: #2563eb;
    margin-bottom: 6px;
  }

  .results-sub {
    color: #6b7280;
    font-size: 1rem;
    margin-bottom: 28px;
  }

  .results-breakdown {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .rb-item {
    background: #f3f4f6;
    border-radius: 10px;
    padding: 14px 22px;
    min-width: 110px;
  }

  .rb-num {
    font-size: 1.8rem;
    font-weight: 800;
    color: #111827;
  }

  .rb-lbl {
    font-size: 0.82rem;
    color: #6b7280;
    margin-top: 2px;
  }

  .rb-item.good .rb-num { color: #059669; }
  .rb-item.bad  .rb-num { color: #dc2626; }

  .restart-btn {
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 13px 36px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }

  .restart-btn:hover {
    background: #1d4ed8;
    color: #ffffff;
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    body {
      background: #0f172a;
      color: #e2e8f0;
    }

    h1 { color: #93c5fd; }
    .subtitle { color: #94a3b8; }
    .progress-bar-wrap { background: #334155; }
    .progress-bar-fill { background: #3b82f6; }
    .progress-label { color: #94a3b8; }
    .score-badge { background: #3b82f6; color: #ffffff; }

    .card {
      background: #1e293b;
      color: #e2e8f0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    .q-number { color: #64748b; }
    .question-text { color: #e2e8f0; }

    .answer-btn {
      background: #293548;
      border-color: #334155;
      color: #e2e8f0;
    }

    .answer-btn:hover:not(:disabled) {
      background: #1e3a5f;
      border-color: #3b82f6;
      color: #e2e8f0;
    }

    .answer-btn.correct {
      background: #064e3b;
      border-color: #059669;
      color: #d1fae5;
    }

    .answer-btn.wrong {
      background: #450a0a;
      border-color: #dc2626;
      color: #fecaca;
    }

    .explanation {
      background: #1e3a5f;
      border-left-color: #3b82f6;
      color: #bfdbfe;
    }

    .nav-btn {
      background: #3b82f6;
      color: #ffffff;
    }

    .nav-btn:hover:not(:disabled) {
      background: #2563eb;
      color: #ffffff;
    }

    .nav-btn:disabled {
      background: #475569;
      color: #94a3b8;
    }

    .nav-btn.secondary {
      background: #475569;
      color: #e2e8f0;
    }

    .nav-btn.secondary:hover:not(:disabled) {
      background: #374151;
      color: #e2e8f0;
    }

    .results-card {
      background: #1e293b;
      color: #e2e8f0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    .results-title { color: #93c5fd; }
    .results-pct { color: #60a5fa; }
    .results-sub { color: #64748b; }

    .rb-item {
      background: #293548;
    }

    .rb-num { color: #e2e8f0; }
    .rb-lbl { color: #64748b; }
    .rb-item.good .rb-num { color: #34d399; }
    .rb-item.bad  .rb-num { color: #f87171; }

    .restart-btn {
      background: #3b82f6;
      color: #ffffff;
    }

    .restart-btn:hover {
      background: #2563eb;
      color: #ffffff;
    }
  }

  @media (max-width: 520px) {
    body { padding: 12px; }
    .card { padding: 20px 16px; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>DBS Kviz</h1>
  <p class="subtitle">Databazove systemy &mdash; B0B36DBS</p>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label">
    <span id="progressText">Otazka 1 z 25</span>
    <span>Skore: <span class="score-badge" id="scoreText">0</span></span>
  </div>

  <div id="quizArea">
    <div class="card" id="questionCard">
      <div class="card-header">
        <span class="category-tag" id="categoryTag"></span>
        <span class="q-number" id="qNumber"></span>
      </div>
      <div class="question-text" id="questionText"></div>
      <div class="answers" id="answersDiv"></div>
      <div class="explanation" id="explanationDiv"></div>
      <div class="nav-row">
        <button class="nav-btn secondary" id="btnBack">&#8592; Zpet</button>
        <button class="nav-btn" id="btnNext">Dalsi &#8594;</button>
      </div>
    </div>
  </div>

  <div class="results" id="resultsArea">
    <div class="results-card">
      <div class="results-emoji" id="resultsEmoji"></div>
      <div class="results-title">Kviz dokoncen!</div>
      <div class="results-pct" id="resultsPct"></div>
      <div class="results-sub" id="resultsSub"></div>
      <div class="results-breakdown">
        <div class="rb-item good">
          <div class="rb-num" id="rbCorrect">0</div>
          <div class="rb-lbl">Spravnych</div>
        </div>
        <div class="rb-item bad">
          <div class="rb-num" id="rbWrong">0</div>
          <div class="rb-lbl">Spatnych</div>
        </div>
        <div class="rb-item">
          <div class="rb-num" id="rbTotal">0</div>
          <div class="rb-lbl">Celkem</div>
        </div>
      </div>
      <button class="restart-btn" id="restartBtn">Zkusit znovu</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var ALL_QUESTIONS = [
    {
      cat: 'er',
      catLabel: 'Konceptualni modelovani',
      catClass: 'cat-er',
      q: 'Co je to slaby entitni typ v ER modelu?',
      correct: 'Entitni typ, ktery nema vlastni plny identifikator a identifikuje se pomoci vztahu k jine entite.',
      wrong: [
        'Entitni typ s malym poctem atributu.',
        'Entitni typ, ktery nema zadne vztahy s jinymi entitami.',
        'Entitni typ, jehoz atributy jsou vsechny nepovinne (nullable).'
      ],
      exp: 'Slaby entitni typ ma pouze castecny identifikator. K plne identifikaci potrebuje vztah k silnemu entitnimu typu, ktery poskytuje zbytek klice.'
    },
    {
      cat: 'er',
      catLabel: 'Konceptualni modelovani',
      catClass: 'cat-er',
      q: 'Jaky je rozdil mezi klicem a nadklicem (superkey) v relacnim modelu?',
      correct: 'Klic je minimalni nadklic - zadna jeho podmnozina nesmí být take klicem.',
      wrong: [
        'Nadklic jednoznacne identifikuje radky, zatimco klic neidentifikuje.',
        'Klic muze obsahovat NULL hodnoty, nadklic ne.',
        'Nadklic se pouziva jen u slabych entit.'
      ],
      exp: 'Nadklic jednoznacne identifikuje radky, ale nemusí byt minimalni. Klic je minimalni nadklic - po odebrani libovolneho atributu by prestal jednoznacne identifikovat.'
    },
    {
      cat: 'er',
      catLabel: 'Konceptualni modelovani',
      catClass: 'cat-er',
      q: 'Jak se transformuje vztah M:N pri prevodu ER schematu do relacniho schematu?',
      correct: 'Vytvori se nova tabulka s cizimi klici na obe entity.',
      wrong: [
        'Cizi klic se prida na jednu stranu vztahu.',
        'Obe entity se slouci do jedne tabulky.',
        'Vztah M:N nelze do relacniho modelu transformovat.'
      ],
      exp: 'Vztah M:N vyzaduje asociativni tabulku (junction table), ktera obsahuje cizi klice odkazujici na primarni klice obou zucastnenych entit.'
    },
    {
      cat: 'er',
      catLabel: 'Konceptualni modelovani',
      catClass: 'cat-er',
      q: 'Co plati pro ISA hierarchii v ER modelu?',
      correct: 'Kazdy podtyp ma maximalne jednoho rodice (single inheritance) a vztah nema nazev ani kardinalitu.',
      wrong: [
        'Podtyp muze mit vice rodicu (multiple inheritance).',
        'ISA vztah ma vzdy kardinalitu 1:N.',
        'ISA hierarchie se nepouziva v ER modelech, pouze v UML.'
      ],
      exp: 'ISA hierarchie vyjadruje specializaci - napr. Student je podtypem Osoby. Vztah nema nazev ani kardinalitu a kazdy podtyp ma prave jednoho rodice.'
    },
    {
      cat: 'er',
      catLabel: 'Konceptualni modelovani',
      catClass: 'cat-er',
      q: 'Ktery logicky model pouziva uzly a hrany a je vhodny pro socialni site nebo RDF data?',
      correct: 'Grafovy model.',
      wrong: [
        'Stromovy model.',
        'Tabulkovy model.',
        'Objektovy model.'
      ],
      exp: 'Grafovy model pracuje s vrcholy, hranami a atributy. Podporuje smerove i nesmerove grafy a operace jako prohledavani grafu. Pouziva se v RDF databazich, FlockDB a pro socialni site.'
    },
    {
      cat: 'reldb',
      catLabel: 'Relacni databaze',
      catClass: 'cat-reldb',
      q: 'Jaky je vysledek vyrazu "3 < NULL" v SQL podle trihodnotove logiky?',
      correct: 'UNKNOWN',
      wrong: [
        'TRUE',
        'FALSE',
        'NULL'
      ],
      exp: 'SQL pouziva trihodnotovou logiku: TRUE, FALSE a UNKNOWN. Porovnani s NULL vzdy da UNKNOWN. Proto WHERE podminky, kde se porovna s NULL primocarym srovnanim, nevrati radky (UNKNOWN se nepovazuje za TRUE).'
    },
    {
      cat: 'reldb',
      catLabel: 'Relacni databaze',
      catClass: 'cat-reldb',
      q: 'Co presne zajistuje integritni omezeni PRIMARY KEY?',
      correct: 'Kombinaci NOT NULL a UNIQUE - sloupec jednoznacne identifikuje radek a nemuze byt NULL.',
      wrong: [
        'Pouze to, ze hodnota je unikatni - muze byt NULL.',
        'Pouze to, ze hodnota neni NULL - duplikaty jsou povoleny.',
        'Automaticke generovani hodnot pres sekvenci.'
      ],
      exp: 'PRIMARY KEY je kombinaci NOT NULL (hodnota nesmi chybet) a UNIQUE (hodnota musi byt jedineena). Spolu jednoznacne identifikuji kazdy radek tabulky.'
    },
    {
      cat: 'reldb',
      catLabel: 'Relacni databaze',
      catClass: 'cat-reldb',
      q: 'Jaky je rozdil mezi referencinimi akcemi RESTRICT a NO ACTION?',
      correct: 'RESTRICT kontroluje integritu ihned pri prikazu, NO ACTION ji kontroluje az na konci transakce.',
      wrong: [
        'RESTRICT smaže zavisle radky, NO ACTION je zachova.',
        'NO ACTION je synonymum pro CASCADE.',
        'Zadny rozdil - oba zakazuji operaci stejnym zpusobem.'
      ],
      exp: 'Oba zakazuji operaci porusujici referencni integritu, ale lisi se casovanim: RESTRICT kontroluje ihned, NO ACTION dovoluje docasne poruseni v ramci transakce (kontrola az pri COMMIT).'
    },
    {
      cat: 'reldb',
      catLabel: 'Relacni databaze',
      catClass: 'cat-reldb',
      q: 'Proc se pouzivaji umele identifikatory?',
      correct: 'Kdyz prirozeny klic neexistuje nebo je prilis komplikovany - umely ID je jednoduchy, jednoznacny a lehce raditeny.',
      wrong: [
        'Protoze SQL neumi pracovat s textovymi primarnimi klici.',
        'Jsou vyzadovany standardem SQL pro vsechny tabulky.',
        'Aby bylo mozne pouzit integritni omezeni FOREIGN KEY.'
      ],
      exp: 'Umele identifikatory (napr. auto_increment) se generuji automaticky. Pouzivaji se, kdyz prirozeny klic je slozen, meni se, nebo vubec neexistuje. Jsou jednoduche a efektivni jako indexovaci klic.'
    },
    {
      cat: 'sql',
      catLabel: 'Jazyk SQL',
      catClass: 'cat-sql',
      q: 'Jaky je rozdil mezi INNER JOIN a LEFT OUTER JOIN?',
      correct: 'INNER JOIN vrati pouze radky s odpovidajici hodnotou v obou tabulkach; LEFT OUTER JOIN navic vrati vsechny radky z leve tabulky (s NULL pro chybejici z prave).',
      wrong: [
        'INNER JOIN je rychlejsi, ale vraci stejna data jako LEFT JOIN.',
        'LEFT JOIN funguje pouze se stejnymi nazvy sloupcu.',
        'INNER JOIN nemuze spojit vice nez dve tabulky.'
      ],
      exp: 'INNER JOIN: prunik (jen shody). LEFT JOIN: vsechny zaznamy z leve tabulky + shodujici se z prave; nezhodujici se pravé sloupce jsou NULL.'
    },
    {
      cat: 'sql',
      catLabel: 'Jazyk SQL',
      catClass: 'cat-sql',
      q: 'Kdy je pohled (VIEW) aktualizovatelny?',
      correct: 'Kdyz je definovan primo nad jednou tabulkou bez agregaci a spojeni.',
      wrong: [
        'Vzdy, pokud pouzivame WITH CHECK OPTION.',
        'Nikdy - pohledy jsou pouze pro cteni.',
        'Kdyz obsahuje GROUP BY klauzuli.'
      ],
      exp: 'Pohled je aktualizovatelny, pokud je jednoduchy - primy SELECT z jedne tabulky bez GROUP BY, DISTINCT, agregacnich funkci nebo JOIN. WITH CHECK OPTION zajistuje, ze INSERT/UPDATE neporus podmínky pohledu, ale samo o sobe aktualizovatelnost nezarucuje.'
    },
    {
      cat: 'sql',
      catLabel: 'Jazyk SQL',
      catClass: 'cat-sql',
      q: 'Co jsou korelované vnorene dotazy?',
      correct: 'Vnorene dotazy, ktere odkazuji na sloupce vnejsiho dotazu a jsou vyhodnocovany pro kazdy radek vnejsiho dotazu.',
      wrong: [
        'Dotazy pouzivajici UNION pro spojeni vysledku.',
        'Dotazy ve FROM klauzuli tvorici virtualni tabulku.',
        'Dotazy se stejnou strukturou jako vnejsi dotaz.'
      ],
      exp: 'Korelovaný poddotaz (napr. WHERE EXISTS (...)) pouziva hodnoty z vnejsiho dotazu. Je znovu vyhodnocen pro kazdy radek vnejsiho dotazu, coz ho dela vykonnostne narocnejsim, ale mocnym nastrojem.'
    },
    {
      cat: 'sql',
      catLabel: 'Jazyk SQL',
      catClass: 'cat-sql',
      q: 'Jaka je funkce CROSS JOIN?',
      correct: 'Vraci kartezsky soucin dvou tabulek - vsechny kombinace radku z obou tabulek.',
      wrong: [
        'Spojuje tabulky na zaklade shodnych nazvu sloupcu.',
        'Vraci pouze radky, ktere nemaji shodu v druhe tabulce.',
        'Je synonymem pro NATURAL JOIN.'
      ],
      exp: 'CROSS JOIN nema ON podmínku a vraci vsechny mozne kombinace radku z obou tabulek. Pokud ma tabulka A m radku a B n radku, vysledek ma m*n radku.'
    },
    {
      cat: 'sql',
      catLabel: 'Jazyk SQL',
      catClass: 'cat-sql',
      q: 'Co jsou triggery v SQL?',
      correct: 'Automaticke akce, ktere se provedou pri zmene dat (INSERT, UPDATE, DELETE) na tabulce.',
      wrong: [
        'Funkce, ktere vraci tabulkovy vysledek.',
        'Mechanismus pro prochazeni zaznamu jeden po jednom.',
        'Omezeni integrity zakazujici neplatne hodnoty.'
      ],
      exp: 'Trigger je procedura svazana s tabulkou, ktera se automaticky spusti pred nebo po urcite DML operaci (BEFORE/AFTER INSERT, UPDATE, DELETE). Pouziva se napr. pro auditovani zmen nebo udrzbu denormalizovanych dat.'
    },
    {
      cat: 'fyzicka',
      catLabel: 'Fyzicka vrstva',
      catClass: 'cat-fyzicka',
      q: 'Co je "dirty flag" v kontextu buffer managementu?',
      correct: 'Priznak znacici, ze stranka v pameti byla zmenena a dosud nebyla zapsana zpet na disk.',
      wrong: [
        'Priznak oznamujici, ze stranka je poškozena a nelze ji nacist.',
        'Indikator, ze stranka je prave ctena jinou transakcí.',
        'Pocitadlo poctu pristupu k dane strance.'
      ],
      exp: 'Buffer manager udrzuje pro kazdy ramec dirty flag. Kdyz je nastaveny, znamena to, ze obsah v pameti se lisi od verze na disku a stranka musi byt pred vyhozenim z bufferu zapsana.'
    },
    {
      cat: 'fyzicka',
      catLabel: 'Fyzicka vrstva',

  var questions = [];
  var currentIndex = 0;
  var score = 0;
  var answered = [];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(ALL_QUESTIONS);
    currentIndex = 0;
    score = 0;
    answered = new Array(questions.length).fill(null);
    document.getElementById('resultsArea').classList.remove('visible');
    document.getElementById('quizArea').style.display = '';
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[currentIndex];
    var total = questions.length;
    var state = answered[currentIndex];

    document.getElementById('qNumber').textContent = (currentIndex + 1) + ' / ' + total;
    document.getElementById('categoryTag').textContent = q.catLabel;
    document.getElementById('categoryTag').className = 'category-tag ' + q.catClass;
    document.getElementById('questionText').textContent = q.q;

    var pct = ((currentIndex) / total) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = 'Otazka ' + (currentIndex + 1) + ' z ' + total;
    document.getElementById('scoreText').textContent = score;

    var answersDiv = document.getElementById('answersDiv');
    answersDiv.innerHTML = '';

    var options;
    if (state) {
      options = state.order;
    } else {
      var all = [q.correct].concat(q.wrong);
      options = shuffle(all);
    }

    for (var i = 0; i < options.length; i++) {
      (function(idx, optText) {
        var btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = optText;

        if (state) {
          btn.disabled = true;
          if (optText === q.correct) {
            btn.classList.add('correct');
          } else if (state.chosen === idx) {
            btn.classList.add('wrong');
          }
        } else {
          btn.addEventListener('click', function() {
            handleAnswer(idx, options);
          });
        }
        answersDiv.appendChild(btn);
      })(i, options[i]);
    }

    var expDiv = document.getElementById('explanationDiv');
    if (state) {
      expDiv.textContent = q.exp;
      expDiv.classList.add('visible');
    } else {
      expDiv.textContent = '';
      expDiv.classList.remove('visible');
    }

    var btnBack = document.getElementById('btnBack');
    var btnNext = document.getElementById('btnNext');

    if (state) {
      btnBack.classList.add('visible');
      btnNext.classList.add('visible');
      btnBack.disabled = (currentIndex === 0);

      if (currentIndex < total - 1) {
        var nextAnswered = isNextReachable();
        btnNext.disabled = !nextAnswered;
        btnNext.textContent = 'Dalsi ->';
      } else {
        btnNext.textContent = 'Vysledky';
        btnNext.disabled = false;
      }
    } else {
      btnBack.classList.remove('visible');
      btnNext.classList.remove('visible');
    }
  }

  function isNextReachable() {
    if (currentIndex >= questions.length - 1) return true;
    for (var i = currentIndex + 1; i < questions.length; i++) {
      if (answered[i]) return true;
      if (i === currentIndex + 1) return (answered[currentIndex] !== null);
    }
    return false;
  }

  function handleAnswer(chosenIdx, options) {
    var q = questions[currentIndex];
    var chosenText = options[chosenIdx];
    var isCorrect = (chosenText === q.correct);

    if (isCorrect) score++;

    answered[currentIndex] = { chosen: chosenIdx, order: options, correct: isCorrect };

    var btns = document.getElementById('answersDiv').querySelectorAll('.answer-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = true;
      if (options[i] === q.correct) {
        btns[i].classList.add('correct');
      } else if (i === chosenIdx) {
        btns[i].classList.add('wrong');
      }
    }

    var expDiv = document.getElementById('explanationDiv');
    expDiv.textContent = q.exp;
    expDiv.classList.add('visible');

    document.getElementById('scoreText').textContent = score;

    var btnBack = document.getElementById('btnBack');
    var btnNext = document.getElementById('btnNext');
    btnBack.classList.add('visible');
    btnNext.classList.add('visible');
    btnBack.disabled = (currentIndex === 0);

    if (currentIndex < questions.length - 1) {
      btnNext.disabled = false;
      btnNext.textContent = 'Dalsi ->';
    } else {
      btnNext.textContent = 'Vysledky';
      btnNext.disabled = false;
    }
  }

  function goNext() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function goBack() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  }

  function showResults() {
    document.getElementById('quizArea').style.display = 'none';
    var resultsArea = document.getElementById('resultsArea');
    resultsArea.classList.add('visible');

    var total = questions.length;
    var correct = 0;
    for (var i = 0; i < answered.length; i++) {
      if (answered[i] && answered[i].correct) correct++;
    }
    var pct = Math.round((correct / total) * 100);

    var emoji = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : pct >= 40 ? '😐' : '📚';
    var msg = pct >= 80 ? 'Vyborne!' : pct >= 60 ? 'Dobry vysledek!' : pct >= 40 ? 'Je co zlepsovat.' : 'Opakuj material a zkus to znovu!';

    document.getElementById('resultsEmoji').textContent = emoji;
    document.getElementById('resultsPct').textContent = pct + '%';
    document.getElementById('resultsSub').textContent = msg;
    document.getElementById('rbCorrect').textContent = correct;
    document.getElementById('rbWrong').textContent = total - correct;
    document.getElementById('rbTotal').textContent = total;

    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = 'Hotovo!';
    document.getElementById('scoreText').textContent = score;
  }

  document.getElementById('btnNext').addEventListener('click', goNext);
  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('restartBtn').addEventListener('click', initQuiz);

  initQuiz();
});
