<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kviz: Funkcionalni programovani</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    color: #111827;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 1.7rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 0.95rem;
    color: #4b5563;
  }

  .progress-bar-wrap {
    background: #e5e7eb;
    border-radius: 999px;
    height: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #059669;
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #6b7280;
    margin-bottom: 22px;
  }

  .score-badge {
    background: #d1fae5;
    color: #065f46;
    font-weight: 600;
    border-radius: 999px;
    padding: 2px 12px;
    font-size: 0.85rem;
  }

  .card {
    background: #ffffff;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    color: #111827;
  }

  .category-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
    color: #ffffff;
  }

  .cat-pure      { background: #0891b2; }
  .cat-rekurze   { background: #7c3aed; }
  .cat-seznamy   { background: #b45309; }
  .cat-hof       { background: #15803d; }
  .cat-closure   { background: #be185d; }
  .cat-lambda    { background: #1d4ed8; }
  .cat-adt       { background: #b91c1c; }
  .cat-typclass  { background: #6d28d9; }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #111827;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .code-block {
    background: #1e293b;
    color: #e2e8f0;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.85rem;
    border-radius: 8px;
    padding: 12px 14px;
    margin: 10px 0 18px;
    white-space: pre;
    overflow-x: auto;
    line-height: 1.6;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .answer-btn {
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 13px 16px;
    text-align: left;
    font-size: 0.95rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    color: #1a1a2e;
    line-height: 1.5;
  }

  .answer-btn code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.88em;
    background: #e5e7eb;
    padding: 1px 5px;
    border-radius: 4px;
    color: #1a1a2e;
  }

  .answer-btn:not(:disabled):hover {
    border-color: #6ee7b7;
    background: #ecfdf5;
    color: #1a1a2e;
  }

  .answer-btn.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #14532d;
  }

  .answer-btn.correct code {
    background: #bbf7d0;
    color: #14532d;
  }

  .answer-btn.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #7f1d1d;
  }

  .answer-btn.wrong code {
    background: #fecaca;
    color: #7f1d1d;
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .explanation {
    margin-top: 18px;
    padding: 14px 16px;
    background: #f0f9ff;
    border-left: 4px solid #0ea5e9;
    border-radius: 0 8px 8px 0;
    font-size: 0.93rem;
    color: #0c4a6e;
    line-height: 1.6;
    display: none;
  }

  .explanation code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.88em;
    background: #bae6fd;
    padding: 1px 5px;
    border-radius: 4px;
    color: #0c4a6e;
  }

  .explanation.visible {
    display: block;
  }

  .nav-buttons {
    display: none;
    justify-content: space-between;
    margin-top: 22px;
    gap: 12px;
  }

  .nav-buttons.visible {
    display: flex;
  }

  .nav-btn {
    background: #059669;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 0.95rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    color: #ffffff;
  }

  .nav-btn:hover:not(:disabled) {
    background: #047857;
  }

  .nav-btn:disabled {
    background: #a7f3d0;
    color: #065f46;
    cursor: default;
  }

  .nav-btn.secondary {
    background: #d1fae5;
    color: #065f46;
  }

  .nav-btn.secondary:hover:not(:disabled) {
    background: #a7f3d0;
    color: #065f46;
  }

  .results {
    display: none;
    text-align: center;
    padding: 10px 0;
  }

  .results.visible {
    display: block;
  }

  .results h2 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 10px;
  }

  .results .big-score {
    font-size: 3.5rem;
    font-weight: 800;
    color: #059669;
    margin: 16px 0 8px;
  }

  .results .subtitle {
    font-size: 1rem;
    color: #6b7280;
    margin-bottom: 24px;
  }

  .results .grade {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 999px;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .grade-a { background: #dcfce7; color: #15803d; }
  .grade-b { background: #dbeafe; color: #1d4ed8; }
  .grade-c { background: #fef9c3; color: #a16207; }
  .grade-d { background: #fee2e2; color: #b91c1c; }

  .restart-btn {
    background: #059669;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 13px 36px;
    font-size: 1rem;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }

  .restart-btn:hover {
    background: #047857;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #f3f4f6; }

    .header h1 { color: #f3f4f6; }
    .header p { color: #9ca3af; }

    .progress-bar-wrap { background: #374151; }
    .progress-bar-fill { background: #10b981; }
    .progress-info { color: #9ca3af; }
    .score-badge { background: #064e3b; color: #6ee7b7; }

    .card {
      background: #1f2937;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      color: #f3f4f6;
    }

    .question-text { color: #f3f4f6; }

    .code-block { background: #0f172a; color: #e2e8f0; }

    .answer-btn {
      background: #374151;
      border-color: #4b5563;
      color: #f3f4f6;
    }

    .answer-btn code {
      background: #4b5563;
      color: #f3f4f6;
    }

    .answer-btn:not(:disabled):hover {
      border-color: #34d399;
      background: #064e3b;
      color: #d1fae5;
    }

    .answer-btn.correct {
      background: #14532d;
      border-color: #16a34a;
      color: #dcfce7;
    }

    .answer-btn.correct code { background: #166534; color: #bbf7d0; }

    .answer-btn.wrong {
      background: #7f1d1d;
      border-color: #dc2626;
      color: #fee2e2;
    }

    .answer-btn.wrong code { background: #991b1b; color: #fecaca; }

    .explanation {
      background: #0c4a6e;
      border-color: #38bdf8;
      color: #e0f2fe;
    }

    .explanation code { background: #075985; color: #bae6fd; }

    .nav-btn { background: #059669; color: #ffffff; }
    .nav-btn.secondary { background: #064e3b; color: #6ee7b7; }
    .nav-btn:disabled { background: #064e3b; color: #34d399; }

    .results h2 { color: #f3f4f6; }
    .results .subtitle { color: #9ca3af; }
    .results .big-score { color: #34d399; }

    .grade-a { background: #14532d; color: #bbf7d0; }
    .grade-b { background: #1e3a5f; color: #93c5fd; }
    .grade-c { background: #78350f; color: #fde68a; }
    .grade-d { background: #7f1d1d; color: #fca5a5; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Funkcionalni programovani</h1>
    <p>Lambda kalkulus, Scheme/Racket, Haskell &mdash; 25 otazek</p>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-info">
    <span id="questionCounter">Otazka 1 z 25</span>
    <span class="score-badge" id="scoreBadge">Skore: 0 / 0</span>
  </div>

  <div class="card" id="quizCard">
    <span class="category-tag" id="categoryTag"></span>
    <div class="question-text" id="questionText"></div>
    <div id="codeBlock" style="display:none"></div>
    <div class="answers" id="answersDiv"></div>
    <div class="explanation" id="explanation"></div>
    <div class="nav-buttons" id="navButtons">
      <button class="nav-btn secondary" id="prevBtn">&#8592; Zpet</button>
      <button class="nav-btn" id="nextBtn">Dalsi &#8594;</button>
    </div>
  </div>

  <div class="card results" id="resultsCard">
    <h2>Kviz dokoncen!</h2>
    <div class="big-score" id="bigScore"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="grade" id="gradeLabel"></div>
    <br>
    <button class="restart-btn" id="restartBtn">Zkusit znovu</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var allQuestions = [
    // --- CISTE FUNKCE ---
    {
      category: 'pure', catLabel: 'Ciste funkce', catClass: 'cat-pure',
      question: 'Co definuje cistou funkci (pure function)?',
      code: null,
      answers: [
        'Funkce ktera vraci vzdy stejny vysledek pro stejne argumenty a nema vedlejsi efekty',
        'Funkce ktera je definovana pomoci lambda vyrazu',
        'Funkce ktera neprijima zadne argumenty',
        'Funkce ktera je volana maximalne jednou'
      ],
      correct: 0,
      explanation: 'Cista funkce splnuje dve podmínky: (1) vraci vzdy stejny vysledek pro stejne vstupní hodnoty (determinismus) a (2) nevytvari zadne vedlejsi efekty - nectecte ani nemeni nic mimo svuj vnitrni rozsah, nedelá I/O, neloguje, nemutuje.'
    },
    {
      category: 'pure', catLabel: 'Ciste funkce', catClass: 'cat-pure',
      question: 'Ktera z nasledujicich vlastnosti NENI vyhodou cistych funkci?',
      code: null,
      answers: [
        'Snadna paralelizace bez konfliktu vlaken',
        'Moznost memoizace (cachovani vysledku)',
        'Efektivni provadeni I/O operaci a prace se stavem',
        'Snadna testovatelnost a ladeni'
      ],
      correct: 2,
      explanation: 'I/O operace a prace se stavem jsou typickymi vedlejsimi efekty, ktere ciste funkce ze sve podstaty nemohou efektivne resit. To je jedna z nevyhod: nektera ulohy je obtizne nebo neefektivne resit cistymi funkcemi.'
    },
    {
      category: 'pure', catLabel: 'Ciste funkce', catClass: 'cat-pure',
      question: 'Proc lze ciste funkce snadno memoizovat?',
      code: null,
      answers: [
        'Protoze jsou vzdy kratsi nez neciste funkce',
        'Protoze pro stejne vstupy vzdy vraci stejny vystup - lze tedy vysledek bezpecne ulozit do cache',
        'Protoze nepotrebuji heap pamet',
        'Protoze jsou vzdy tail-rekurzivni'
      ],
      correct: 1,
      explanation: 'Memoizace funguje tak, ze si zapamatujeme vysledek volani funkce pro dane argumenty. U cistych funkci to je bezpecne, protoze pro stejne argumenty dostaneme vzdy stejny vysledek - cache nikdy nebude zastaralá.'
    },
    // --- REKURZE ---
    {
      category: 'rekurze', catLabel: 'Rekurze', catClass: 'cat-rekurze',
      question: 'Co je tail recursion (koncova rekurze)?',
      code: null,
      answers: [
        'Rekurze ktera se vola na zacatku funkce',
        'Rekurze kde je rekurzivni volani posledni operaci funkce a vysledek se predava akumulatorem',
        'Rekurze ktera se vola vicekrat v jedne funkci (stromova)',
        'Rekurze kde funkce vola jinou funkci, ktera vola zpet prvni'
      ],
      correct: 1,
      explanation: 'Tail rekurze (koncova rekurze) je takova, kde je rekurzivni volani posledni akci funkce. Kompilator ji muze optimalizovat na iteraci (tail-call optimization - TCO) takze bezi s konstantni hloubkou zasobniku, bez rizika stack overflow.'
    },
    {
      category: 'rekurze', catLabel: 'Rekurze', catClass: 'cat-rekurze',
      question: 'Ktera z nasledujicich implementaci je tail-rekurzivni?',
      code: '; A:\n(define (fact-A n)\n  (if (= n 0) 1\n    (* n (fact-A (- n 1)))))\n\n; B:\n(define (fact-B n acc)\n  (if (= n 0) acc\n    (fact-B (- n 1) (* n acc))))',
      answers: [
        'Pouze A - protoze je kratsi',
        'Pouze B - rekurzivni volani je posledni operaci, vysledek se akumuluje',
        'Obe jsou tail-rekurzivni',
        'Zadna - tail rekurze vyzaduje iteraci pomoci loop'
      ],
      correct: 1,
      explanation: 'Verze B je tail-rekurzivni: fact-B vola sama sebe jako posledni operaci a stav nosi v parametru acc. Verze A neni tail-rekurzivni, protoze po navratu z rekurzivniho volani jeste provede nasobeni (* n ...).'
    },
    {
      category: 'rekurze', catLabel: 'Rekurze', catClass: 'cat-rekurze',
      question: 'Jak se nazyva rekurze kde funkce vola sama sebe vicekrat (napr. pro levy a pravy podstrom)?',
      code: null,
      answers: [
        'Tail recursion',
        'Head recursion',
        'Tree recursion (stromova rekurze)',
        'Nested recursion'
      ],
      correct: 2,
      explanation: 'Tree (stromova) rekurze nastava, kdyz se funkce vola sama sebe vicekrat v jednom volani. Typicky priklad je prechod stromem (levy i pravy podstrom) nebo Fibonacciho cisla: fib(n) = fib(n-1) + fib(n-2).'
    },
    // --- SEZNAMY A STROMY ---
    {
      category: 'seznamy', catLabel: 'Seznamy a stromy', catClass: 'cat-seznamy',
      question: 'Jakou hodnotu vrati nasledujici vyraz v Racketu?',
      code: '(car (cdr (cdr (list 10 20 30 40))))',
      answers: [
        '10',
        '20',
        '30',
        '40'
      ],
      correct: 2,
      explanation: 'list 10 20 30 40 vytvori seznam (10 20 30 40). cdr vrati (20 30 40), druhe cdr vrati (30 40) a car vrati prvni prvek tohoto seznamu, coz je 30. Lze zkratit jako (caddr seznam).'
    },
    {
      category: 'seznamy', catLabel: 'Seznamy a stromy', catClass: 'cat-seznamy',
      question: 'Jak se lisi quote a list v Racketu?',
      code: "(list 1 2 (+ 1 2))\n'(1 2 (+ 1 2))",
      answers: [
        'Quote i list oba vyhodnotí vsechny vyrazy',
        'list vyhodnotí vse (vrati (1 2 3)), quote nevyhodnocuje (vrati (1 2 (+ 1 2)))',
        'Quote vyhodnotí vse, list nevyhodnocuje',
        'Jsou funkcne ekvivalentni, lisi se jen syntaxi'
      ],
      correct: 1,
      explanation: '(list 1 2 (+ 1 2)) vyhodnotí (+ 1 2) na 3 a vrati seznam (1 2 3). Oproti tomu quote (zkratka apostrof) vrati sve argumenty bez vyhodnoceni - (quote (1 2 (+ 1 2))) vrati seznam (1 2 (+ 1 2)).'
    },
    {
      category: 'seznamy', catLabel: 'Seznamy a stromy', catClass: 'cat-seznamy',
      question: 'Co dela funkce cons v Racketu?',
      code: '(cons 1 (cons 2 (cons 3 (quote ()))))',
      answers: [
        'Spoji dva seznamy do jednoho (jako append)',
        'Vytvori par - vlozi prvni argument jako hlavu pred druhy argument',
        'Vraci pocet prvku v seznamu',
        'Vytvori novy seznam s prvky ze dvou existujicich'
      ],
      correct: 1,
      explanation: 'cons vytvori par (pair) - vlozi prvni argument jako "hlavu" pred druhy argument (casto seznam). Priklad: (cons 1 (cons 2 (cons 3 (quote ())))) vytvori seznam (1 2 3) jako zanorence paru.'
    },
    {
      category: 'seznamy', catLabel: 'Seznamy a stromy', catClass: 'cat-seznamy',
      question: 'K cemu slouzi funkce apply v Racketu?',
      code: "(apply + '(1 2 3 4))",
      answers: [
        'Aplikuje funkci na kazdy prvek seznamu (jako map)',
        '"Rozbali" seznam jako argumenty funkce - ekvivalent volani (+ 1 2 3 4)',
        'Filtruje seznam pomoci predikatu',
        'Sestaví novy seznam z vysledku funkce'
      ],
      correct: 1,
      explanation: 'apply bere funkci a seznam argumentu a "rozbali" seznam tak, jako by byly argumenty predany primo. (apply + (list 1 2 3 4)) je ekvivalentni (+ 1 2 3 4) => 10.'
    },
    // --- HOF ---
    {
      category: 'hof', catLabel: 'HOF & Currying', catClass: 'cat-hof',
      question: 'Co jsou to funkce vyssich radu (higher-order functions)?',
      code: null,
      answers: [
        'Funkce ktere jsou definovany na urovni modulu, ne lokalne',
        'Funkce ktere mohou prijimat jine funkce jako argumenty nebo vracet funkce jako vysledek',
        'Funkce ktere maji vice nez tri argumenty',
        'Funkce ktere jsou volany rekurzivne'
      ],
      correct: 1,
      explanation: 'Funkce vyssich radu (higher-order functions) jsou funkce, ktere bud prijimaji jine funkce jako argumenty, nebo vracejí funkce jako svuj vysledek (nebo oboji). Typicke priklady: map, filter, foldl, foldr, apply-twice.'
    },
    {
      category: 'hof', catLabel: 'HOF & Currying', catClass: 'cat-hof',
      question: 'Co je currying?',
      code: null,
      answers: [
        'Technika pro urychleni rekurzivnich funkci',
        'Prevod funkce s n argumenty na sekvenci n jednopametnych funkci',
        'Zpusob definice anonymnich funkci pomoci lambda',
        'Optimalizace tail-rekurze kompílatorem'
      ],
      correct: 1,
      explanation: 'Currying prevadi funkci f(x1, x2, ..., xn) -> y na sekvenci jednopametnych funkci: x1 -> (x2 -> (... -> (xn -> y)...)). Umoznuje castecnou aplikaci - zafixujeme nektere argumenty a ziskame novou funkci cekajici na zbylé.'
    },
    {
      category: 'hof', catLabel: 'HOF & Currying', catClass: 'cat-hof',
      question: 'Jak se lisi foldl a foldr v Racketu/Haskellu?',
      code: null,
      answers: [
        'foldl zpracovava seznam zleva doprava a je tail-rekurzivni; foldr zprava doleva a neni tail-rekurzivni',
        'foldl a foldr jsou ekvivalentni - lisi se jen poradim argumentu',
        'foldr je vzdy rychlejsi nez foldl',
        'foldl funguje jen pro cisla, foldr pro retezce'
      ],
      correct: 0,
      explanation: 'foldl (levy fold) zpracovava zleva: (foldl f acc (a b c)) => f(f(f(acc,a),b),c). Je tail-rekurzivni a bezpecny na dlouhe seznamy. foldr (pravy fold) zpracovava zprava: f(a, f(b, f(c, acc))). Neni tail-rekurzivni, muze pretect zasobnik.'
    },
    {
      category: 'hof', catLabel: 'HOF & Currying', catClass: 'cat-hof',
      question: 'Jaky je vysledek tohoto vyrazu?',
      code: '(define (make-adder x)\n  (lambda (y) (+ x y)))\n\n(define add10 (make-adder 10))\n(add10 7)',
      answers: [
        '10',
        '7',
        '17',
        'Chyba - make-adder neni definovano'
      ],
      correct: 2,
      explanation: 'make-adder vrati lambda funkci ktera pricitá x k y. Kdyz zavolame (make-adder 10), x se stane 10 a dostaneme funkci (lambda (y) (+ 10 y)). Nasledne (add10 7) vrati (+ 10 7) = 17.'
    },
    // --- CLOSURE ---
    {
      category: 'closure', catLabel: 'Uzavery (Closures)', catClass: 'cat-closure',
      question: 'Co je funkcionalni uzaver (closure)?',
      code: null,
      answers: [
        'Funkce ktera nema zadne argumenty',
        'Funkce spolu s prostredím, ve kterem byla vytvorena - obsahuje hodnoty volnych promennych',

  var questions = [];
  var current = 0;
  var score = 0;
  var answered = 0;
  var answered_states = [];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(allQuestions).map(function(q) {
      var indices = [0, 1, 2, 3];
      var shuffled = shuffle(indices);
      var newCorrect = shuffled.indexOf(q.correct);
      var newAnswers = shuffled.map(function(i) { return q.answers[i]; });
      return {
        category: q.category,
        catLabel: q.catLabel,
        catClass: q.catClass,
        question: q.question,
        code: q.code,
        answers: newAnswers,
        correct: newCorrect,
        explanation: q.explanation
      };
    });

    answered_states = questions.map(function() {
      return { answered: false, chosen: -1 };
    });

    current = 0;
    score = 0;
    answered = 0;
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[current];
    var state = answered_states[current];
    var total = questions.length;

    document.getElementById('progressBar').style.width = (((current) / total) * 100) + '%';
    document.getElementById('questionCounter').textContent = 'Otazka ' + (current + 1) + ' z ' + total;
    document.getElementById('scoreBadge').textContent = 'Skore: ' + score + ' / ' + answered;

    var tag = document.getElementById('categoryTag');
    tag.textContent = q.catLabel;
    tag.className = 'category-tag ' + q.catClass;

    document.getElementById('questionText').textContent = q.question;

    var codeEl = document.getElementById('codeBlock');
    if (q.code) {
      codeEl.style.display = 'block';
      codeEl.className = 'code-block';
      codeEl.textContent = q.code;
    } else {
      codeEl.style.display = 'none';
    }

    var answersDiv = document.getElementById('answersDiv');
    answersDiv.innerHTML = '';

    q.answers.forEach(function(text, i) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.innerHTML = formatCode(text);

      if (state.answered) {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('correct');
        else if (i === state.chosen) btn.classList.add('wrong');
      } else {
        (function(idx) {
          btn.addEventListener('click', function() { selectAnswer(idx); });
        })(i);
      }
      answersDiv.appendChild(btn);
    });

    var expl = document.getElementById('explanation');
    if (state.answered) {
      expl.innerHTML = formatCode(q.explanation);
      expl.className = 'explanation visible';
    } else {
      expl.innerHTML = '';
      expl.className = 'explanation';
    }

    var navButtons = document.getElementById('navButtons');
    navButtons.className = state.answered ? 'nav-buttons visible' : 'nav-buttons';

    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = (current === 0);

    if (state.answered) {
      nextBtn.disabled = false;
      if (current === total - 1) {
        var allDone = answered_states.every(function(s) { return s.answered; });
        nextBtn.textContent = allDone ? 'Zobrazit vysledky' : 'Dalsi \u2192';
      } else {
        nextBtn.textContent = 'Dalsi \u2192';
      }
    } else {
      nextBtn.disabled = true;
      nextBtn.textContent = 'Dalsi \u2192';
    }
  }

  function formatCode(text) {
    return text.replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function selectAnswer(chosenIdx) {
    var state = answered_states[current];
    if (state.answered) return;
    state.answered = true;
    state.chosen = chosenIdx;
    answered++;
    if (chosenIdx === questions[current].correct) score++;
    renderQuestion();
  }

  function goNext() {
    var total = questions.length;
    var allDone = answered_states.every(function(s) { return s.answered; });

    if (current === total - 1 && allDone) {
      showResults();
      return;
    }

    var next = current + 1;
    while (next < total && answered_states[next].answered) next++;
    if (next >= total) {
      for (var i = current + 1; i < total; i++) {
        if (!answered_states[i].answered) { next = i; break; }
      }
    }
    if (next < total) {
      current = next;
      renderQuestion();
    } else if (allDone) {
      showResults();
    }
  }

  function goPrev() {
    if (current > 0) { current--; renderQuestion(); }
  }

  function showResults() {
    document.getElementById('quizCard').style.display = 'none';
    var rc = document.getElementById('resultsCard');
    rc.className = 'card results visible';

    var pct = Math.round((score / questions.length) * 100);
    document.getElementById('bigScore').textContent = pct + '%';
    document.getElementById('subtitle').textContent = score + ' spravnych odpovedi z ' + questions.length;

    var gl = document.getElementById('gradeLabel');
    if (pct >= 90)      { gl.textContent = 'Vyborne! Znamka A'; gl.className = 'grade grade-a'; }
    else if (pct >= 75) { gl.textContent = 'Dobre! Znamka B';   gl.className = 'grade grade-b'; }
    else if (pct >= 60) { gl.textContent = 'Dost dobre. Znamka C'; gl.className = 'grade grade-c'; }
    else                { gl.textContent = 'Je treba precvicit. Znamka D'; gl.className = 'grade grade-d'; }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('questionCounter').textContent = 'Dokonceno!';
    document.getElementById('scoreBadge').textContent = 'Skore: ' + score + ' / ' + questions.length;
  }

  document.getElementById('nextBtn').addEventListener('click', goNext);
  document.getElementById('prevBtn').addEventListener('click', goPrev);
  document.getElementById('restartBtn').addEventListener('click', function() {
    document.getElementById('quizCard').style.display = '';
    document.getElementById('resultsCard').className = 'card results';
    initQuiz();
  });

  initQuiz();
});
