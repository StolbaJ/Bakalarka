<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kviz: OOP, navrhove vzory a funkcionalni programovani</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eef0f6;
    color: #111827;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #0f0f1a; color: #e8eaf0; }
    .card { background: #1a1a2e; border-color: #2a2a45; }
    .answer-btn { background: #252540; border-color: #3a3a60; color: #e8eaf0; }
    .answer-btn:hover:not(:disabled) { background: #2e2e55; border-color: #5b6af0; }
    .progress-bg { background: #252540; }
    .explanation { background: #1e1e38; border-color: #3a3a60; }
    .summary-card { background: #1a1a2e; border-color: #2a2a45; }
    .score-ring { stroke: #252540; }
    .nav-btn { background: #252540; border-color: #3a3a60; color: #e8eaf0; }
    .nav-btn:hover:not(:disabled) { background: #2e2e55; }
    .question-num { color: #a0a8c8; }
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
    max-width: 680px;
    width: 100%;
  }

  .header h1 {
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 0.9rem;
    opacity: 0.6;
  }

  .progress-wrap {
    width: 100%;
    max-width: 680px;
    margin-bottom: 20px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    opacity: 0.65;
    margin-bottom: 6px;
  }

  .progress-bg {
    background: #dde1eb;
    border-radius: 99px;
    height: 7px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #5b6af0, #7b8ff5);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  .score-badge {
    font-size: 0.8rem;
    font-weight: 600;
    background: #5b6af0;
    color: #fff;
    padding: 3px 10px;
    border-radius: 99px;
    margin-left: 8px;
  }

  .card {
    background: #ffffff;
    border: 1px solid #d8dce8;
    border-radius: 16px;
    padding: 28px 28px 24px;
    max-width: 680px;
    width: 100%;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    color: #111827;
  }

  .category-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 9px;
    border-radius: 99px;
    margin-bottom: 14px;
  }

  .cat-oop       { background: #e8f4fd; color: #1a6fa8; }
  .cat-patterns  { background: #fde8f4; color: #a81a6f; }
  .cat-structural{ background: #f4fde8; color: #4a7a10; }
  .cat-behavioral{ background: #fdf4e8; color: #a86a1a; }
  .cat-fp        { background: #ede8fd; color: #6a1aa8; }
  .cat-spec      { background: #e8fdf4; color: #1aa870; }
  .cat-ds        { background: #fde8e8; color: #a81a1a; }

  @media (prefers-color-scheme: dark) {
    .cat-oop       { background: #0d2a40; color: #6ab8f0; }
    .cat-patterns  { background: #40102a; color: #f06ab8; }
    .cat-structural{ background: #1a3005; color: #90d040; }
    .cat-behavioral{ background: #3a2005; color: #f0a060; }
    .cat-fp        { background: #200540; color: #b060f0; }
    .cat-spec      { background: #053a20; color: #60f0a0; }
    .cat-ds        { background: #3a0505; color: #f06060; }
  }

  .question-num {
    font-size: 0.75rem;
    color: #6b7280;
    margin-bottom: 4px;
  }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 22px;
    color: #111827;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .answer-btn {
    text-align: left;
    background: #f7f8fc;
    border: 1.5px solid #dde1eb;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.93rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    line-height: 1.45;
    color: #1a1a2e;
  }

  .answer-btn:hover:not(:disabled) {
    background: #eef0fa;
    border-color: #5b6af0;
    transform: translateX(2px);
  }

  .answer-btn:disabled { cursor: default; transform: none; }

  .answer-btn.correct {
    background: #d4f5e2;
    border-color: #22a05a;
    color: #0d5c35;
    font-weight: 600;
  }

  .answer-btn.incorrect {
    background: #fde8e8;
    border-color: #e05050;
    color: #8b1a1a;
  }

  @media (prefers-color-scheme: dark) {
    .answer-btn.correct   { background: #0d3a20; border-color: #22a05a; color: #60f0a0; }
    .answer-btn.incorrect { background: #3a0d0d; border-color: #e05050; color: #f08080; }
  }

  .explanation {
    display: none;
    background: #eef1ff;
    border: 1px solid #b8c4f0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.87rem;
    line-height: 1.55;
    margin-bottom: 20px;
    color: #1e2560;
  }

  @media (prefers-color-scheme: dark) {
    .explanation { color: #b0b8e8; }
  }

  .explanation.visible { display: block; }

  .explanation strong { display: block; margin-bottom: 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    display: none;
  }

  .nav-row.visible { display: flex; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f7f8fc;
    border: 1.5px solid #dde1eb;
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-weight: 500;
    color: #1a1a2e;
  }

  .nav-btn:hover:not(:disabled) { background: #eef0fa; border-color: #5b6af0; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn.primary { background: #5b6af0; border-color: #5b6af0; color: #fff; }
  .nav-btn.primary:hover:not(:disabled) { background: #4a58e0; border-color: #4a58e0; }

  /* Summary screen */
  .summary-card {
    background: #fff;
    border: 1px solid #e0e4ef;
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 680px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    display: none;
  }

  .summary-card.visible { display: block; }
  .card.hidden, .progress-wrap.hidden { display: none; }

  .ring-wrap {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }

  .ring-svg { width: 140px; height: 140px; transform: rotate(-90deg); }

  .score-ring {
    fill: none;
    stroke: #e8eaee;
    stroke-width: 12;
  }

  .score-arc {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
  }

  .score-label {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .score-sub {
    font-size: 0.85rem;
    opacity: 0.6;
    margin-top: 2px;
  }

  .result-msg {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 12px 0 6px;
  }

  .result-detail {
    font-size: 0.9rem;
    opacity: 0.65;
    margin-bottom: 28px;
  }

  .restart-btn {
    background: #5b6af0;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 32px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .restart-btn:hover { background: #4a58e0; transform: translateY(-1px); }

  .breakdown {
    margin-top: 28px;
    text-align: left;
  }

  .breakdown h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.5;
    margin-bottom: 12px;
  }

  .breakdown-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }

  .breakdown-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-ok   { background: #22a05a; }
  .dot-fail { background: #e05050; }

  .breakdown-q { flex: 1; line-height: 1.4; }
  .breakdown-icon { font-size: 1rem; }
</style>
</head>
<body>

<div class="header">
  <h1>OOP, navrhove vzory &amp; FP</h1>
  <p>Interaktivni kviz &mdash; 25 otazek</p>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-meta">
    <span id="progressLabel">Otazka 1 z 25</span>
    <span>Skore: <span class="score-badge" id="scoreBadge">0</span></span>
  </div>
  <div class="progress-bg">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="card" id="quizCard">
  <span class="category-tag" id="catTag"></span>
  <div class="question-num" id="qNum"></div>
  <div class="question-text" id="qText"></div>
  <div class="answers" id="answersDiv"></div>
  <div class="explanation" id="explanationDiv"><strong>Vysvetleni</strong><span id="explanationText"></span></div>
  <div class="nav-row" id="navRow">
    <button class="nav-btn" id="btnBack">&#8592; Zpet</button>
    <button class="nav-btn primary" id="btnNext">Dalsi &#8594;</button>
  </div>
</div>

<div class="summary-card" id="summaryCard">
  <div style="font-size:2rem;margin-bottom:4px;">&#127941;</div>
  <div style="font-size:1.05rem;font-weight:600;margin-bottom:2px;">Kviz dokoncen!</div>
  <div class="ring-wrap">
    <div style="position:relative;width:140px;height:140px;">
      <svg class="ring-svg" viewBox="0 0 140 140">
        <circle class="score-ring" cx="70" cy="70" r="56"/>
        <circle class="score-arc" id="scoreArc" cx="70" cy="70" r="56"
          stroke-dasharray="351.86" stroke-dashoffset="351.86" stroke="#5b6af0"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
        <div class="score-label" id="summaryPct">0%</div>
        <div class="score-sub" id="summaryFrac">0/0</div>
      </div>
    </div>
  </div>
  <div class="result-msg" id="resultMsg"></div>
  <div class="result-detail" id="resultDetail"></div>
  <button class="restart-btn" id="restartBtn">&#8635; Zacit znovu</button>
  <div class="breakdown" id="breakdownDiv">
    <h3>Prehled odpovedi</h3>
    <div id="breakdownList"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var ALL_QUESTIONS = [
    {
      cat: 'oop',
      catLabel: 'OOP',
      text: 'Co je "encapsulation" (zapouzdreni) v OOP?',
      answers: [
        'Schopnost objektu mit vice forem (polymorfismus)',
        'Skryti vnitrni reprezentace objektu a pristup pres verejne metody',
        'Moznost dedit atributy a metody z nadtriedy',
        'Definice spolecneho rozhrani pro viacero trid'
      ],
      correct: 1,
      explanation: 'Zapouzdreni (encapsulation) znamena, ze vnitrni stav objektu je skryt pred okolim. K datum se pristupuje vyhradne pres verejne metody (gettery/settery), coz zvysuje bezpecnost a modularitu.'
    },
    {
      cat: 'oop',
      catLabel: 'OOP',
      text: 'Jaky je rozdil mezi "overloading" a "overriding"?',
      answers: [
        'Overloading je prepis metody predka v potomkovi; overriding je vice metod se stejnym jmenem v jedne tride',
        'Oba pojmy jsou synonyma pro polymorfismus',
        'Overloading je vice metod se stejnym jmenem a ruznymi parametry v jedne tride; overriding je prepis metody predka v potomkovi',
        'Overloading je specialni typ dedicnosti; overriding je typ zapouzdreni'
      ],
      correct: 2,
      explanation: 'Overloading = vice metod se stejnym jmenem, ale ruznymi parametry (v ramci jedne tridy). Overriding = prepis metody predka v potomkovi se stejnym jmenem i parametry, coz umoznuje polymorfismus.'
    },
    {
      cat: 'oop',
      catLabel: 'OOP',
      text: 'Kdy preferujeme pouziti interface pred abstraktni tridou v Jave?',
      answers: [
        'Kdyz chceme sdilet implementovany kod mezi vice tridami ze stejne hierarchie',
        'Kdyz potrebujeme private nebo protected metody v kontraktu',
        'Kdyz chceme definovat verejne API a umoznit implementaci i tridami z ruznych hierarchii',
        'Kdyz chceme pouzit nestaticke a nefinalni promenne'
      ],
      correct: 2,
      explanation: 'Interface pouzijeme pro definici vnejsiho rozhrani (verejneho API), kdyz chceme, aby i objekty z jine class hierarchie mohly implementovat stejny kontrakt, a kdyz predpisujeme pouze metody bez sdilene implementace.'
    },
    {
      cat: 'oop',
      catLabel: 'OOP',
      text: 'Jaky je vztah "kompozice" v OOP?',
      answers: [
        'Slaby vztah, kde objekty existuji nezavisle (student - kurz)',
        'Stredni vztah, kde objekty ziji nezavisle, ale jeden obsahuje druhy',
        'Silny vztah, kde zanik jednoho objektu zpusobi zanik druheho (dum - mistnost)',
        'Vztah oznacujici dedicnost tridy z nadtridy'
      ],
      correct: 2,
      explanation: 'Kompozice je nejsilnejsi vztah - zanik "celku" zpusobi zanik "casti" (napr. dum - mistnosti). Naopak agregace je slabsi vztah, kde casti mohou existovat i bez celku, a asociace je nejslabsi.'
    },
    {
      cat: 'oop',
      catLabel: 'OOP',
      text: 'Co rika princip "Liskov Substitution" (LSP) ze SOLID?',
      answers: [
        'Kazda trida ma mit pouze jeden duvod ke zmene',
        'Podtypy musi byt zamenitelne za sve nadtypy bez naruseni spravnosti programu',
        'Tridy maji byt otevrene rozsireni a uzavrene modifikaci',
        'Zavislosti maji byt na abstraktnich rozhranich, ne na konkretnich tridach'
      ],
      correct: 1,
      explanation: 'Liskovove princip substituce rika, ze kdekoli pouzijeme instanci nadtridy, mela by byt pouzitelna i instance potomka, aniz by se zmenilo spravne chovani programu.'
    },
    {
      cat: 'patterns',
      catLabel: 'Kreacni vzory',
      text: 'Jaky je ucel vzoru "Builder"?',
      answers: [
        'Zajistit, ze od dane tridy existuje pouze jedna instance',
        'Oddelit konstrukci komplexniho objektu od jeho reprezentace a podporit fluent interface',
        'Poskytnout rozhrani pro vytvareni objektu a nechat podtridy rozhodovat o konkretnim typu',
        'Vytvorit nove objekty klonovanim existujici instance'
      ],
      correct: 1,
      explanation: 'Builder oddeluje konstrukci komplexniho objektu od jeho reprezentace. Je vhodny pro objekty s mnoha nepovinnymi parametry a umoznuje fluent interface (retezeni metod).'
    },
    {
      cat: 'patterns',
      catLabel: 'Kreacni vzory',
      text: 'Ktery navrhovy vzor pouziva "double-checked locking" s "volatile" klicoumovou slovem?',
      answers: [
        'Factory Method',
        'Prototype',
        'Singleton',
        'Builder'
      ],
      correct: 2,
      explanation: 'Singleton zajistuje existenci prave jedne instance tridy. V multithreadovem prostredi je nutne pouzit double-checked locking a keyword volatile, aby se predoslo race conditions.'
    },
    {
      cat: 'patterns',
      catLabel: 'Kreacni vzory',
      text: 'Jaky je rozdil mezi "Factory Method" a "Abstract Factory"?',
      answers: [
        'Factory Method vytvari jednu tridu objektu; Abstract Factory vytvari celou rodinu prubuznych objektu',
        'Abstract Factory je jednodussi verze Factory Method',
        'Factory Method pouziva kompozici; Abstract Factory pouziva dedicnost',
        'Oba vzory jsou ekvivalentni, lisi se pouze nazvem'
      ],
      correct: 0,
      explanation: 'Factory Method poskytuje rozhrani pro vytvoreni jednoho druhu objektu a necha podtridy rozhodovat o konkretnim typu. Abstract Factory je "tovarna na tovarny" - vytvari celou rodinu prubuznych objektu (napr. cela GUI rodina pro danou platformu).'
    },
    {
      cat: 'patterns',
      catLabel: 'Kreacni vzory',
      text: 'Co je "Dependency Injection" (DI)?',
      answers: [
        'Vzor pro cachovani zavislosti mezi moduly',
        'Technika vkladani zavislosti mezi komponenty tak, aby jedna mohla pouzivat druhou bez staticke reference',
        'Zpusob, jak vytvorit singleton s lazyloadingem',
        'Princip, ktery zakazuje pouzivani globalnich promennych'
      ],
      correct: 1,
      explanation: 'Dependency Injection je technika, pri ktere zavislosti nejsou vytvareny uvnitr tridy, ale vlozeny zvenci (pres konstruktor, setter nebo atribut). Umoznuje lepsi testovatelnost a volnou vazbu.'
    },
    {
      cat: 'structural',
      catLabel: 'Strukturalni vzory',
      text: 'Jaky je hlavni rozdil mezi vzory "Adapter" a "Proxy"?',
      answers: [
        'Adapter i Proxy maji vzdy shodne rozhrani s cilowym objektem',
        'Adapter poskytuje odlisne rozhrani; Proxy poskytuje shodne rozhrani jako cilovy objekt',
        'Proxy meni funkcionalitu objektu; Adapter pouze meni jeho jmeno',
        'Adapter funguje pouze pro datove struktury; Proxy je urcen pro siti'
      ],
      correct: 1,
      explanation: 'Adapter sladi rozhrani mezi nekompatibilnimi tridami - poskytuje jine rozhrani, nez ma adaptovany objekt. Proxy ma shodne rozhrani jako cilovy objekt a pridava vlastni logiku (bezpecnost, logovani, cache).'
    },
    {
      cat: 'structural',
      catLabel: 'Strukturalni vzory',
      text: 'Ktery vzor pouziva stromovou strukturu a umoznuje jednotne zachazeni s listy i slozkami?',
      answers: [
        'Decorator',
        'Bridge',
        'Composite',
        'Flyweight'
      ],
      correct: 2,
      explanation: 'Composite umoznuje jednotne zachazeni s jednotlivymi objekty (listy) i jejich slozenim (kompozity). Typickym prikladem je souborovy system (soubory a slozky) nebo GUI komponenty.'
    },
    {
      cat: 'structural',
      catLabel: 'Strukturalni vzory',
      text: 'Jaky je ucel vzoru "Flyweight"?',
      answers: [
        'Obalovat objekty a dynamicky pridavat chovani',
        'Minimalizovat spotrebu pameti sdilenim spolecneho stavu mezi instancemi',
        'Ridit pristup k objektum pres proxy vrstvu',
        'Oddelit abstrakci od implementace pres dve hierarchie'
      ],
      correct: 1,
      explanation: 'Flyweight minimalizuje spotrebu pameti tak, ze sdili spolecny (vnitrni) stav mezi mnoha instancemi objektu. Pouziva se napr. pro znaky v textu nebo castice v hre.'
    },
    {
      cat: 'structural',
      catLabel: 'Strukturalni vzory',
      text: 'Co dela vzor "Decorator" a cim se lisi od dedicnosti?',
      answers: [
        'Decorator meni rozhrani objektu; dedicnost ho zachovava',
        'Decorator dynamicky pridava chovani do objektu za behu bez zmeny jeho tridy; dedicnost je staticka',
        'Decorator je podtyp dedicnosti vhodny pro interface',
        'Decorator a dedicnost jsou ekvivalentni zpusoby rozsireni chovani'
      ],
      correct: 1,
      explanation: 'Decorator umoznuje dynamicky (za behu) pridat chovani do objektu obalenim - vytvori tridou se stejnym rozhranim. Narozdil od dedicnosti je flexibilnejsi: lze kombinovat vice dekoratoru a menit je dynamicky.'
    },
    {
      cat: 'behavioral',
      catLabel: 'Behavioralni vzory',
      text: 'Jaky je ucel vzoru "Observer"?',
      answers: [
        'Definovat kostru algoritmu, kde variantni kroky jsou ponechany podtridam',
        'Umoznit vice objektum reagovat na zmenu stavu jineho objektu (subject)',
        'Oddelit iteraci od konkretni datove struktury',
        'Modelovat stav systemu jako objekt s vlastni logikou'
      ],
      correct: 1,
      explanation: 'Observer umoznuje, aby vice observeru bylo notifikovano pri zmene stavu subjektu. Subject si udrzuje seznam observeru a pri setState() je vsechny notifikuje - typicky pouziti pro event-driven programovani.'
    },
    {
      cat: 'behavioral',
      catLabel: 'Behavioralni vzory',
      text: 'Vzor "Strategy" se pouziva kdyz chceme:',
      answers: [
        'Vracet objekt do predchoziho stavu (undo/redo)',

  var questions = [];
  var current = 0;
  var score = 0;
  var answered = [];
  var shuffledOrders = [];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(ALL_QUESTIONS);
    score = 0;
    current = 0;
    answered = [];
    shuffledOrders = [];

    for (var i = 0; i < questions.length; i++) {
      answered.push(null);
      var indices = [0, 1, 2, 3];
      shuffledOrders.push(shuffle(indices));
    }

    document.getElementById('summaryCard').classList.remove('visible');
    document.getElementById('quizCard').classList.remove('hidden');
    document.getElementById('progressWrap').classList.remove('hidden');
    document.getElementById('scoreBadge').textContent = '0';

    renderQuestion();
  }

  function catClass(cat) {
    var map = { oop: 'cat-oop', patterns: 'cat-patterns', structural: 'cat-structural', behavioral: 'cat-behavioral', fp: 'cat-fp', spec: 'cat-spec', ds: 'cat-ds' };
    return map[cat] || 'cat-oop';
  }

  function renderQuestion() {
    var q = questions[current];
    var order = shuffledOrders[current];
    var state = answered[current];

    var tag = document.getElementById('catTag');
    tag.textContent = q.catLabel;
    tag.className = 'category-tag ' + catClass(q.cat);

    document.getElementById('qNum').textContent = 'Otazka ' + (current + 1) + ' z ' + questions.length;
    document.getElementById('qText').textContent = q.text;

    var container = document.getElementById('answersDiv');
    container.innerHTML = '';

    for (var i = 0; i < 4; i++) {
      var origIdx = order[i];
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIdx];
      btn.setAttribute('data-orig', origIdx);

      if (state !== null) {
        btn.disabled = true;
        if (origIdx === q.correct) {
          btn.classList.add('correct');
        } else if (state.chosen === origIdx) {
          btn.classList.add('incorrect');
        }
      } else {
        (function(oi) {
          btn.addEventListener('click', function() { selectAnswer(oi); });
        })(origIdx);
      }

      container.appendChild(btn);
    }

    var expDiv = document.getElementById('explanationDiv');
    var expText = document.getElementById('explanationText');
    if (state !== null) {
      expText.textContent = q.explanation;
      expDiv.classList.add('visible');
    } else {
      expDiv.classList.remove('visible');
      expText.textContent = '';
    }

    updateNav();
    updateProgress();
  }

  function selectAnswer(origIdx) {
    var q = questions[current];
    var isCorrect = origIdx === q.correct;
    if (isCorrect) score++;

    answered[current] = { chosen: origIdx, correct: isCorrect };

    var btns = document.getElementById('answersDiv').querySelectorAll('.answer-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = true;
      var oi = parseInt(btns[i].getAttribute('data-orig'));
      if (oi === q.correct) {
        btns[i].classList.add('correct');
      } else if (oi === origIdx && !isCorrect) {
        btns[i].classList.add('incorrect');
      }
    }

    var expDiv = document.getElementById('explanationDiv');
    document.getElementById('explanationText').textContent = q.explanation;
    expDiv.classList.add('visible');

    document.getElementById('scoreBadge').textContent = score;

    updateNav();
    updateProgress();
  }

  function updateNav() {
    var navRow = document.getElementById('navRow');
    var btnBack = document.getElementById('btnBack');
    var btnNext = document.getElementById('btnNext');

    var state = answered[current];
    if (state !== null) {
      navRow.classList.add('visible');
    } else {
      navRow.classList.remove('visible');
    }

    btnBack.disabled = current === 0;

    var isLast = current === questions.length - 1;
    if (isLast && state !== null) {
      btnNext.textContent = 'Zobrazit vysledky';
      btnNext.disabled = false;
    } else if (state !== null) {
      btnNext.textContent = 'Dalsi \u2192';
      btnNext.disabled = false;
    } else {
      btnNext.textContent = 'Dalsi \u2192';
      btnNext.disabled = true;
    }
  }

  function updateProgress() {
    var answeredCount = 0;
    for (var i = 0; i < answered.length; i++) {
      if (answered[i] !== null) answeredCount++;
    }
    var pct = (answeredCount / questions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = 'Otazka ' + (current + 1) + ' z ' + questions.length;
  }

  function showSummary() {
    document.getElementById('quizCard').classList.add('hidden');
    document.getElementById('progressWrap').classList.add('hidden');

    var pct = Math.round((score / questions.length) * 100);
    document.getElementById('summaryPct').textContent = pct + '%';
    document.getElementById('summaryFrac').textContent = score + ' / ' + questions.length;

    var msg, detail;
    if (pct >= 90) {
      msg = 'Vynikajici vysledek!';
      detail = 'Latku zvladate na vynikajici urovni. Jste pripraveni na zkousku!';
    } else if (pct >= 70) {
      msg = 'Dobre odvedena prace!';
      detail = 'Zaklady mate solidne. Par mezer by stalo opakovat.';
    } else if (pct >= 50) {
      msg = 'Solidni zaklad, ale je co zlepsovat.';
      detail = 'Doporucujeme projit chybne otazky a opakovat materialy.';
    } else {
      msg = 'Je co procvicovat!';
      detail = 'Doporucujeme projit materialy znovu a pak kviz zopakovat.';
    }
    document.getElementById('resultMsg').textContent = msg;
    document.getElementById('resultDetail').textContent = detail;

    var arc = document.getElementById('scoreArc');
    var circumference = 351.86;
    var offset = circumference - (pct / 100) * circumference;
    var arcColor = pct >= 70 ? '#22a05a' : (pct >= 50 ? '#e09000' : '#e05050');
    arc.setAttribute('stroke', arcColor);

    setTimeout(function() {
      arc.style.strokeDashoffset = offset;
    }, 100);

    var list = document.getElementById('breakdownList');
    list.innerHTML = '';
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var st = answered[i];
      var ok = st && st.correct;
      var row = document.createElement('div');
      row.className = 'breakdown-row';
      row.innerHTML = '<div class="breakdown-dot ' + (ok ? 'dot-ok' : 'dot-fail') + '"></div>' +
        '<div class="breakdown-q">' + q.text + '</div>' +
        '<div class="breakdown-icon">' + (ok ? '\u2705' : '\u274c') + '</div>';
      list.appendChild(row);
    }

    document.getElementById('summaryCard').classList.add('visible');
  }

  document.getElementById('btnNext').addEventListener('click', function() {
    if (current === questions.length - 1) {
      showSummary();
    } else {
      current++;
      renderQuestion();
    }
  });

  document.getElementById('btnBack').addEventListener('click', function() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  });

  document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
  });

  initQuiz();

});
</script>
