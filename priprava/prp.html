  // State
  var questions = [];
  var currentIndex = 0;
  var score = 0;
  var answered = []; // per question: null or { chosen: idx, shuffledOrder: [0,1,2,3] }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(ALL_QUESTIONS);
    currentIndex = 0;
    score = 0;
    answered = [];
    for (var i = 0; i < questions.length; i++) {
      answered.push(null);
    }
    document.getElementById('quizCard').style.display = '';
    document.getElementById('resultScreen').classList.remove('visible');
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[currentIndex];
    var total = questions.length;

    // Progress
    var answered_count = answered.filter(function(a){ return a !== null; }).length;
    document.getElementById('progressFill').style.width = (answered_count / total * 100) + '%';
    document.getElementById('progressLabel').textContent = answered_count + ' / ' + total;
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('questionCounter').textContent = 'Otazka ' + (currentIndex + 1) + ' z ' + total;

    // Category badge
    var badge = document.getElementById('categoryBadge');
    badge.textContent = q.catLabel;
    badge.className = 'category-badge cat-' + q.cat;

    // Question text
    document.getElementById('questionText').textContent = q.q;

    // Answers
    var container = document.getElementById('answersContainer');
    container.innerHTML = '';

    var state = answered[currentIndex];
    var shuffledOrder;
    if (state) {
      shuffledOrder = state.shuffledOrder;
    } else {
      shuffledOrder = shuffle([0, 1, 2, 3]);
    }

    for (var i = 0; i < 4; i++) {
      var origIdx = shuffledOrder[i];
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIdx];
      btn.dataset.origIdx = origIdx;

      if (state) {
        btn.disabled = true;
        if (origIdx === q.correct) {
          btn.classList.add('correct');
        } else if (origIdx === state.chosen) {
          btn.classList.add('wrong');
        }
      } else {
        (function(capturedOrigIdx, capturedShuffled) {
          btn.addEventListener('click', function() {
            handleAnswer(capturedOrigIdx, capturedShuffled);
          });
        })(origIdx, shuffledOrder);
      }
      container.appendChild(btn);
    }

    // Explanation
    var expl = document.getElementById('explanation');
    if (state) {
      expl.textContent = q.expl;
      expl.classList.add('visible');
    } else {
      expl.textContent = '';
      expl.classList.remove('visible');
    }

    // Navigation buttons
    var btnBack = document.getElementById('btnBack');
    var btnNext = document.getElementById('btnNext');
    var btnFinish = document.getElementById('btnFinish');

    btnBack.disabled = (currentIndex === 0);

    if (state !== null) {
      // Already answered – show navigation
      if (currentIndex < total - 1) {
        btnNext.style.display = '';
        btnFinish.style.display = 'none';
      } else {
        btnNext.style.display = 'none';
        btnFinish.style.display = '';
      }
    } else {
      // Not yet answered – hide forward navigation
      btnNext.style.display = 'none';
      btnFinish.style.display = 'none';
    }
  }

  function handleAnswer(chosenOrigIdx, shuffledOrder) {
    var q = questions[currentIndex];
    var isCorrect = (chosenOrigIdx === q.correct);

    if (isCorrect) { score++; }

    answered[currentIndex] = { chosen: chosenOrigIdx, shuffledOrder: shuffledOrder };

    // Update buttons
    var btns = document.querySelectorAll('.answer-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = true;
      var oi = parseInt(btns[i].dataset.origIdx);
      if (oi === q.correct) {
        btns[i].classList.add('correct');
      } else if (oi === chosenOrigIdx) {
        btns[i].classList.add('wrong');
      }
    }

    // Show explanation
    var expl = document.getElementById('explanation');
    expl.textContent = q.expl;
    expl.classList.add('visible');

    // Update progress label immediately
    var answered_count = answered.filter(function(a){ return a !== null; }).length;
    document.getElementById('progressFill').style.width = (answered_count / questions.length * 100) + '%';
    document.getElementById('progressLabel').textContent = answered_count + ' / ' + questions.length;
    document.getElementById('scoreDisplay').textContent = score;

    // Show navigation
    var btnNext = document.getElementById('btnNext');
    var btnFinish = document.getElementById('btnFinish');
    if (currentIndex < questions.length - 1) {
      btnNext.style.display = '';
      btnFinish.style.display = 'none';
    } else {
      btnNext.style.display = 'none';
      btnFinish.style.display = '';
    }
  }

  document.getElementById('btnBack').addEventListener('click', function() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  });

  document.getElementById('btnNext').addEventListener('click', function() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    }
  });

  document.getElementById('btnFinish').addEventListener('click', function() {
    showResult();
  });

  document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
  });

  function showResult() {
    document.getElementById('quizCard').style.display = 'none';
    var rs = document.getElementById('resultScreen');
    rs.classList.add('visible');

    var pct = Math.round(score / questions.length * 100);

    var emoji, title;
    if (pct >= 90) { emoji = '🏆'; title = 'Vynikající vykon!'; }
    else if (pct >= 75) { emoji = '🎉'; title = 'Skvely vysledek!'; }
    else if (pct >= 55) { emoji = '👍'; title = 'Dobrá prace!'; }
    else if (pct >= 40) { emoji = '📚'; title = 'Jeste trochu zapasit...'; }
    else { emoji = '💪'; title = 'Nevzdavej to!'; }

    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultPct').textContent = pct + '%';
    document.getElementById('resultSub').textContent = 'Spravne: ' + score + ' z ' + questions.length + ' otazek';
  }

  // Start
  initQuiz();

});
