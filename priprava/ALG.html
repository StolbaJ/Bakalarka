<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B4B33ALG – Kvíz</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    color: #111827;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .shell {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111827;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 0.9rem;
    color: #6b7280;
    margin-top: 4px;
  }

  /* ── Progress ── */
  .progress-wrap {
    background: #e5e7eb;
    border-radius: 999px;
    height: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: #4f46e5;
    border-radius: 999px;
    transition: width 0.35s ease;
    width: 0%;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #6b7280;
    margin-bottom: 20px;
  }

  .score-chip {
    background: #eef2ff;
    color: #4338ca;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
  }

  /* ── Card ── */
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 28px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    color: #111827;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 20px;
  }

  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.55;
    color: #111827;
  }

  /* ── Answers ── */
  .answers {
    display: grid;
    gap: 10px;
    margin-bottom: 20px;
  }

  .answer-btn {
    width: 100%;
    text-align: left;
    padding: 13px 16px;
    border-radius: 10px;
    border: 2px solid #e5e7eb;
    background: #f9fafb;
    font-family: inherit;
    font-size: 0.93rem;
    font-weight: 500;
    color: #111827;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    line-height: 1.45;
  }

  .answer-btn:hover:not(:disabled) {
    border-color: #a5b4fc;
    background: #eef2ff;
    color: #111827;
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #14532d;
  }

  .answer-btn.wrong {
    border-color: #dc2626;
    background: #fef2f2;
    color: #7f1d1d;
  }

  /* ── Explanation ── */
  .explanation {
    background: #f8fafc;
    border-left: 4px solid #4f46e5;
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    font-size: 0.88rem;
    color: #1e293b;
    line-height: 1.6;
    margin-bottom: 20px;
    display: none;
  }

  .explanation.visible {
    display: block;
  }

  /* ── Navigation ── */
  .nav-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .nav-btn {
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: #ffffff;
    background: #4f46e5;
    transition: background 0.15s, opacity 0.15s;
  }

  .nav-btn:hover:not(:disabled) {
    background: #4338ca;
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .nav-btn.secondary {
    background: #e5e7eb;
    color: #374151;
  }

  .nav-btn.secondary:hover:not(:disabled) {
    background: #d1d5db;
  }

  /* ── Results ── */
  .results {
    display: none;
    text-align: center;
    padding: 40px 28px;
  }

  .results.visible {
    display: block;
  }

  .result-pct {
    font-size: 4rem;
    font-weight: 800;
    color: #4f46e5;
    line-height: 1;
    margin-bottom: 8px;
  }

  .result-label {
    font-size: 1.2rem;
    font-weight: 600;
    color: #111827;
    margin-bottom: 6px;
  }

  .result-sub {
    font-size: 0.92rem;
    color: #6b7280;
    margin-bottom: 32px;
  }

  .result-grade {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 32px;
  }

  .restart-btn {
    display: inline-block;
    padding: 13px 32px;
    border-radius: 10px;
    border: none;
    background: #4f46e5;
    color: #ffffff;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }

  .restart-btn:hover {
    background: #4338ca;
  }

  /* ── Dark mode ── */
  @media (prefers-color-scheme: dark) {
    body {
      background: #0f1117;
      color: #f1f5f9;
    }

    header h1 { color: #f1f5f9; }
    header p { color: #94a3b8; }

    .progress-wrap { background: #1e2433; }
    .progress-bar { background: #818cf8; }
    .progress-meta { color: #94a3b8; }
    .score-chip { background: #1e1b4b; color: #a5b4fc; }

    .card {
      background: #1a1f2e;
      box-shadow: 0 2px 16px rgba(0,0,0,0.4);
      color: #f1f5f9;
    }

    .question-text { color: #f1f5f9; }

    .answer-btn {
      border-color: #2d3748;
      background: #232b3e;
      color: #e2e8f0;
    }

    .answer-btn:hover:not(:disabled) {
      border-color: #818cf8;
      background: #1e1b4b;
      color: #e2e8f0;
    }

    .answer-btn.correct {
      border-color: #16a34a;
      background: #052e16;
      color: #86efac;
    }

    .answer-btn.wrong {
      border-color: #dc2626;
      background: #2d0a0a;
      color: #fca5a5;
    }

    .explanation {
      background: #151c2c;
      border-color: #818cf8;
      color: #cbd5e1;
    }

    .nav-btn {
      background: #818cf8;
      color: #0f1117;
    }

    .nav-btn:hover:not(:disabled) {
      background: #6366f1;
    }

    .nav-btn.secondary {
      background: #2d3748;
      color: #e2e8f0;
    }

    .nav-btn.secondary:hover:not(:disabled) {
      background: #374151;
    }

    .results { color: #f1f5f9; }
    .result-pct { color: #818cf8; }
    .result-label { color: #f1f5f9; }
    .result-sub { color: #94a3b8; }
    .restart-btn { background: #818cf8; color: #0f1117; }
    .restart-btn:hover { background: #6366f1; }
  }
</style>

  var state = {
    questions: [],
    current: 0,
    score: 0,
    answered: [],
    chosenIdx: [],
    shuffledOptions: []
  };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    state.questions = shuffle(QUESTIONS);
    state.current = 0;
    state.score = 0;
    state.answered = [];
    state.chosenIdx = [];
    state.shuffledOptions = [];

    for (var i = 0; i < state.questions.length; i++) {
      state.answered.push(false);
      state.chosenIdx.push(-1);
      var q = state.questions[i];
      var indices = [];
      for (var j = 0; j < q.answers.length; j++) indices.push(j);
      state.shuffledOptions.push(shuffle(indices));
    }

    document.getElementById('results').classList.remove('visible');
    document.getElementById('quizCard').style.display = '';
    document.getElementById('progressBar').parentElement.style.display = '';
    document.querySelector('.progress-meta').style.display = '';

    renderQuestion();
  }

  function renderQuestion() {
    var i = state.current;
    var q = state.questions[i];
    var total = state.questions.length;

    document.getElementById('progressBar').style.width = ((i / total) * 100) + '%';
    document.getElementById('progressLabel').textContent = 'Otázka ' + (i + 1) + ' / ' + total;
    document.getElementById('scoreLabel').textContent = 'Skóre: ' + state.score;

    var tag = document.getElementById('qTag');
    tag.textContent = q.cat;
    tag.style.background = q.catBg;
    tag.style.color = q.catColor;

    document.getElementById('qText').textContent = q.text;

    var container = document.getElementById('answersContainer');
    container.innerHTML = '';

    var shuffled = state.shuffledOptions[i];
    var answered = state.answered[i];
    var chosenOrig = state.chosenIdx[i];

    for (var k = 0; k < shuffled.length; k++) {
      var origIdx = shuffled[k];
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIdx];
      btn.setAttribute('data-orig', origIdx);
      btn.setAttribute('data-pos', k);

      if (answered) {
        btn.disabled = true;
        if (origIdx === q.correct) {
          btn.classList.add('correct');
        } else if (origIdx === chosenOrig) {
          btn.classList.add('wrong');
        }
      } else {
        btn.addEventListener('click', onAnswerClick);
      }
      container.appendChild(btn);
    }

    var expl = document.getElementById('explanation');
    if (answered) {
      expl.textContent = q.explanation;
      expl.classList.add('visible');
    } else {
      expl.textContent = '';
      expl.classList.remove('visible');
    }

    var btnNext = document.getElementById('btnNext');
    var btnBack = document.getElementById('btnBack');

    btnBack.disabled = (i === 0);

    if (answered) {
      if (i < total - 1) {
        btnNext.textContent = 'Dalsi \u2192';
        btnNext.disabled = false;
      } else {
        btnNext.textContent = 'Zobrazit vysledky';
        btnNext.disabled = false;
      }
    } else {
      if (i < total - 1) {
        btnNext.textContent = 'Dalsi \u2192';
      } else {
        btnNext.textContent = 'Zobrazit vysledky';
      }
      btnNext.disabled = true;
    }
  }

  function onAnswerClick(e) {
    var i = state.current;
    var q = state.questions[i];
    var origIdx = parseInt(e.currentTarget.getAttribute('data-orig'));

    state.answered[i] = true;
    state.chosenIdx[i] = origIdx;

    if (origIdx === q.correct) {
      state.score++;
    }

    var btns = document.getElementById('answersContainer').querySelectorAll('.answer-btn');
    for (var k = 0; k < btns.length; k++) {
      btns[k].disabled = true;
      btns[k].removeEventListener('click', onAnswerClick);
      var o = parseInt(btns[k].getAttribute('data-orig'));
      if (o === q.correct) {
        btns[k].classList.add('correct');
      } else if (o === origIdx) {
        btns[k].classList.add('wrong');
      }
    }

    var expl = document.getElementById('explanation');
    expl.textContent = q.explanation;
    expl.classList.add('visible');

    var btnNext = document.getElementById('btnNext');
    var total = state.questions.length;
    btnNext.disabled = false;
    if (i < total - 1) {
      btnNext.textContent = 'Dalsi \u2192';
    } else {
      btnNext.textContent = 'Zobrazit vysledky';
    }

    document.getElementById('scoreLabel').textContent = 'Skore: ' + state.score;
  }

  function showResults() {
    var total = state.questions.length;
    var pct = Math.round((state.score / total) * 100);

    document.getElementById('quizCard').style.display = 'none';
    document.getElementById('progressBar').parentElement.style.display = 'none';
    document.querySelector('.progress-meta').style.display = 'none';

    document.getElementById('resultPct').textContent = pct + '%';
    document.getElementById('resultLabel').textContent = 'Zvladl jsi ' + state.score + ' z ' + total + ' otazek';
    document.getElementById('resultSub').textContent = 'B4B33ALG – Algoritmy a datove struktury';

    var grade, gBg, gColor;
    if (pct >= 90) {
      grade = 'Vyborne! Znamka A'; gBg = '#d1fae5'; gColor = '#065f46';
    } else if (pct >= 75) {
      grade = 'Dobre! Znamka B'; gBg = '#dbeafe'; gColor = '#1e40af';
    } else if (pct >= 60) {
      grade = 'Obstojne. Znamka C'; gBg = '#fef3c7'; gColor = '#92400e';
    } else if (pct >= 50) {
      grade = 'Tesne. Znamka D/E'; gBg = '#ffedd5'; gColor = '#9a3412';
    } else {
      grade = 'Nedostatecne. Zopakuj materiál!'; gBg = '#fee2e2'; gColor = '#991b1b';
    }

    var gradeEl = document.getElementById('resultGrade');
    gradeEl.textContent = grade;
    gradeEl.style.background = gBg;
    gradeEl.style.color = gColor;

    document.getElementById('results').classList.add('visible');
    document.getElementById('progressBar').style.width = '100%';
  }

  document.getElementById('btnNext').addEventListener('click', function() {
    var total = state.questions.length;
    if (state.current < total - 1) {
      state.current++;
      renderQuestion();
    } else {
      showResults();
    }
  });

  document.getElementById('btnBack').addEventListener('click', function() {
    if (state.current > 0) {
      state.current--;
      renderQuestion();
    }
  });

  document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
  });

  initQuiz();
});
</script>
