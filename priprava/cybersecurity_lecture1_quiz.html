  function shuffleArray(array) {

      var temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;

    };
  });

  var currentIndex = 0;
  var maxReached = 0;
  var score = 0;

  var questionCounterEl = document.getElementById('questionCounter');
  var scoreCounterEl = document.getElementById('scoreCounter');
  var progressFillEl = document.getElementById('progressFill');
  var categoryTagEl = document.getElementById('categoryTag');
  var questionTextEl = document.getElementById('questionText');
  var answersContainerEl = document.getElementById('answersContainer');
  var explanationBoxEl = document.getElementById('explanationBox');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var quizArea = document.getElementById('quizArea');
  var resultArea = document.getElementById('resultArea');
  var resultScoreEl = document.getElementById('resultScore');
  var resultPercentEl = document.getElementById('resultPercent');
  var restartBtn = document.getElementById('restartBtn');

  function recalcScore() {
    var s = 0;
    for (var i = 0; i < questions.length; i++) {
      var st = state[i];
      if (st.answered) {
        var chosenOriginalIndex = st.shuffledIndices[st.selectedShuffledPos];
        if (chosenOriginalIndex === questions[i].correctIndex) {
          s++;
        }
      }
    }
    return s;
  }

  function renderQuestion() {
    var q = questions[currentIndex];
    var st = state[currentIndex];

    questionCounterEl.textContent = 'Question ' + (currentIndex + 1) + ' / ' + questions.length;
    score = recalcScore();
    scoreCounterEl.textContent = 'Score: ' + score;

    var progressPercent = Math.round(((currentIndex) / questions.length) * 100);
    progressFillEl.style.width = progressPercent + '%';

    categoryTagEl.textContent = q.category;
    var bgColor = categoryColors[q.category] || '#4f46e5';
    categoryTagEl.style.backgroundColor = bgColor;

    questionTextEl.textContent = q.question;

    answersContainerEl.innerHTML = '';

    var displayOptions = st.shuffledIndices.map(function(origIdx) {
      return q.options[origIdx];
    });

    for (var pos = 0; pos < displayOptions.length; pos++) {
      (function(pos) {
        var btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.type = 'button';
        btn.textContent = displayOptions[pos];

        var originalIdxForThisPos = st.shuffledIndices[pos];
        var isCorrectOption = (originalIdxForThisPos === q.correctIndex);

        if (st.answered) {
          btn.disabled = true;
          if (isCorrectOption) {
            btn.classList.add('correct');
          } else if (pos === st.selectedShuffledPos) {
            btn.classList.add('incorrect');
          }
        }

        btn.addEventListener('click', function() {
          if (st.answered) { return; }
          st.answered = true;
          st.selectedShuffledPos = pos;
          renderQuestion();
        });

        answersContainerEl.appendChild(btn);
      })(pos);
    }

    if (st.answered) {
      explanationBoxEl.textContent = q.explanation;
      explanationBoxEl.classList.add('show');
    } else {
      explanationBoxEl.textContent = '';
      explanationBoxEl.classList.remove('show');
    }

    prevBtn.disabled = (currentIndex === 0);

    if (currentIndex > maxReached) {
      maxReached = currentIndex;
    }

    if (!st.answered) {
      nextBtn.disabled = true;
      nextBtn.textContent = (currentIndex === questions.length - 1) ? 'Finish' : 'Next \u2192';
    } else {
      nextBtn.disabled = false;
      nextBtn.textContent = (currentIndex === questions.length - 1) ? 'Finish' : 'Next \u2192';
    }
  }

  prevBtn.addEventListener('click', function() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  });

  nextBtn.addEventListener('click', function() {
    var st = state[currentIndex];
    if (!st.answered) { return; }

    if (currentIndex === questions.length - 1) {
      showResults();
      return;
    }
    currentIndex++;
    renderQuestion();
  });

  function showResults() {
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    var finalScore = recalcScore();
    var percent = Math.round((finalScore / questions.length) * 100);
    resultScoreEl.textContent = finalScore + ' / ' + questions.length;
    resultPercentEl.textContent = percent + '% correct';
    progressFillEl.style.width = '100%';
  }

  restartBtn.addEventListener('click', function() {
    questions = shuffleArray(questionBank);
    state = questions.map(function(q) {
      var optionIndices = [0, 1, 2, 3];
      var shuffledIndices = shuffleArray(optionIndices);
      return {
        answered: false,
        selectedShuffledPos: null,
        shuffledIndices: shuffledIndices
      };
    });
    currentIndex = 0;
    maxReached = 0;
    score = 0;
    quizArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    renderQuestion();
  });

  renderQuestion();
});
</script>
</body>
</html>
