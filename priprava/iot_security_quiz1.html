    },

      category: "OWASP Top 10 IoT",
      question: "Which of the following is listed as an OWASP Top 10 IoT vulnerability related to authentication credentials?",
      options: ["Lack of Physical Hardening", "Weak, Guessable, or Hardcoded Passwords", "Insufficient Privacy Protection", "Insecure Data Transfer and Storage"],
      correct: 1,
      explanation: "Weak, Guessable, or Hardcoded Passwords is the first item on the OWASP Top 10 IoT Vulnerabilities list."
    },
    {
      category: "OWASP Top 10 IoT",
      question: "Which interfaces are identified in the lecture as part of Insecure Ecosystem Interfaces outside the IoT device itself?",
      options: ["Only physical hardware ports", "Web, Backend API, Cloud, and Mobile", "Only the device's power supply", "Only Bluetooth radios"],
      correct: 1,
      explanation: "Insecure Ecosystem Interfaces refers to insecure interfaces outside the device, including Web, Backend API, Cloud, and Mobile interfaces."
    },
    {
      category: "OWASP Top 10 IoT",
      question: "According to the lecture, what is a primary cause of SQL Injection vulnerabilities?",
      options: ["Overuse of encryption", "Missing input validation combined with application-generated queries containing user-fed input", "Excessive use of firewalls", "Devices being physically too small"],
      correct: 1,
      explanation: "SQL Injection is caused by missing input validation together with application-generated queries that contain user-fed input."
    },
    {
      category: "OWASP Top 10 IoT",
      question: "Which historical vulnerability is used in the lecture as an example under Use of Insecure or Outdated Components?",
      options: ["Heartbleed", "Stuxnet", "WannaCry", "Meltdown"],
      correct: 0,
      explanation: "Heartbleed is used as the example of a vulnerability arising from insecure or outdated software components."
    },
    {
      category: "Why IoT is Vulnerable",
      question: "Which of the following best reflects the lecture's IoT security summary statements?",
      options: ["Everything is a computer, everything is connected to the internet, everything can be hacked", "Nothing is connected, nothing can be hacked", "Only industrial devices can be hacked", "Security is guaranteed by default configurations"],
      correct: 0,
      explanation: "The lecture's IoT security summary states: everything is a computer, everything is connected to the internet, and everything can be hacked."
    }
  ];

  var state = {
    order: [],
    current: 0,
    answers: {}
  };

  var quizScreen = document.getElementById("quizScreen");
  var summaryScreen = document.getElementById("summaryScreen");
  var progressFill = document.getElementById("progressFill");
  var scoreBadge = document.getElementById("scoreBadge");
  var categoryTag = document.getElementById("categoryTag");
  var qIndexEl = document.getElementById("qIndex");
  var questionTextEl = document.getElementById("questionText");
  var answersContainer = document.getElementById("answersContainer");
  var explanationBox = document.getElementById("explanationBox");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var restartBtn = document.getElementById("restartBtn");
  var summaryPercent = document.getElementById("summaryPercent");
  var summaryDetail = document.getElementById("summaryDetail");

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    var indices = [];
    for (var i = 0; i < rawQuestions.length; i++) {
      indices.push(i);
    }
    state.order = shuffleArray(indices);
    state.current = 0;
    state.answers = {};
    quizScreen.classList.remove("hidden");
    summaryScreen.classList.add("hidden");
    renderQuestion();
  }

  function getAnswerState(qPos) {
    if (!state.answers[qPos]) {
      var qData = rawQuestions[state.order[qPos]];
      var optIndices = [];
      for (var i = 0; i < qData.options.length; i++) {
        optIndices.push(i);
      }
      state.answers[qPos] = {
        answered: false,
        selected: -1,
        optionOrder: shuffleArray(optIndices)
      };
    }
    return state.answers[qPos];
  }

  function computeScore() {
    var correctCount = 0;
    var answeredCount = 0;
    for (var key in state.answers) {
      if (state.answers.hasOwnProperty(key)) {
        var a = state.answers[key];
        if (a.answered) {
          answeredCount++;
          var qData = rawQuestions[state.order[key]];
          if (a.selected === qData.correct) {
            correctCount++;
          }
        }
      }
    }
    return { correct: correctCount, answered: answeredCount };
  }

  function renderQuestion() {
    var total = state.order.length;
    var qPos = state.current;
    var qData = rawQuestions[state.order[qPos]];
    var aState = getAnswerState(qPos);

    var pct = Math.round((qPos / total) * 100);
    progressFill.style.width = pct + "%";

    var scoreInfo = computeScore();
    scoreBadge.textContent = "Score: " + scoreInfo.correct + "/" + scoreInfo.answered;

    categoryTag.textContent = qData.category;
    var color = categoryColors[qData.category] ? categoryColors[qData.category] : "#2563eb";
    categoryTag.style.backgroundColor = color;

    qIndexEl.textContent = "Question " + (qPos + 1) + " of " + total;
    questionTextEl.textContent = qData.question;

    answersContainer.innerHTML = "";

    for (var i = 0; i < aState.optionOrder.length; i++) {
      var originalIndex = aState.optionOrder[i];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "answer-btn";
      btn.textContent = qData.options[originalIndex];
      btn.setAttribute("data-original-index", String(originalIndex));

      if (aState.answered) {
        btn.disabled = true;
        if (originalIndex === qData.correct) {
          btn.classList.add("correct");
        } else if (originalIndex === aState.selected) {
          btn.classList.add("incorrect");
        } else {
          btn.classList.add("dim");
        }
      } else {
        btn.addEventListener("click", function(ev) {
          var chosenIndex = parseInt(ev.currentTarget.getAttribute("data-original-index"), 10);
          handleAnswer(qPos, chosenIndex);
        });
      }

      answersContainer.appendChild(btn);
    }

    if (aState.answered) {
      explanationBox.classList.remove("hidden");
      var isCorrect = aState.selected === qData.correct;
      var verdict = isCorrect ? "Correct. " : "Not quite. ";
      explanationBox.innerHTML = "<strong>" + verdict + "</strong>" + qData.explanation;
    } else {
      explanationBox.classList.add("hidden");
      explanationBox.innerHTML = "";
    }

    backBtn.disabled = (qPos === 0);

    if (aState.answered) {
      nextBtn.disabled = false;
      nextBtn.textContent = (qPos === total - 1) ? "Finish" : "Next";
    } else {
      nextBtn.disabled = true;
      nextBtn.textContent = "Next";
    }
  }

  function handleAnswer(qPos, chosenIndex) {
    var aState = getAnswerState(qPos);
    if (aState.answered) {
      return;
    }
    aState.answered = true;
    aState.selected = chosenIndex;
    renderQuestion();
  }

  function goNext() {
    var total = state.order.length;
    var aState = getAnswerState(state.current);
    if (!aState.answered) {
      return;
    }
    if (state.current === total - 1) {
      showSummary();
      return;
    }
    state.current++;
    renderQuestion();
  }

  function goBack() {
    if (state.current === 0) {
      return;
    }
    state.current--;
    renderQuestion();
  }

  function showSummary() {
    var total = state.order.length;
    var scoreInfo = computeScore();
    var pct = total > 0 ? Math.round((scoreInfo.correct / total) * 100) : 0;
    summaryPercent.textContent = pct + "%";
    summaryDetail.textContent = scoreInfo.correct + " out of " + total + " correct";
    quizScreen.classList.add("hidden");
    summaryScreen.classList.remove("hidden");
  }

  backBtn.addEventListener("click", goBack);
  nextBtn.addEventListener("click", goNext);
  restartBtn.addEventListener("click", initQuiz);

  initQuiz();
});
</script>
