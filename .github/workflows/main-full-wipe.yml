# Deploy na Malinu s plným wipem – smaže i DB (čistý stav). BE i FE vždy build --no-cache.
name: Malina Docker Deploy (full wipe + DB)

on:
  workflow_dispatch:

jobs:
  deploy-full-wipe:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env and SSL
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SSL_PRIVATE_KEY_B64: ${{ secrets.SSL_PRIVATE_KEY_B64 }}
        run: |
          echo "JWT_SECRET=$JWT_SECRET" > .env
          echo "NEXT_PUBLIC_API_URL=" >> .env
          echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env
          mkdir -p docker/ssl
          echo "$SSL_PRIVATE_KEY_B64" | base64 -d > docker/ssl/key.pem
          chmod 600 docker/ssl/key.pem

      - name: Full wipe deploy (DB smazána, BE+FE build --no-cache)
        run: |
          sudo bash docker/scripts/blue-green-deploy-full-wipe.sh
