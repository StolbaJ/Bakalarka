name: Secure Docker Deploy

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted   # Runner na RPi5 – checkout i docker běží lokálně na Malině
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env and SSL
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SSL_PRIVATE_KEY_B64: ${{ secrets.SSL_PRIVATE_KEY_B64 }}
        run: |
          echo "JWT_SECRET=$JWT_SECRET" > .env
          echo "NEXT_PUBLIC_API_URL=" >> .env
          echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env
          mkdir -p docker/ssl
          # Ořezat mezery/nové řádky (GitHub Secret může přidat newline při vložení)
          KEY_B64="$(printf '%s' "$SSL_PRIVATE_KEY_B64" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "$KEY_B64" | base64 -d > docker/ssl/key.pem
          chmod 600 docker/ssl/key.pem
          # Ověření, že soubor je privátní klíč (ne certifikát!)
          if grep -q 'BEGIN CERTIFICATE' docker/ssl/key.pem; then
            echo "::error::Do SSL_PRIVATE_KEY_B64 jsi dal CERTIFIKÁT (cert.pem). Musí tam být PRIVÁTNÍ KLÍČ (soubor s -----END PRIVATE KEY-----). V Cloudflare stáhni ten druhý soubor – origin-certificate.key nebo podobně."
            exit 1
          fi
          if ! grep -q '-----BEGIN.*PRIVATE KEY-----' docker/ssl/key.pem; then
            echo "::error::SSL_PRIVATE_KEY_B64 neobsahuje platný PEM privátní klíč. Použij soubor, který končí na -----END PRIVATE KEY----- a zakóduj: base64 -i ten-soubor.pem | tr -d '\n'"
            exit 1
          fi

      - name: Use SSL Nginx config
        run: |
          rm -f docker/nginx/conf.d/default.conf
          cp docker/nginx/conf.d/default-ssl.conf docker/nginx/conf.d/default.conf

      - name: Docker Rebuild
        run: |
          sudo docker compose -f docker/docker-compose.yml --env-file .env down -v
          sudo docker compose -f docker/docker-compose.yml --env-file .env build --no-cache
          sudo docker compose -f docker/docker-compose.yml --env-file .env up -d
          sudo docker image prune -f
