spring:
  application:
    name: Backend-connection
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ski_connection_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
external:
  api:
    url: ${EXTERNAL_API_URL}
    usernameFrontend: ${EXTERNAL_API_USERNAME}
    passwordFrontend: ${EXTERNAL_API_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true



logging:
  level:
    cz.cvut.fel.skiapp.backendconnection: ${LOG_LEVEL:}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.flywaydb: info
