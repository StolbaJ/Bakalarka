  // State
  var questions = [];
  var questionStates = [];
  var currentIndex = 0;
  var score = 0;
  var answered = 0;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(ALL_QUESTIONS);
    questionStates = questions.map(function(q) {
      var indices = [0, 1, 2, 3];
      var shuffledOrder = shuffle(indices);
      return {
        answered: false,
        chosenIndex: -1,
        shuffledOrder: shuffledOrder
      };
    });
    currentIndex = 0;
    score = 0;
    answered = 0;

    document.getElementById('quizCard').style.display = '';
    document.getElementById('resultsCard').classList.remove('visible');
    updateProgress();
    renderQuestion();
  }

  function updateProgress() {
    var total = questions.length;
    var pct = Math.round((answered / total) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('questionCounter').textContent = 'Otazka ' + (currentIndex + 1) + ' z ' + total;
    document.getElementById('scoreCounter').textContent = 'Skore: ' + score + ' / ' + answered;
  }

  function renderQuestion() {
    var q = questions[currentIndex];
    var state = questionStates[currentIndex];
    var cat = CATEGORIES[q.cat];

    // Category badge
    var badge = document.getElementById('categoryBadge');
    badge.textContent = cat.label;
    badge.style.backgroundColor = cat.color;

    // Question text
    document.getElementById('questionText').textContent = q.q;

    // Answers
    var grid = document.getElementById('answersGrid');
    grid.innerHTML = '';

    state.shuffledOrder.forEach(function(origIndex, displayPos) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIndex];

      if (state.answered) {
        btn.disabled = true;
        if (origIndex === q.correct) {
          btn.classList.add('correct');
        } else if (origIndex === state.chosenIndex) {
          btn.classList.add('wrong');
        }
      } else {
        btn.addEventListener('click', (function(oi) {
          return function() { selectAnswer(oi); };
        })(origIndex));
      }

      grid.appendChild(btn);
    });

    // Explanation
    var expEl = document.getElementById('explanation');
    if (state.answered) {
      expEl.textContent = q.explanation;
      expEl.classList.add('visible');
    } else {
      expEl.textContent = '';
      expEl.classList.remove('visible');
    }

    // Nav buttons
    var btnBack = document.getElementById('btnBack');
    var btnNext = document.getElementById('btnNext');

    btnBack.disabled = (currentIndex === 0);

    if (state.answered) {
      btnNext.style.display = '';
      if (currentIndex === questions.length - 1) {
        btnNext.textContent = 'Zobrazit vysledky';
      } else {
        btnNext.textContent = 'Dalsi →';
      }
      // If reviewing old question, allow forward only up to latest answered or unanswered
      var latestReachable = getLatestReachable();
      if (currentIndex >= latestReachable && currentIndex === questions.length - 1) {
        btnNext.textContent = 'Zobrazit vysledky';
      }
    } else {
      btnNext.style.display = 'none';
    }

    updateProgress();
  }

  function getLatestReachable() {
    // Latest index we can go to: first unanswered or last question
    for (var i = 0; i < questionStates.length; i++) {
      if (!questionStates[i].answered) return i;
    }
    return questionStates.length - 1;
  }

  function selectAnswer(chosenOrigIndex) {
    var q = questions[currentIndex];
    var state = questionStates[currentIndex];

    if (state.answered) return;

    state.answered = true;
    state.chosenIndex = chosenOrigIndex;
    answered++;

    if (chosenOrigIndex === q.correct) {
      score++;
    }

    // Update button styles
    var btns = document.querySelectorAll('.answer-btn');
    var order = state.shuffledOrder;
    btns.forEach(function(btn, displayPos) {
      btn.disabled = true;
      var origIndex = order[displayPos];
      if (origIndex === q.correct) {
        btn.classList.add('correct');
      } else if (origIndex === chosenOrigIndex) {
        btn.classList.add('wrong');
      }
    });

    // Show explanation
    var expEl = document.getElementById('explanation');
    expEl.textContent = q.explanation;
    expEl.classList.add('visible');

    // Show next button
    var btnNext = document.getElementById('btnNext');
    btnNext.style.display = '';
    if (currentIndex === questions.length - 1) {
      btnNext.textContent = 'Zobrazit vysledky';
    } else {
      btnNext.textContent = 'Dalsi →';
    }

    updateProgress();
  }

  function goNext() {
    if (currentIndex === questions.length - 1) {
      showResults();
      return;
    }
    // Can advance only up to latest reachable
    var latestReachable = getLatestReachable();
    if (currentIndex < latestReachable) {
      currentIndex++;
      renderQuestion();
    } else if (currentIndex === latestReachable && questionStates[currentIndex].answered) {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }
  }

  function goBack() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  }

  function showResults() {
    document.getElementById('quizCard').style.display = 'none';
    var pct = Math.round((score / questions.length) * 100);
    document.getElementById('resultsPct').textContent = pct + ' %';
    document.getElementById('resultsSub').textContent = score + ' spravne z ' + questions.length + ' otazek';
    document.getElementById('breakdownCorrect').textContent = score;
    document.getElementById('breakdownWrong').textContent = (questions.length - score);

    var icon, msg;
    if (pct >= 90) {
      icon = '🏆';
      msg = 'Vynikajici! Ovladate latku na vyborne. Jste pripraveni na zkousku z B0B33OPT.';
    } else if (pct >= 75) {
      icon = '😊';
      msg = 'Dobre! Vasnalost je solidni. Doporucuji projit chybne zodpovezene otazky a opakovat.';
    } else if (pct >= 55) {
      icon = '📚';
      msg = 'Prumerne. Nektere temata je potreba procvicit. Zamerite se predevsim na chybna temata.';
    } else {
      icon = '🔍';
      msg = 'Materialje obtizny. Doporucuji znovu projit studijni materialy, predevsim LP, dualitu a konvexni funkce.';
    }

    document.getElementById('resultsIcon').textContent = icon;
    document.getElementById('gradeMsg').textContent = msg;
    document.getElementById('resultsCard').classList.add('visible');

    // Update progress to 100%
    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('questionCounter').textContent = 'Kviz dokoncen';
    document.getElementById('scoreCounter').textContent = 'Skore: ' + score + ' / ' + questions.length;
  }

  // Event listeners
  document.getElementById('btnNext').addEventListener('click', function() {
    goNext();
  });

  document.getElementById('btnBack').addEventListener('click', function() {
    goBack();
  });

  document.getElementById('btnRestart').addEventListener('click', function() {
    initQuiz();
  });

  // Start
  initQuiz();
});
</script>
