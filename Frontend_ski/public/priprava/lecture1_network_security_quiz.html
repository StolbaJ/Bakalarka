      options: [

      question: "What is a Bridge Protocol Data Unit (BPDU)?",
      options: [

        "A type of DHCP request",
        "A protocol used exclusively for wireless authentication"
      ],
      correctIndex: 1,
      explanation: "A BPDU is a spanning tree protocol message unit that describes the attributes of a switch port, such as its MAC address, priority, and cost to reach, enabling switches to gather information about each other."

      ],
      correctIndex: 0,
      explanation: "By sending BPDUs with a lower bridge ID and pretending to be a superior bridge, an attacker can force the network to elect the attacker's device as the root bridge, enabling a man-in-the-middle attack."

    {

      question: "What happens when an attacker exploits STP Topology Change Attacks by sending false Topology Change Notifications (TCNs)?",
      options: [
        "The root bridge responds with a Topology Change Acknowledgement, causing all switches to clear and relearn their MAC address mappings",
        "All switches immediately reboot",
        "The network automatically switches to a wireless connection",
        "DHCP leases are permanently revoked"
      ],
      correctIndex: 0,

  ];

  var categoryColors = {
    "Authentication Basics": "#2563eb",
    "Auth Factors": "#7c3aed",
    "Mutual Authentication": "#0891b2",
    "Replay Attacks": "#dc2626",
    "Key Exchange Protocols": "#d97706",
    "Link Layer Basics": "#059669",
    "ARP": "#db2777",
    "DHCP": "#4f46e5",
    "STP": "#ea580c"
  };

  var quizArea = document.getElementById("quizArea");
  var session = [];
  var currentIndex = 0;
  var score = 0;
  var maxUnlocked = 0;
  var showingResults = false;

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function initSession() {
    var order = shuffleArray(questionBank.map(function(q, idx) { return idx; }));
    session = order.map(function(qIdx) {
      var q = questionBank[qIdx];
      var optOrder = shuffleArray([0, 1, 2, 3]);
      return {
        category: q.category,
        questionText: q.question,
        options: q.options,
        explanation: q.explanation,
        originalCorrectIndex: q.correctIndex,
        optOrder: optOrder,
        answered: false,
        selectedDisplayIndex: null
      };
    });
    currentIndex = 0;
    score = 0;
    maxUnlocked = 0;
    showingResults = false;
  }

  function correctDisplayIndex(item) {
    for (var i = 0; i < item.optOrder.length; i++) {
      if (item.optOrder[i] === item.originalCorrectIndex) {
        return i;
      }
    }
    return -1;
  }

  function render() {
    if (showingResults) {
      renderResults();
      return;
    }
    var total = session.length;
    var item = session[currentIndex];
    var pct = Math.round(((currentIndex) / total) * 100);
    var color = categoryColors[item.category] || "#2563eb";

    var html = "";
    html += "<div class=\"top-bar\">";
    html += "<span>Question " + (currentIndex + 1) + " of " + total + "</span>";
    html += "<span class=\"score-box\">Score: " + score + " / " + total + "</span>";
    html += "</div>";
    html += "<div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:" + pct + "%\"></div></div>";
    html += "<div class=\"card\">";
    html += "<span class=\"category-badge\" style=\"background-color:" + color + "\">" + escapeHtml(item.category) + "</span>";
    html += "<div class=\"question-text\">" + escapeHtml(item.questionText) + "</div>";
    html += "<div class=\"answers\" id=\"answersContainer\"></div>";
    if (item.answered) {
      html += "<div class=\"explanation\"><strong>Explanation:</strong> " + escapeHtml(item.explanation) + "</div>";
    }
    html += "<div class=\"nav-row\">";
    html += "<button class=\"nav-btn secondary\" id=\"backBtn\">&larr; Back</button>";
    if (currentIndex === total - 1 && item.answered) {
      html += "<button class=\"nav-btn\" id=\"nextBtn\">View Results</button>";
    } else {
      html += "<button class=\"nav-btn\" id=\"nextBtn\">Next &rarr;</button>";
    }
    html += "</div>";
    html += "</div>";

    quizArea.innerHTML = html;

    var answersContainer = document.getElementById("answersContainer");
    for (var i = 0; i < item.optOrder.length; i++) {
      var origIdx = item.optOrder[i];
      var btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.type = "button";
      btn.textContent = item.options[origIdx];
      btn.setAttribute("data-display-index", String(i));

      if (item.answered) {
        btn.disabled = true;
        var correctDisp = correctDisplayIndex(item);
        if (i === correctDisp) {
          btn.classList.add("correct");
        } else if (i === item.selectedDisplayIndex) {
          btn.classList.add("incorrect");
        }
      } else {
        btn.addEventListener("click", function(e) {
          var idx = parseInt(e.target.getAttribute("data-display-index"), 10);
          selectAnswer(idx);
        });
      }
      answersContainer.appendChild(btn);
    }

    var backBtn = document.getElementById("backBtn");
    backBtn.disabled = (currentIndex === 0);
    backBtn.addEventListener("click", function() {
      if (currentIndex > 0) {
        currentIndex--;
        render();
      }
    });

    var nextBtn = document.getElementById("nextBtn");
    if (currentIndex === total - 1 && item.answered) {
      nextBtn.disabled = false;
      nextBtn.addEventListener("click", function() {
        showingResults = true;
        render();
      });
    } else {
      nextBtn.disabled = !(currentIndex < maxUnlocked);
      nextBtn.addEventListener("click", function() {
        if (currentIndex < maxUnlocked) {
          currentIndex++;
          render();
        }
      });
    }
  }

  function selectAnswer(displayIndex) {
    var item = session[currentIndex];
    if (item.answered) {
      return;
    }
    item.answered = true;
    item.selectedDisplayIndex = displayIndex;
    var correctDisp = correctDisplayIndex(item);
    if (displayIndex === correctDisp) {
      score++;
    }
    if (currentIndex + 1 > maxUnlocked) {
      maxUnlocked = currentIndex + 1;
    }
    render();
  }

  function renderResults() {
    var total = session.length;
    var pct = Math.round((score / total) * 100);
    var html = "";
    html += "<div class=\"card results-card\">";
    html += "<h2>Quiz Complete</h2>";
    html += "<div class=\"results-percent\">" + pct + "%</div>";
    html += "<div class=\"results-detail\">You answered " + score + " out of " + total + " questions correctly.</div>";
    html += "<button class=\"restart-btn\" id=\"restartBtn\">Restart Quiz</button>";
    html += "</div>";
    quizArea.innerHTML = html;
    document.getElementById("restartBtn").addEventListener("click", function() {
      initSession();
      render();
    });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  initSession();
  render();
});
</script>

</html>
