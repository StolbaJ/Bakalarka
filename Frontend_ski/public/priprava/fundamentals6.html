<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Modelling Quiz</title>
<style>
  :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #111827;
    --muted: #4b5563;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --btn-bg: #f1f5f9;
    --btn-text: #1a1a2e;
    --btn-border: #cbd5e1;
    --correct-bg: #dcfce7;
    --correct-text: #14532d;
    --correct-border: #16a34a;
    --incorrect-bg: #fee2e2;
    --incorrect-text: #7f1d1d;
    --incorrect-border: #dc2626;
    --progress-bg: #e2e8f0;
    --progress-fill: #2563eb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #60a5fa;
      --accent-text: #0f172a;
      --btn-bg: #334155;
      --btn-text: #f1f5f9;
      --btn-border: #475569;
      --correct-bg: #14532d;
      --correct-text: #bbf7d0;
      --correct-border: #22c55e;
      --incorrect-bg: #7f1d1d;
      --incorrect-text: #fecaca;
      --incorrect-border: #ef4444;
      --progress-bg: #334155;
      --progress-fill: #60a5fa;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 60px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  h1 {
    color: var(--text);
    font-size: 26px;
    margin: 0 0 4px 0;
    text-align: center;
  }

  .subtitle {
    color: var(--muted);
    text-align: center;
    font-size: 14px;
    margin: 0 0 20px 0;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .score-box {
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
  }

  .progress-track {
    flex: 1;
    min-width: 140px;
    height: 10px;
    background: var(--progress-bg);
    border-radius: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--progress-fill);
    transition: width 0.2s ease;
  }

  .progress-label {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }

  .card {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
    color: #1e3a8a;
    background: #dbeafe;
  }
  .badge-fundamentals { color: #1e3a8a; background: #dbeafe; }
  .badge-dfd { color: #5b21b6; background: #ede9fe; }
  .badge-stride { color: #92400e; background: #fef3c7; }
  .badge-quality { color: #991b1b; background: #fee2e2; }
  .badge-responses { color: #166534; background: #dcfce7; }
  .badge-cases { color: #9f1239; background: #ffe4e6; }
  .badge-frameworks { color: #075985; background: #e0f2fe; }

  @media (prefers-color-scheme: dark) {
    .badge-fundamentals { color: #bfdbfe; background: #1e3a8a; }
    .badge-dfd { color: #ddd6fe; background: #5b21b6; }
    .badge-stride { color: #fde68a; background: #92400e; }
    .badge-quality { color: #fecaca; background: #991b1b; }
    .badge-responses { color: #bbf7d0; background: #166534; }
    .badge-cases { color: #fecdd3; background: #9f1239; }
    .badge-frameworks { color: #bae6fd; background: #075985; }
  }

  .qtype-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .question-text {
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    line-height: 1.45;
    margin: 0 0 18px 0;
  }

  .answer-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--btn-bg);
    color: #1a1a2e;
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: inherit;
  }

  @media (prefers-color-scheme: dark) {
    .answer-btn { color: #f1f5f9; }
  }

  .answer-btn:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    background: var(--correct-bg);
    color: var(--correct-text);
    border-color: var(--correct-border);
  }

  .answer-btn.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-text);
    border-color: var(--incorrect-border);
  }

  .explanation {
    color: var(--text);
    background: var(--btn-bg);
    border-left: 4px solid var(--accent);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    margin-top: 12px;
  }

  .order-list {
    list-style: none;
    padding: 0;
    margin: 0 0 14px 0;
  }

  .order-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--btn-bg);
    color: #1a1a2e;
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 15px;
  }
  @media (prefers-color-scheme: dark) {
    .order-item { color: #f1f5f9; }
  }

  .order-item.correct-pos {
    background: var(--correct-bg);
    color: var(--correct-text);
    border-color: var(--correct-border);
  }
  .order-item.incorrect-pos {
    background: var(--incorrect-bg);
    color: var(--incorrect-text);
    border-color: var(--incorrect-border);
  }

  .order-text {
    flex: 1;
  }

  .order-controls {
    display: flex;
    gap: 6px;
    margin-left: 10px;
  }

  .order-controls button {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }

  .order-controls button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .primary-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .primary-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .secondary-btn {
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .secondary-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  textarea.open-answer {
    width: 100%;
    min-height: 100px;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    resize: vertical;
  }

  .sample-answer-box {
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 14px;
  }

  .sample-answer-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .self-grade-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .self-grade-row button {
    flex: 1;
    min-width: 140px;
  }

  .self-grade-btn-correct {
    background: var(--correct-bg);
    color: var(--correct-text);
    border: 1px solid var(--correct-border);
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .self-grade-btn-incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-text);
    border: 1px solid var(--incorrect-border);
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .self-grade-btn-correct:disabled, .self-grade-btn-incorrect:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .self-grade-result {
    margin-top: 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .self-grade-result.is-correct { color: var(--correct-border); }
  .self-grade-result.is-incorrect { color: var(--incorrect-border); }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    gap: 10px;
  }

  .nav-btn {
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .nav-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .check-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 14px;
  }
  .check-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .summary-card {
    background: var(--card-bg);
    color: var(--text);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 26px;
    text-align: center;
    margin-top: 8px;
  }

  .summary-percent {
    font-size: 42px;
    font-weight: 800;
    color: var(--accent);
    margin: 8px 0;
  }

  .summary-detail {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 18px;
  }

  .restart-row {
    text-align: center;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Threat Modelling Quiz</h1>
  <p class="subtitle">Fundamentals of Security and Cryptography &middot; AAU Copenhagen</p>

  <div class="top-bar">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">Question 1 of 1</div>
    <div class="score-box" id="scoreBox">Score: 0 / 0</div>
  </div>

  <div id="quizArea"></div>
  <div id="summaryArea"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  var quizData = [
    {
      id: 'mc1', type: 'mc', category: 'fundamentals',
      question: "In Shostack's four-question threat modelling method, what is the third question?",
      options: [
        'What are we building?',
        'What can go wrong?',
        'What are we going to do about it?',
        'Did we do a good job?'
      ],
      correctIndex: 2,
      explanation: "The four questions run in order: what are we building, what can go wrong, what are we going to do about it, and did we do a good job. Question three is where you move from identifying threats to deciding mitigations."
    },
    {
      id: 'mc2', type: 'mc', category: 'fundamentals',
      question: 'According to the lecture, what IS threat modelling?',
      options: [
        'A penetration test performed before release',
        'A compliance document filed for auditors',
        'A one-time activity done at project kickoff',
        'A set of design decisions, each with an owner'
      ],
      correctIndex: 3,
      explanation: 'The lecture explicitly rules out a pentest, a compliance document, and a one-time activity, defining threat modelling instead as a set of design decisions, each with an owner.'
    },
    {
      id: 'mc3', type: 'mc', category: 'fundamentals',
      question: 'Where does threat modelling sit in the software development lifecycle, according to the lecture?',
      options: ['Requirements', 'Design', 'Implementation', 'Operate'],
      correctIndex: 1,
      explanation: 'It is placed at the Design stage, described as a design-time activity that gets repeated in miniature every time the architecture changes.'
    },
    {
      id: 'mc4', type: 'mc', category: 'fundamentals',
      question: 'Per the "scope discipline" guidance, how many elements does the lecture call "a working diagram"?',
      options: ['3', '8', '15', '30'],
      correctIndex: 1,
      explanation: 'Eight elements is described as a working diagram, while thirty elements becomes a wall chart that gets photographed once and never used again.'
    },
    {
      id: 'mc5', type: 'mc', category: 'dfd',
      question: 'In the data flow diagram notation, which shape represents a trust boundary?',
      options: ['A rectangle', 'An oval', 'A dashed line', 'A solid arrow'],
      correctIndex: 2,
      explanation: 'The trust boundary is drawn as a dashed line marking where the level of trust changes, and the lecture calls it "the only shape that matters."'
    },
    {
      id: 'mc6', type: 'mc', category: 'dfd',
      question: 'In the data flow diagram notation, what does an oval represent?',
      options: ['External entity', 'Process', 'Data store', 'Data flow'],
      correctIndex: 1,
      explanation: 'An oval represents a process: your code, something that acts on data.'
    },
    {
      id: 'mc7', type: 'mc', category: 'dfd',
      question: 'In the data flow diagram notation, what do two parallel lines represent?',
      options: ['External entity', 'Trust boundary', 'Data store', 'Data flow'],
      correctIndex: 2,
      explanation: 'Two parallel lines represent a data store: data at rest, such as a database, a bucket, or a log file.'
    },
    {
      id: 'mc8', type: 'mc', category: 'dfd',
      question: 'According to the lecture\'s single most important sentence, where do threats cluster?',
      options: [
        'Inside processes only',
        'Where data crosses a trust boundary',
        'At external entities only',
        'Equally everywhere in the diagram'
      ],
      correctIndex: 1,
      explanation: 'The lecture states plainly: threats cluster where data crosses a trust boundary, so you start with the arrows that cross a dashed line.'
    },
    {
      id: 'mc9', type: 'mc', category: 'stride',
      question: 'In STRIDE, which security property does "Tampering" violate?',
      options: ['Authentication', 'Integrity', 'Confidentiality', 'Availability'],
      correctIndex: 1,
      explanation: 'Tampering is the negation of Integrity.'
    },
    {
      id: 'mc10', type: 'mc', category: 'stride',
      question: 'In STRIDE, which security property does "Repudiation" violate?',
      options: ['Authorization', 'Non-repudiation', 'Availability', 'Confidentiality'],
      correctIndex: 1,
      explanation: 'Repudiation is the negation of Non-repudiation.'
    },
    {
      id: 'mc11', type: 'mc', category: 'stride',
      question: 'Which data flow diagram element type is exposed to all six STRIDE threats?',
      options: ['External entity', 'Process', 'Data store', 'Data flow'],
      correctIndex: 1,
      explanation: 'A process (your own code) is exposed to all six STRIDE categories, which is why the lecture says this is where you spend most of your time.'
    },
    {
      id: 'mc12', type: 'mc', category: 'stride',
      question: 'Which STRIDE letters apply to a data flow, according to the lecture?',
      options: ['S, R', 'T, I, D', 'S, T, R, I, D, E', 'T, I, D, R'],
      correctIndex: 1,
      explanation: 'Data in motion can be changed, read, or stopped (Tampering, Information disclosure, Denial of service), but it cannot lie about who it is, so Spoofing and Repudiation do not apply.'
    },
    {
      id: 'mc13', type: 'mc', category: 'quality',
      question: 'According to the "three tests a threat has to pass," which of the following is NOT one of the three required elements?',
      options: [
        'A named entry point',
        'A plausible attacker capability',
        'A concrete asset',
        'A CVSS score'
      ],
      correctIndex: 3,
      explanation: 'The three tests are a named entry point, a plausible attacker capability, and a concrete asset. No scoring system such as CVSS is required by these tests.'
    },
    {
      id: 'mc14', type: 'mc', category: 'quality',
      question: 'Which phrase, if present in a threat sentence, indicates the work is not finished?',
      options: ['"will result in"', '"could potentially lead to"', '"is caused by"', '"was mitigated by"'],
      correctIndex: 1,
      explanation: 'The lecture states: if the sentence contains "could potentially lead to", the work is not finished.'
    },
    {
      id: 'mc15', type: 'mc', category: 'responses',
      question: 'Which of the four responses to a threat is described as "the cheapest fix available, and the one nobody proposes"?',
      options: ['Mitigate', 'Eliminate', 'Transfer', 'Accept'],
      correctIndex: 1,
      explanation: 'Eliminate means removing the feature or the data entirely, which the lecture calls the cheapest fix available and the one nobody proposes.'
    },
    {
      id: 'mc16', type: 'mc', category: 'cases',
      question: 'In the bug bounty RCE case study, why was the finding considered low severity despite being remote code execution?',
      options: [
        'The attacker had no viable entry point',
        'The asset behind the entry point was empty',
        'The report was not reproducible',
        'It required physical access to the server'
      ],
      correctIndex: 1,
      explanation: 'The container reachable through the vulnerability held no sensitive data, no secrets, and no route onward into the bank\'s core network, so the asset behind the entry point was empty.'
    },
    {
      id: 'mc17', type: 'mc', category: 'cases',
      question: 'In the "three boring findings" case, what allowed the chain to go undetected until it reached production data?',
      options: [
        'Encryption was disabled on the API',
        'No boundary was defined between staging and production',
        'The public status page used weak authentication',
        'MitID identity verification failed'
      ],
      correctIndex: 1,
      explanation: 'Staging pointed at the production database because nobody had drawn a boundary between staging and production, since none existed on the org chart either.'
    },
    {
      id: 'mc18', type: 'mc', category: 'frameworks',
      question: 'Which framework is described in the lecture as "the privacy counterpart to STRIDE"?',
      options: ['PASTA', 'LINDDUN', 'MITRE ATT&CK', 'DREAD'],
      correctIndex: 1,
      explanation: 'LINDDUN is the privacy counterpart to STRIDE, used when the harm is lawful processing done wrongly, which under GDPR covers most of the career-relevant cases.'
    },
    {
      id: 'mc19', type: 'mc', category: 'frameworks',
      question: 'Which framework does the lecture describe as "a taxonomy of observed adversary techniques... not a threat modelling method"?',
      options: ['Attack trees', 'PASTA', 'MITRE ATT&CK', 'DREAD'],
      correctIndex: 2,
      explanation: 'MITRE ATT&CK is useful for detection coverage and populating "what can go wrong", but the lecture is explicit that it is not itself a threat modelling method.'
    },
    {
      id: 'mc20', type: 'mc', category: 'frameworks',
      question: 'What criticism does the lecture make of DREAD?',
      options: [
        'It is too heavy for a lecture or a sprint',
        'It has no inter-rater reliability',
        'It only covers privacy harms',
        'It requires writing Python code'
      ],
      correctIndex: 1,
      explanation: 'DREAD is called a scoring scheme with no inter-rater reliability, worth knowing mainly as a cautionary tale about inventing numbers.'
    },
    {
      id: 'mc21', type: 'mc', category: 'frameworks',
      question: 'Which tool does the lecture mention for writing a threat model as code, versioned next to the system, in Python?',
      options: ['OWASP Threat Dragon', 'pytm', 'MITRE ATT&CK Navigator', 'LINDDUN GO'],
      correctIndex: 1,
      explanation: 'pytm lets you write a threat model as Python code rather than drawing boxes, versioned alongside the system.'
    },
    {
      id: 'order1', type: 'order', category: 'fundamentals',
      question: "Arrange Shostack's four threat modelling questions in the order the method poses them.",
      items: [
        'What are we building?',
        'What can go wrong?',
        'What are we going to do about it?',
        'Did we do a good job?'
      ],
      explanation: 'The method starts by describing the system, then finds threats, then decides responses, and finally checks the process itself.'
    },
    {
      id: 'order2', type: 'order', category: 'quality',
      question: 'Arrange these lifecycle stages in order of increasing cost to fix a flaw (cheapest first, most expensive last).',
      items: ['Design', 'Implementation', 'Production', 'Breach'],
      explanation: 'Design-time analysis is the cheapest security control available, costing "an afternoon and a whiteboard," while fixing a flaw after a breach brings in lawyers, regulators, and customers.'
    },
    {
      id: 'order3', type: 'order', category: 'stride',
      question: 'Arrange the STRIDE threat categories in the order they are listed in the lecture\'s STRIDE table.',
      items: [
        'Spoofing',
        'Tampering',
        'Repudiation',
        'Information disclosure',
        'Denial of service',
        'Elevation of privilege'
      ],
      explanation: 'This is the standard S-T-R-I-D-E order, each letter mapped to the security property it violates: authentication, integrity, non-repudiation, confidentiality, availability, and authorization.'
    },
    {
      id: 'open1', type: 'open', category: 'quality',
      question: 'The lecture shows a first attempt at a threat: "An attacker could hack the storage." Explain why this is considered useless, and what makes the rewritten version of the same threat actionable.',
      sampleAnswer: "The original sentence names no entry point, no trust boundary, no concrete asset, and no impact, so nobody can act on it and nobody can argue with it -- it is a worry, not a finding. The rewritten version fixes this by specifying the entry point (the unauthenticated upload endpoint), the boundaries crossed (browser into the service, service into storage), the asset at risk (other users' objects in the blob store), and the impact (integrity loss, plus content the service will go on to trust). That satisfies the three tests a threat has to pass: a named entry point, a plausible attacker capability, and a concrete asset."
    },
    {
      id: 'open2', type: 'open', category: 'frameworks',
      question: 'Explain the relationship between STRIDE and LINDDUN, and describe when you would reach for LINDDUN instead of STRIDE.',
      sampleAnswer: "STRIDE is built around six security properties -- authentication, integrity, non-repudiation, confidentiality, availability, and authorization -- and is used to find security threats to a system. LINDDUN is its privacy counterpart: instead of asking whether an attacker can break the system, it asks whether personal data is being processed in a way that harms the people it belongs to, even when nobody has broken anything technically. You reach for LINDDUN when the harm at stake is lawful processing done wrongly, which under GDPR describes most privacy-relevant work, rather than when the harm is a straightforward security compromise."
    },
    {
      id: 'open3', type: 'open', category: 'cases',
      question: 'Using the bug bounty RCE example, explain the principle "the severity of the technique is not the severity of the finding."',
      sampleAnswer: "A vulnerability's technical severity, such as achieving remote code execution, does not automatically translate into a severe real-world finding -- the actual impact depends on what asset the entry point leads to. In the example, an attacker achieved RCE through an outdated library on a bank's subdomain, which sounds critical on a triage queue. But the compromised container held no credentials, no secrets, and no data at rest, and had no route onward into the bank's core network or customer data. Because the asset behind the entry point was effectively empty, the real-world risk was minimal despite the impressive-sounding technique. The lesson is that the asset decides the severity of a finding, not how sophisticated or scary the exploitation technique looks."
    }
  ];

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  var categoryLabels = {
    fundamentals: 'Fundamentals',
    dfd: 'DFD Notation',
    stride: 'STRIDE',
    quality: 'Threat Quality',
    responses: 'Responses',
    cases: 'Case Studies',
    frameworks: 'Frameworks'
  };

  var categoryClasses = {
    fundamentals: 'badge-fundamentals',
    dfd: 'badge-dfd',
    stride: 'badge-stride',
    quality: 'badge-quality',
    responses: 'badge-responses',
    cases: 'badge-cases',
    frameworks: 'badge-frameworks'
  };

  var typeLabels = {
    mc: 'Multiple choice',
    order: 'Put in order',
    open: 'Open question'
  };

  var questionOrder = shuffleArray(quizData.map(function (q, idx) { return idx; }));

  var state = questionOrder.map(function (origIdx) {
    var q = quizData[origIdx];
    var s = { origIndex: origIdx, answered: false };
    if (q.type === 'mc') {
      var optIndexes = shuffleArray(q.options.map(function (o, i) { return i; }));
      s.shuffledOptionIndexes = optIndexes;
      s.selectedShuffledPos = null;
    } else if (q.type === 'order') {
      var itemIndexes = shuffleArray(q.items.map(function (o, i) { return i; }));
      s.currentOrder = itemIndexes;
      s.checked = false;
      s.wasCorrect = false;
    } else if (q.type === 'open') {
      s.revealed = false;
      s.selfGrade = null;
    }
    return s;
  });

  var currentIndex = 0;
  var furthestIndex = 0;

  var quizArea = document.getElementById('quizArea');
  var summaryArea = document.getElementById('summaryArea');
  var progressFill = document.getElementById('progressFill');
  var progressLabel = document.getElementById('progressLabel');
  var scoreBox = document.getElementById('scoreBox');

  function computeScore() {
    var correct = 0;
    for (var i = 0; i < state.length; i++) {
      var s = state[i];
      var q = quizData[s.origIndex];
      if (!s.answered) continue;
      if (q.type === 'mc') {
        var chosenOriginal = s.shuffledOptionIndexes[s.selectedShuffledPos];
        if (chosenOriginal === q.correctIndex) correct++;
      } else if (q.type === 'order') {
        if (s.wasCorrect) correct++;
      } else if (q.type === 'open') {
        if (s.selfGrade === 'correct') correct++;
      }
    }
    return correct;
  }

  function updateHeader() {
    var total = state.length;
    var answeredCount = state.filter(function (s) { return s.answered; }).length;
    progressFill.style.width = Math.round((answeredCount / total) * 100) + '%';
    progressLabel.textContent = 'Question ' + (currentIndex + 1) + ' of ' + total;
    var scored = computeScore();
    scoreBox.textContent = 'Score: ' + scored + ' / ' + answeredCount;
  }

  function isOrderCorrect(s, q) {
    for (var i = 0; i < s.currentOrder.length; i++) {
      if (s.currentOrder[i] !== i) return false;
    }
    return true;
  }

  function renderQuestion() {
    summaryArea.innerHTML = '';
    quizArea.innerHTML = '';
    var s = state[currentIndex];
    var q = quizData[s.origIndex];

    var card = document.createElement('div');
    card.className = 'card';

    var badge = document.createElement('span');
    badge.className = 'badge ' + categoryClasses[q.category];
    badge.textContent = categoryLabels[q.category];
    card.appendChild(badge);

    var typeLabel = document.createElement('div');
    typeLabel.className = 'qtype-label';
    typeLabel.style.color = 'var(--muted)';
    typeLabel.textContent = typeLabels[q.type];
    card.appendChild(typeLabel);

    var qText = document.createElement('p');
    qText.className = 'question-text';
    qText.style.color = 'var(--text)';
    qText.textContent = q.question;
    card.appendChild(qText);

    if (q.type === 'mc') {
      renderMC(card, s, q);
    } else if (q.type === 'order') {
      renderOrder(card, s, q);
    } else if (q.type === 'open') {
      renderOpen(card, s, q);
    }

    quizArea.appendChild(card);

    renderNav();
    updateHeader();

    if (currentIndex === state.length - 1 && s.answered) {
      renderSummary();
    }
  }

  function renderMC(card, s, q) {
    var list = document.createElement('div');
    for (var pos = 0; pos < s.shuffledOptionIndexes.length; pos++) {
      (function (pos) {
        var origOptIdx = s.shuffledOptionIndexes[pos];
        var btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.style.color = '#1a1a2e';
        btn.textContent = q.options[origOptIdx];
        btn.type = 'button';

        if (s.answered) {
          btn.disabled = true;
          if (origOptIdx === q.correctIndex) {
            btn.classList.add('correct');
          } else if (pos === s.selectedShuffledPos) {
            btn.classList.add('incorrect');
          }
        }

        btn.addEventListener('click', function () {
          if (s.answered) return;
          s.answered = true;
          s.selectedShuffledPos = pos;
          renderQuestion();
        });

        list.appendChild(btn);
      })(pos);
    }
    card.appendChild(list);

    if (s.answered) {
      var exp = document.createElement('div');
      exp.className = 'explanation';
      exp.style.color = 'var(--text)';
      exp.textContent = q.explanation;
      card.appendChild(exp);
    }
  }

  function renderOrder(card, s, q) {
    var list = document.createElement('ul');
    list.className = 'order-list';

    for (var pos = 0; pos < s.currentOrder.length; pos++) {
      (function (pos) {
        var origIdx = s.currentOrder[pos];
        var li = document.createElement('li');
        li.className = 'order-item';
        li.style.color = '#1a1a2e';

        if (s.checked) {
          if (origIdx === pos) {
            li.classList.add('correct-pos');
          } else {
            li.classList.add('incorrect-pos');
          }
        }

        var txt = document.createElement('span');
        txt.className = 'order-text';
        txt.textContent = q.items[origIdx];
        li.appendChild(txt);

        if (!s.checked) {
          var controls = document.createElement('div');
          controls.className = 'order-controls';

          var upBtn = document.createElement('button');
          upBtn.type = 'button';
          upBtn.textContent = '\u2191';
          upBtn.disabled = (pos === 0);
          upBtn.addEventListener('click', function () {
            var tmp = s.currentOrder[pos - 1];
            s.currentOrder[pos - 1] = s.currentOrder[pos];
            s.currentOrder[pos] = tmp;
            renderQuestion();
          });

          var downBtn = document.createElement('button');
          downBtn.type = 'button';
          downBtn.textContent = '\u2193';
          downBtn.disabled = (pos === s.currentOrder.length - 1);
          downBtn.addEventListener('click', function () {
            var tmp = s.currentOrder[pos + 1];
            s.currentOrder[pos + 1] = s.currentOrder[pos];
            s.currentOrder[pos] = tmp;
            renderQuestion();
          });

          controls.appendChild(upBtn);
          controls.appendChild(downBtn);
          li.appendChild(controls);
        }

        list.appendChild(li);
      })(pos);
    }

    card.appendChild(list);

    if (!s.checked) {
      var checkBtn = document.createElement('button');
      checkBtn.type = 'button';
      checkBtn.className = 'check-btn';
      checkBtn.textContent = 'Check order';
      checkBtn.addEventListener('click', function () {
        s.checked = true;
        s.answered = true;
        s.wasCorrect = isOrderCorrect(s, q);
        renderQuestion();
      });
      card.appendChild(checkBtn);
    } else {
      var exp = document.createElement('div');
      exp.className = 'explanation';
      exp.style.color = 'var(--text)';
      var resultPrefix = s.wasCorrect ? 'Correct order! ' : 'Not quite the right order. ';
      exp.textContent = resultPrefix + q.explanation;
      card.appendChild(exp);
    }
  }

  function renderOpen(card, s, q) {
    if (!s.revealed) {
      var ta = document.createElement('textarea');
      ta.className = 'open-answer';
      ta.style.color = 'var(--text)';
      ta.placeholder = 'Write your answer here before revealing the sample answer...';
      card.appendChild(ta);

      var revealBtn = document.createElement('button');
      revealBtn.type = 'button';
      revealBtn.className = 'check-btn';
      revealBtn.textContent = 'Show sample answer';
      revealBtn.addEventListener('click', function () {
        s.revealed = true;
        renderQuestion();
      });
      card.appendChild(revealBtn);
    } else {
      var sampleLabel = document.createElement('div');
      sampleLabel.className = 'sample-answer-label';
      sampleLabel.style.color = 'var(--muted)';
      sampleLabel.textContent = 'Sample answer';
      card.appendChild(sampleLabel);

      var sampleBox = document.createElement('div');
      sampleBox.className = 'sample-answer-box';
      sampleBox.style.color = 'var(--text)';
      sampleBox.textContent = q.sampleAnswer;
      card.appendChild(sampleBox);

      if (s.selfGrade === null) {
        var row = document.createElement('div');
        row.className = 'self-grade-row';

        var gotItBtn = document.createElement('button');
        gotItBtn.type = 'button';
        gotItBtn.className = 'self-grade-btn-correct';
        gotItBtn.textContent = 'I got this right';
        gotItBtn.addEventListener('click', function () {
          s.selfGrade = 'correct';
          s.answered = true;
          renderQuestion();
        });

        var missedBtn = document.createElement('button');
        missedBtn.type = 'button';
        missedBtn.className = 'self-grade-btn-incorrect';
        missedBtn.textContent = "I didn't get this";
        missedBtn.addEventListener('click', function () {
          s.selfGrade = 'incorrect';
          s.answered = true;
          renderQuestion();
        });

        row.appendChild(gotItBtn);
        row.appendChild(missedBtn);
        card.appendChild(row);
      } else {
        var resultLine = document.createElement('div');
        resultLine.className = 'self-grade-result ' + (s.selfGrade === 'correct' ? 'is-correct' : 'is-incorrect');
        resultLine.textContent = s.selfGrade === 'correct' ? 'Marked as: correct' : 'Marked as: incorrect';
        card.appendChild(resultLine);
      }
    }
  }

  function renderNav() {
    var navRow = document.createElement('div');
    navRow.className = 'nav-row';

    var backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'nav-btn';
    backBtn.textContent = '\u2190 Back';
    backBtn.disabled = (currentIndex === 0);
    backBtn.addEventListener('click', function () {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    var nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.className = 'nav-btn';
    nextBtn.textContent = 'Next \u2192';
    var s = state[currentIndex];
    var canGoNext = (currentIndex < state.length - 1) && (s.answered || currentIndex < furthestIndex);
    nextBtn.disabled = !canGoNext;
    nextBtn.addEventListener('click', function () {
      if (currentIndex < state.length - 1 && (state[currentIndex].answered || currentIndex < furthestIndex)) {
        currentIndex++;
        if (currentIndex > furthestIndex) furthestIndex = currentIndex;
        renderQuestion();
      }
    });

    navRow.appendChild(backBtn);
    navRow.appendChild(nextBtn);
    quizArea.appendChild(navRow);
  }

  function renderSummary() {
    var total = state.length;
    var correct = computeScore();
    var pct = Math.round((correct / total) * 100);

    var box = document.createElement('div');
    box.className = 'summary-card';
    box.style.color = 'var(--text)';

    var title = document.createElement('div');
    title.style.fontWeight = '700';
    title.style.fontSize = '18px';
    title.style.color = 'var(--text)';
    title.textContent = 'Quiz complete';
    box.appendChild(title);

    var percentEl = document.createElement('div');
    percentEl.className = 'summary-percent';
    percentEl.textContent = pct + '%';
    box.appendChild(percentEl);

    var detail = document.createElement('div');
    detail.className = 'summary-detail';
    detail.style.color = 'var(--muted)';
    detail.textContent = correct + ' correct out of ' + total + ' questions';
    box.appendChild(detail);

    var restartBtn = document.createElement('button');
    restartBtn.type = 'button';
    restartBtn.className = 'primary-btn';
    restartBtn.textContent = 'Restart quiz';
    restartBtn.addEventListener('click', function () {
      window.location.reload();
    });
    box.appendChild(restartBtn);

    summaryArea.appendChild(box);
  }

  renderQuestion();
});
</script>
</body>
</html>
