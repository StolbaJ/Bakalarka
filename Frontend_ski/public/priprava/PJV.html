  // ---- State ----
  var questions = [];
  var current = 0;
  var score = 0;
  var answered = 0;

  // per-question state
  var qState = []; // {answeredIdx: null|number, shuffledAnswers: [...], correct: bool|null}

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function init() {
    questions = shuffle(ALL_QUESTIONS);
    current = 0;
    score = 0;
    answered = 0;
    qState = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      // build shuffled answers: [{text, origIdx}]
      var orig = q.answers.map(function(a, idx) { return {text: a, origIdx: idx}; });
      var shuffled = shuffle(orig);
      qState.push({
        answeredIdx: null,
        shuffledAnswers: shuffled,
        isCorrect: null
      });
    }
    document.getElementById('quiz-card').style.display = 'block';
    document.getElementById('results').classList.remove('visible');
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[current];
    var st = qState[current];
    var cat = CATEGORIES[q.cat];
    var total = questions.length;

    // progress
    var pct = Math.round((answered / total) * 100);
    document.getElementById('prog-label').textContent = 'Otazka ' + (current + 1) + ' z ' + total;
    document.getElementById('prog-pct').textContent = pct + ' %';
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('score-badge').textContent = 'Skore: ' + score + ' / ' + answered;

    // badge
    var badge = document.getElementById('cat-badge');
    badge.textContent = cat.label;
    badge.style.background = cat.color;

    document.getElementById('q-number').textContent = (current + 1) + ' / ' + total;
    document.getElementById('q-text').textContent = q.q;

    // answers
    var container = document.getElementById('answers');
    container.innerHTML = '';
    for (var i = 0; i < st.shuffledAnswers.length; i++) {
      (function(idx) {
        var item = st.shuffledAnswers[idx];
        var btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = item.text;

        if (st.answeredIdx !== null) {
          btn.disabled = true;
          if (item.origIdx === q.correct) {
            btn.classList.add('correct');
          } else if (idx === st.answeredIdx && item.origIdx !== q.correct) {
            btn.classList.add('wrong');
          }
        } else {
          btn.addEventListener('click', function() { selectAnswer(idx); });
        }
        container.appendChild(btn);
      })(i);
    }

    // explanation
    var expEl = document.getElementById('explanation');
    if (st.answeredIdx !== null) {
      expEl.innerHTML = q.exp;
      expEl.classList.add('visible');
    } else {
      expEl.innerHTML = '';
      expEl.classList.remove('visible');
    }

    // navigation
    var btnBack = document.getElementById('btn-back');
    var btnNext = document.getElementById('btn-next');

    btnBack.disabled = (current === 0);

    if (st.answeredIdx !== null) {
      if (current === questions.length - 1) {
        btnNext.textContent = 'Vysledky';
        btnNext.disabled = false;
      } else {
        btnNext.textContent = 'Dalsi \u2192';
        btnNext.disabled = false;
      }
    } else {
      btnNext.textContent = 'Dalsi \u2192';
      btnNext.disabled = true;
    }
  }

  function selectAnswer(shuffledIdx) {
    var q = questions[current];
    var st = qState[current];
    if (st.answeredIdx !== null) return;

    st.answeredIdx = shuffledIdx;
    var chosenOrigIdx = st.shuffledAnswers[shuffledIdx].origIdx;
    st.isCorrect = (chosenOrigIdx === q.correct);

    answered++;
    if (st.isCorrect) score++;

    renderQuestion();
  }

  document.getElementById('btn-back').addEventListener('click', function() {
    if (current > 0) { current--; renderQuestion(); }
  });

  document.getElementById('btn-next').addEventListener('click', function() {
    if (current < questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      showResults();
    }
  });

  document.getElementById('btn-restart').addEventListener('click', function() {
    init();
  });

  function showResults() {
    document.getElementById('quiz-card').style.display = 'none';
    var results = document.getElementById('results');
    results.classList.add('visible');

    var pct = Math.round((score / questions.length) * 100);
    document.getElementById('res-score').textContent = pct + '%';
    document.getElementById('res-label').textContent = score + ' spravnych z ' + questions.length + ' otazek';

    var emoji, text;
    if (pct >= 90) {
      emoji = '\uD83C\uDF1F';
      text = 'Vynikajici! Mate latku pevne v rukach. Java se vas neboji.';
    } else if (pct >= 75) {
      emoji = '\uD83D\uDE04';
      text = 'Skvely vysledek! Drobne mezery jeste zbyvaji, ale zaklad mate solidni.';
    } else if (pct >= 55) {
      emoji = '\uD83D\uDE10';
      text = 'Dobry pokrok. Doporucuji projet otazky, u nichz jste chyboval, a projit si prednaskove materialy.';
    } else {
      emoji = '\uD83D\uDCDA';
      text = 'Nevzdavejte to! Projdete si materialy a zkuste kviz znovu &ndash; kazdym pokusem se zlepsujete.';
    }
    document.getElementById('res-emoji').textContent = emoji;
    document.getElementById('res-text').innerHTML = text;

    // update progress to 100%
    document.getElementById('prog-label').textContent = 'Hotovo &ndash; ' + questions.length + ' otazek';
    document.getElementById('prog-pct').textContent = '100 %';
    document.getElementById('prog-fill').style.width = '100%';
    document.getElementById('score-badge').textContent = 'Skore: ' + score + ' / ' + questions.length;
  }

  init();
});
