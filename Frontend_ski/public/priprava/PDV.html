<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV Kviz</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f6fa;color:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}
@media(prefers-color-scheme:dark){body{background:#0f0f1a;color:#e8e8f8}
.card{background:#1a1a2e!important;border-color:#2a2a44!important}
.opt-btn{background:#1e1e34!important;border-color:#3a3a5c!important;color:#e8e8f8!important}
.opt-btn:not(:disabled):hover{background:#1a1a2e!important;border-color:#818cf8!important}
.progress-bg{background:#2a2a44!important}
.progress-fill{background:#818cf8!important}
.explanation{background:#1e1e34!important;color:#9898bb!important}
.score-badge{background:#818cf8!important}
.next-btn,.restart-btn{background:#818cf8!important}
.next-btn:hover,.restart-btn:hover{background:#a5b4fc!important}
.breakdown-item{background:#1e1e34!important;border-color:#2a2a44!important;color:#9898bb!important}
.breakdown-item strong{color:#e8e8f8!important}
.cat-hw{color:#a78bfa!important;background:#2e1065!important}
.cat-cpp{color:#38bdf8!important;background:#082f49!important}
.cat-omp{color:#2dd4bf!important;background:#042f2e!important}
.cat-ds{color:#fbbf24!important;background:#451a03!important}
.cat-dist{color:#fb7185!important;background:#4c0519!important}
.cat-par{color:#86efac!important;background:#052e16!important}}
header{text-align:center;margin-bottom:32px;max-width:680px}
header h1{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
header p{margin-top:8px;color:#555577;font-size:.95rem}
.course-tag{display:inline-block;background:#4f46e5;color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;margin-bottom:12px}
#quiz-container{width:100%;max-width:680px}
.stats-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:#555577;font-weight:500}
.score-badge{background:#4f46e5;color:#fff;border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700}
.progress-bg{background:#e0e0ee;border-radius:99px;height:8px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:#4f46e5;border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(79,70,229,.08);border:1px solid #e0e0ee;padding:28px 28px 24px}
.category-tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;margin-bottom:14px}
.cat-hw{color:#6d28d9;background:#ede9fe}
.cat-cpp{color:#0369a1;background:#e0f2fe}
.cat-omp{color:#0f766e;background:#ccfbf1}
.cat-ds{color:#b45309;background:#fef3c7}
.cat-dist{color:#9f1239;background:#ffe4e6}
.cat-par{color:#15803d;background:#dcfce7}
.question-text{font-size:1.08rem;font-weight:600;line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{background:#f0f0fa;border:1.5px solid #c8c8e8;border-radius:10px;padding:13px 16px;text-align:left;font-size:.95rem;font-weight:500;color:#1a1a2e;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;font-family:inherit;line-height:1.4}
.opt-btn:not(:disabled):hover{border-color:#4f46e5;background:#fff;transform:translateY(-1px)}
.opt-btn.correct{background:#dcfce7!important;border-color:#16a34a!important;color:#16a34a!important;font-weight:700}
.opt-btn.wrong{background:#fee2e2!important;border-color:#dc2626!important;color:#dc2626!important;font-weight:700}
.opt-btn:disabled{cursor:not-allowed;opacity:.85}
.explanation{margin-top:16px;padding:12px 16px;background:#f0f0fa;border-left:3px solid #4f46e5;border-radius:0 8px 8px 0;font-size:.88rem;color:#555577;line-height:1.5;display:none}
.explanation.visible{display:block}
.next-btn{margin-top:18px;width:100%;padding:13px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:.98rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;display:none}
.next-btn:hover{background:#3730a3;transform:translateY(-1px)}
#results{display:none;text-align:center;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(79,70,229,.08);border:1px solid #e0e0ee;padding:40px 28px}
.result-emoji{font-size:3.5rem;margin-bottom:12px}
.result-title{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.result-score{font-size:3rem;font-weight:900;color:#4f46e5;margin:16px 0 4px;line-height:1}
.result-sub{color:#555577;font-size:.95rem;margin-bottom:24px}
.result-breakdown{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.breakdown-item{background:#f0f0fa;border:1px solid #e0e0ee;border-radius:10px;padding:10px 18px;font-size:.88rem;color:#555577}
.breakdown-item strong{display:block;font-size:1.3rem;font-weight:800;color:#1a1a2e}
.restart-btn{background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:13px 32px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.restart-btn:hover{background:#3730a3}
@media(max-width:480px){header h1{font-size:1.4rem}.card{padding:20px 16px 18px}.question-text{font-size:1rem}}
</style>
</head>
<body>
<header>
  <div class="course-tag">B4B36PDV</div>
  <h1>Paralelní a distribuované systémy</h1>
  <p>Interaktivní kvíz &ndash; 25 otázek pokrývajících celý obsah předmětu</p>
</header>
<div id="quiz-container">
  <div class="stats-bar" id="stats-bar">
    <span id="q-counter">Otázka 1 z 25</span>
    <span class="score-badge" id="score-disp">Skóre: 0</span>
  </div>
  <div class="progress-bg" id="prog-wrap">
    <div class="progress-fill" id="prog-bar" style="width:0%"></div>
  </div>
  <div class="card" id="question-card">
    <div class="category-tag" id="cat-tag"></div>
    <div class="question-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="next-btn">Další otázka &rarr;</button>
  </div>
  <div id="results">
    <div class="result-emoji" id="res-emoji">🏆</div>
    <div class="result-title">Kvíz dokončen!</div>
    <div class="result-score" id="res-pct"></div>
    <div class="result-sub" id="res-sub"></div>
    <div class="result-breakdown">
      <div class="breakdown-item"><strong id="res-correct">0</strong>Správně</div>
      <div class="breakdown-item"><strong id="res-wrong">0</strong>Špatně</div>
      <div class="breakdown-item"><strong id="res-total">0</strong>Celkem</div>
    </div>
    <button class="restart-btn" id="restart-btn">Hrát znovu</button>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {

var Q = [
  {
    cat:'hw', catLabel:'HW podpora',
    q:'Co znamená zkratka SIMD v kontextu vektorových instrukcí?',
    opts:['Single Instruction, Multiple Data','Sequential Instruction, Multiple Dispatch','Shared Instruction Memory Domain','Synchronous Instruction, Multiplexed Data'],
    ok:0,
    exp:'SIMD (Single Instruction, Multiple Data) je základní princip vektorových instrukcí - jedna instrukce se provede na mnoha datech zároveň.'
  },
  {
    cat:'hw', catLabel:'HW podpora',
    q:'Jaké jsou maximální registry definované standardem AVX-512?',
    opts:['128 bitů','256 bitů','512 bitů','1024 bitů'],
    ok:2,
    exp:'AVX-512 definuje 512bitové vektorové registry. AVX má 128bit a AVX2 256bit registry.'
  },
  {
    cat:'hw', catLabel:'HW podpora',
    q:'Jaký je rozdíl mezi skalárním a superskalárním procesorem?',
    opts:[
      'Skalární procesor není schopen pipeline, superskalární ano',
      'Skalární procesor vykonává 1 instrukci za takt (IPC menší nebo rovno 1), superskalární více (IPC větší než 1)',
      'Superskalární procesor má více jader, skalární pouze jedno',
      'Skalární procesor používá SIMD instrukce, superskalární ne'
    ],
    ok:1,
    exp:'Skalární CPU dosahuje maximálně 1 instrukce za takt, zatímco superskalární dokáže vykonávat více instrukcí současně využitím ILP.'
  },
  {
    cat:'hw', catLabel:'HW podpora',
    q:'Co je warp v kontextu GPGPU architektury?',
    opts:[
      'Speciální instrukce pro GPU',
      'Skupina 32 vláken běžících lock-step na GPU',
      'Blokové dělení paměti na GPU',
      'Protokol pro přenos dat mezi CPU a GPU'
    ],
    ok:1,
    exp:'Warp je skupina 32 vláken, která běží lock-step na jednom streaming multiprocessoru (SM). Vlákna ve warpu sdílejí řadič instrukcí.'
  },
  {
    cat:'hw', catLabel:'HW podpora',
    q:'Jaké hazardy řeší pipelining a jak?',
    opts:[
      'Pouze datové hazardy pomocí duplikace instrukcí',
      'Datové (forwarding/stall), řídící (predikce skoků), strukturní (duplikace jednotek)',
      'Pouze řídící hazardy pomocí branch target bufferu',
      'Pipelining hazardy neřeší, pouze je detekuje'
    ],
    ok:1,
    exp:'Pipelining řeší tři typy hazardů: datové (forwarding, stally, přejmenování registrů), řídící (predikce skoků + BTB) a strukturní (duplikace jednotek).'
  },
  {
    cat:'hw', catLabel:'HW podpora',
    q:'Která cache úroveň je na moderním CPU nejrychlejší a nejmenší?',
    opts:['L3 cache (~16 MB)','L2 cache (~256 KB)','L1 cache (~32 KB, ~4 cykly)','LLC (Last Level Cache)'],
    ok:2,
    exp:'L1 cache je nejmenší (typicky ~32 KB) a nejrychlejší (~4 cykly). L2 je ~256 KB (~12 cyklů) a L3 ~16 MB (~30-40 cyklů).'
  },
  {
    cat:'par', catLabel:'Komplikace',
    q:'Co je false sharing a jaký má dopad na výkon?',
    opts:[
      'Sdílení stejné proměnné dvěma vlákny - správné a žádoucí chování',
      'Dvě vlákna přistupují k různým proměnným ve stejné cache line - způsobuje zbytečnou invalidaci cache',
      'Sdílení mutexů mezi vlákny vedoucí k deadlocku',
      'Situace, kdy jedno vlákno zápisů jiného vlákna nevidí'
    ],
    ok:1,
    exp:'False sharing nastává, když různá vlákna pracují na různých proměnných, které sdílejí stejnou cache line. Zápis jednoho vlákna invaliduje celou linku a způsobuje výrazné zpomalení.'
  },
  {
    cat:'par', catLabel:'Komplikace',
    q:'Jaké jsou 4 Coffmanovy podmínky nutné pro vznik deadlocku?',
    opts:[
      'Vzájemné vyloučení, zadržení a čekání, neodnímatelnost, cyklické čekání - všechny 4 musí platit současně',
      'Stačí splnit libovolné 2 ze 4 podmínek',
      'Cyklické čekání samo o sobě stačí k deadlocku',
      'Podmínky jsou pouze dostatečné, nikoli nutné'
    ],
    ok:0,
    exp:'Všechny 4 Coffmanovy podmínky musí platit současně: vzájemné vyloučení, zadržení a čekání, neodnímatelnost a cyklické čekání. Porušení libovolné z nich deadlock zamezí.'
  },
  {
    cat:'par', catLabel:'Komplikace',
    q:'Race condition (souběh) nastává, když:',
    opts:[
      'Dvě vlákna přistupují ke stejným datům bez řízení pořadí a alespoň jedno z nich data mění',
      'Dvě vlákna čekají na zámky držené tou druhou stranou',
      'Vlákno nemůže získat CPU čas kvůli prioritě jiného vlákna',
      'Cache line je invalidována zápisem jiného vlákna'
    ],
    ok:0,
    exp:'Race condition nastává, když více vláken přistupuje ke sdíleným datům bez synchronizace a výsledek závisí na časování. Řešením jsou mutexy, atomické operace nebo thread-local kopie.'
  },
  {
    cat:'cpp', catLabel:'C/C++ vlákna',
    q:'Jaká je hlavní výhoda std::jthread oproti std::thread (od C++20)?',
    opts:[
      'Je rychlejší kvůli nižší režii při vytváření',
      'Automaticky volá join() nebo detach() při destrukci a má vestavěnou podporu zrušení přes stop_token',
      'Podporuje více vláken najednou než std::thread',
      'Je k dispozici už od C++11'
    ],
    ok:1,
    exp:'std::jthread (C++20) automaticky spravuje životnost vlákna (RAII), volá join() při destrukci, a podporuje kooperativní zrušení přes stop_token. Snižuje riziko zapomenutého join().'
  },
  {
    cat:'cpp', catLabel:'C/C++ vlákna',
    q:'Proč je std::lock_guard lepší než ruční volání mtx.lock() a mtx.unlock()?',
    opts:[
      'lock_guard je rychlejší kvůli hardware podpoře',
      'lock_guard automaticky odemkne mutex i při výjimce (RAII princip)',
      'lock_guard umožňuje zamčení více mutexů najednou',
      'lock_guard zabrání deadlocku pořadím zamčení'
    ],
    ok:1,
    exp:'std::lock_guard využívá RAII - mutex se automaticky odemkne při destrukci objektu, tj. i při výjimce. Zabrání chybě zapomenutého unlock().'
  },
  {
    cat:'cpp', catLabel:'C/C++ vlákna',
    q:'Kdy je vhodné použít std::atomic místo mutexu?',
    opts:[
      'Když potřebujeme složité čekání a notifikace mezi vlákny',
      'Pro jednoduché sdílené proměnné (např. čítače), kde nepotřebujeme složitou logiku',
      'Vždy, protože atomic je vždy rychlejší než mutex',
      'Pouze pro typy bool a int'
    ],
    ok:1,
    exp:'std::atomic je ideální pro jednoduché sdílené proměnné jako čítače. Využívá atomické instrukce CPU a je rychlejší než mutex, ale nepodporuje složité čekání ani podmínky.'
  },
  {
    cat:'omp', catLabel:'OpenMP',
    q:'Jak funguje fork-join model v OpenMP?',
    opts:[
      'Hlavní vlákno vytvoří tým vláken (fork), ta spolupracují v paralelním regionu a na konci se spojí (join)',
      'Každé vlákno vytvoří svůj podproces a výsledky se posílají zprávami',
      'Vlákna se dynamicky vytváří a ničí při každém kódu',
      'Jedno vlákno zpracovává data, ostatní čekají na synchronizaci'
    ],
    ok:0,
    exp:'Fork-join je základní model OpenMP: hlavní (master) vlákno vstoupí do direktivy #pragma omp parallel, vytvoří tým vláken (fork), ta paralelně pracují a na konci se implicitní bariérou spojí (join).'
  },
  {
    cat:'omp', catLabel:'OpenMP',
    q:'Jaký je rozdíl mezi direktivami #pragma omp for a #pragma omp task?',
    opts:[
      '#pragma omp for je pro C, task pro C++',
      '#pragma omp for rozdělí iterace smyčky, task umožňuje paralelizaci libovolných bloků včetně rekurze',
      'task je starší a for novější direktiva',
      '#pragma omp for automaticky balancuje zátěž, task nikoliv'
    ],
    ok:1,
    exp:'#pragma omp for rozdělí iterace smyčky mezi vlákna. #pragma omp task vytvoří asynchronní úlohu, která může běžet na libovolném vlákně; vhodné pro rekurzi a nepravidelné struktury.'
  },
  {
    cat:'omp', catLabel:'OpenMP',
    q:'Co dělá direktiva schedule(guided) v OpenMP?',
    opts:[
      'Vybere nejlepší plán automaticky za běhu',
      'Začíná velkými bloky a postupně zmenšuje velikost chunku - kompromis mezi statickým a dynamickým plánováním',
      'Vlákna získávají bloky v pořadí, jak jsou registrována',
      'Plánování je předáno OS'
    ],
    ok:1,
    exp:'schedule(guided) začíná rozdělovat velké bloky a postupně je zmenšuje. Je to kompromis mezi nízkou režií statického plánování a lepším vyvážením dynamického.'
  },
  {
    cat:'omp', catLabel:'OpenMP',
    q:'Co způsobuje direktiva depend(in: X) u OpenMP tasku?',
    opts:[
      'Task může běžet jen pokud X je true',
      'Task musí počkat, dokud jiný task X nevyprodukuje (napsal depend(out: X))',
      'X je sdílená proměnná dostupná všem vláknům',
      'Task se spustí okamžitě a X je ignorováno'
    ],
    ok:1,
    exp:'depend(in: X) říká, že tento task potřebuje data X. Musí počkat na task, který má depend(out: X). OpenMP runtime si z těchto závislostí sestaví DAG.'
  },
  {
    cat:'par', catLabel:'Dekompozice',
    q:'Co je work-stealing v kontextu thread-poolu?',
    opts:[
      'Technika, kdy vlákno krade CPU čas jinému vláknu pomocí priority',
      'Pokud vlákno nemá co dělat, pokusí se ukrást úkol z fronty jiného vlákna',
      'Vlákna si vzájemně kopírují výsledky výpočtu',
      'Mechanismus, kdy OS přiděluje CPU čas vláknům na základě jejich zátěže'
    ],
    ok:1,
    exp:'Work-stealing: každé vlákno má vlastní deque s úkoly. Pokud je jeho fronta prázdná, pokusí se ukrást úkol z fronty jiného vlákna, čímž se automaticky vyvažuje zátěž.'
  },
  {
    cat:'par', catLabel:'Dekompozice',
    q:'Proč je přístup po řádcích (row-major) efektivnější než po sloupcích při práci s 2D polem v C/C++?',
    opts:[
      'Kvůli nižší algoritmické složitosti',
      'Kvůli lepší cache lokalitě: data uložená po řádcích jsou v paměti za sebou, přístup po sloupcích způsobuje cache miss',
      'Kvůli SIMD instrukcím, které pracují pouze s řádky',
      'Sloupce nejsou v C++ indexovány souvisle'
    ],
    ok:1,
    exp:'C/C++ ukládá 2D pole po řádcích (row-major). Přístup po řádcích využívá prostorovou lokalitu dat v cache. Přístup po sloupcích skáče přes cache liny a způsobuje časté cache missy.'
  },
  {
    cat:'ds', catLabel:'Distribuované syst.',
    q:'Co tvrdí výsledek FLP (Fischer-Lynch-Paterson)?',
    opts:[
      'V synchronním DS je konsensus vždy dosažitelný',
      'V asynchronním DS není možný deterministický konsensus, pokud může selhat i jeden proces',
      'Detektor selhání není možné implementovat bez centrálního uzlu',
      'Všechny distribuované algoritmy vyžadují globální hodiny'
    ],
    ok:1,
    exp:'FLP důkaz ukazuje, že v čistě asynchronním DS nelze zaručit deterministický konsensus ani pokud může selhat jen jeden proces. Proto většina reálných systémů používá částečně synchronní model.'
  },
  {
    cat:'ds', catLabel:'Distribuované syst.',
    q:'Jaký je rozdíl mezi clock slew a clock drift?',
    opts:[
      'Clock slew je rozdíl v čase, clock drift je rozdíl v rychlosti běhu hodin',
      'Clock drift je globální desynchronizace, clock slew lokální',
      'Jsou to synonyma pro stejný jev',
      'Clock slew se týká fyzických hodin, clock drift logických'
    ],
    ok:0,
    exp:'Clock slew je okamžitý rozdíl ve čase mezi dvěma procesy. Clock drift je rozdíl v rychlosti běhu hodin - jeden časovač jde rychleji nebo pomaleji než druhý.'
  },
  {
    cat:'ds', catLabel:'Distribuované syst.',
    q:'Co zaručují Lamportovy logické hodiny?',
    opts:[
      'Pokud e1 předchází e2, pak C(e1) je menší než C(e2); ale opak nemusí platit',
      'Pokud C(e1) je menší než C(e2), pak e1 kauzálně předchází e2',
      'Kauzální nezávislost dvou událostí lze přesně detekovat',
      'Hodiny všech procesů jsou synchronizovány v rámci delta'
    ],
    ok:0,
    exp:'Lamportovy hodiny zaručují: pokud e1 předchází e2, pak C(e1) < C(e2). Ale C(e1) < C(e2) neznamená, že e1 kauzálně předchází e2 - hodiny respektují kauzalitu, ale neumí ji zpětně ověřit.'
  },
  {
    cat:'ds', catLabel:'Distribuované syst.',
    q:'Co je konzistentní řez distribuovaného výpočtu?',
    opts:[
      'Řez, který zachycuje stav všech vláken ve stejný fyzický čas',
      'Řez obsahující vždy lichý počet událostí',
      'Řez, který pokud obsahuje důsledek, musí obsahovat i jeho příčinu - nesmí být příjem bez odeslání',
      'Řez, ve kterém žádný proces neposlal zprávu'
    ],
    ok:2,
    exp:'Konzistentní řez musí zachovat kauzalitu: pokud f je v řezu a e předchází f, musí být v řezu i e. Nelze mít v řezu příjetí zprávy bez jejího odeslání.'
  },
  {
    cat:'ds', catLabel:'Distribuované syst.',
    q:'Co je stabilní vlastnost v distribuovaném systému?',
    opts:[
      'Vlastnost, která platí od začátku a nikdy se nemění',
      'Vlastnost, která jakmile začne platit, zůstává platná navždy (např. deadlock, ukončení)',
      'Vlastnost, která je zaručena s pravděpodobností 1',
      'Vlastnost, která může být ověřena pouze za běhu systému'
    ],
    ok:1,
    exp:'Stabilní vlastnost je taková, že pokud jednou začne platit, zůstává platná navždy. Příklady: deadlock, ukončení výpočtu, objekt je sirotek. Chandy-Lamportův algoritmus dokáže jejich detekci.'
  },
  {
    cat:'dist', catLabel:'Vyloučení / Volba lídra',
    q:'Jaká je hlavní výhoda Ricart-Agrawalova algoritmu oproti centralizovanému?',
    opts:[
      'Méně zpráv celkem',
      'Je zcela decentralizovaný - neexistuje single point of failure',
      'Nevyžaduje logické hodiny',
      'Synchronizační zpoždění je nižší než u centralizovaného'
    ],
    ok:1,
    exp:'Ricart-Agrawala je zcela decentralizovaný - žádný koordinátor neexistuje, proto nemá single point of failure. Nevýhodou je vysoký počet zpráv: 2(N-1) při vstupu.'
  },
  {
    cat:'dist', catLabel:'Vyloučení / Volba lídra',
    q:'Jak funguje Bully algoritmus pro volbu lídra?',
    opts:[
      'Procesy jsou v kruhu a posílají zprávy ELECTION sousedovi',
      'P_i pošle ELECTION všem s vyšším ID; pokud nikdo neodpoví, P_i se prohlásí lídrem',
      'Vítězí proces s nejnižším ID v systému',
      'Probíhají volby hlasováním, vítězí majorita'
    ],
    ok:1,
    exp:'Bully: P_i pošle ELECTION všem s vyšším ID. Pokud nikdo neodpoví, P_i se prohlásí lídrem a posílá COORDINATOR všem nižším. Pokud přijde OK, P_i čeká na COORDINATOR od silnějšího. Vítězí nejvyšší živé ID.'

      'SWIM posílá heartbeat centrálnímu uzlu, all-to-all každému',

      'SWIM vyžaduje synchronní model, all-to-all asynchronní'
    ],
    ok:1,
    exp:'SWIM pinguuje náhodný uzel a při neodpovědi zapojí K jiných uzlů jako prostředníky (ping_req). All-to-all posílá heartbeat všem, což špatně škáluje. SWIM má zaručenou úplnost a konfigurovatelnou přesnost.'

var questions = [], curIdx = 0, score = 0, answered = false, shuffled = [];

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function initQuiz() {
  questions = shuffle(Q);
  curIdx = 0; score = 0; answered = false;
  document.getElementById('results').style.display = 'none';
  document.getElementById('question-card').style.display = 'block';
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('prog-wrap').style.display = 'block';
  renderQ();
}

function renderQ() {
  var q = questions[curIdx];
  answered = false;
  document.getElementById('q-counter').textContent = 'Otázka ' + (curIdx + 1) + ' z ' + questions.length;
  document.getElementById('score-disp').textContent = 'Skóre: ' + score;
  document.getElementById('prog-bar').style.width = (curIdx / questions.length * 100) + '%';
  var tag = document.getElementById('cat-tag');
  tag.textContent = q.catLabel;
  tag.className = 'category-tag cat-' + q.cat;
  document.getElementById('q-text').textContent = q.q;
  var indices = q.opts.map(function(_, i) { return i; });
  shuffled = shuffle(indices);
  var optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  shuffled.forEach(function(origIdx) {
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = q.opts[origIdx];
    btn.addEventListener('click', function() { handleAns(origIdx, btn); });
    optDiv.appendChild(btn);
  });
  document.getElementById('explanation').className = 'explanation';
  document.getElementById('explanation').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
}

function handleAns(selIdx, clickedBtn) {
  if (answered) return;
  answered = true;
  var q = questions[curIdx];
  if (selIdx === q.ok) score++;
  document.getElementById('score-disp').textContent = 'Skóre: ' + score;
  var btns = document.getElementById('options').querySelectorAll('.opt-btn');
  btns.forEach(function(btn) { btn.disabled = true; });
  btns.forEach(function(btn, i) {
    var orig = shuffled[i];
    if (orig === q.ok) btn.classList.add('correct');
    else if (btn === clickedBtn && selIdx !== q.ok) btn.classList.add('wrong');
  });
  var exp = document.getElementById('explanation');
  exp.textContent = q.exp;
  exp.className = 'explanation visible';
  var nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = curIdx < questions.length - 1 ? 'Další otázka \u2192' : 'Zobrazit výsledky \u2192';
}

document.getElementById('next-btn').addEventListener('click', function() {
  if (curIdx < questions.length - 1) { curIdx++; renderQ(); }
  else showResults();
});

document.getElementById('restart-btn').addEventListener('click', function() {
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('prog-wrap').style.display = 'block';
  initQuiz();
});

function showResults() {
  document.getElementById('question-card').style.display = 'none';
  document.getElementById('stats-bar').style.display = 'none';
  document.getElementById('prog-wrap').style.display = 'none';
  var pct = Math.round(score / questions.length * 100);
  var emoji = pct >= 90 ? '\uD83C\uDFC6' : pct >= 70 ? '\uD83C\uDF1F' : pct >= 50 ? '\uD83D\uDC4D' : '\uD83D\uDCDA';
  var msg = pct >= 90 ? 'Vynikající výkon!' : pct >= 70 ? 'Dobrá práce!' : pct >= 50 ? 'Stále je co zlepšovat.' : 'Doporučujeme zopakovat látku.';
  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-sub').textContent = msg + ' (' + score + ' ze ' + questions.length + ' správně)';
  document.getElementById('res-correct').textContent = score;
  document.getElementById('res-wrong').textContent = questions.length - score;
  document.getElementById('res-total').textContent = questions.length;
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('results').style.display = 'block';
}

initQuiz();
});
</script>
