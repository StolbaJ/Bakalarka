  var questions = [];
  var current = 0;
  var score = 0;
  var answered = 0;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(ALL_QUESTIONS).map(function(q) {
      var indices = [0, 1, 2, 3];
      var shuffledIdx = shuffle(indices);
      return {
        cat: q.cat,
        catLabel: q.catLabel,
        q: q.q,
        answers: q.answers,
        correct: q.correct,
        expl: q.expl,
        shuffledIdx: shuffledIdx,
        chosen: -1,
        answered: false
      };
    });
    current = 0;
    score = 0;
    answered = 0;
    document.getElementById('progressWrap').style.display = '';
    document.getElementById('quizCard').style.display = '';
    document.getElementById('results').classList.remove('visible');
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[current];
    var total = questions.length;

    document.getElementById('qNumber').textContent = (current + 1 < 10 ? '0' : '') + (current + 1);

    var catEl = document.getElementById('catTag');
    catEl.textContent = q.catLabel;
    catEl.className = 'category-tag cat-' + q.cat;

    document.getElementById('questionText').textContent = q.q;

    document.getElementById('progressLabel').textContent = 'Otazka ' + (current + 1) + ' z ' + total;
    document.getElementById('scoreBadge').textContent = 'Skore: ' + score + ' / ' + answered;
    document.getElementById('progressFill').style.width = ((current) / total * 100) + '%';

    var list = document.getElementById('answersList');
    list.innerHTML = '';

    q.shuffledIdx.forEach(function(origIdx, pos) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIdx];

      if (q.answered) {
        btn.disabled = true;
        if (origIdx === q.correct) {
          btn.classList.add('correct');
        } else if (origIdx === q.chosen) {
          btn.classList.add('wrong');
        }
      } else {
        btn.addEventListener('click', function() { onAnswer(origIdx); });
      }
      list.appendChild(btn);
    });

    var explEl = document.getElementById('explanation');
    if (q.answered) {
      explEl.innerHTML = '<strong>Vysvetleni:</strong> ' + q.expl;
      explEl.classList.add('visible');
    } else {
      explEl.innerHTML = '';
      explEl.classList.remove('visible');
    }

    var navRow = document.getElementById('navRow');
    if (q.answered) {
      navRow.style.display = 'flex';
      var btnPrev = document.getElementById('btnPrev');
      var btnNext = document.getElementById('btnNext');
      btnPrev.disabled = (current === 0);
      if (current === questions.length - 1) {
        btnNext.textContent = 'Zobrazit vysledky';
        btnNext.disabled = false;
      } else {
        btnNext.textContent = 'Dalsi \u2192';
        btnNext.disabled = false;
      }
    } else {
      navRow.style.display = 'none';
    }
  }

  function onAnswer(origIdx) {
    var q = questions[current];
    if (q.answered) return;
    q.answered = true;
    q.chosen = origIdx;
    answered++;
    if (origIdx === q.correct) score++;

    renderQuestion();
  }

  document.getElementById('btnPrev').addEventListener('click', function() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  });

  document.getElementById('btnNext').addEventListener('click', function() {
    if (current === questions.length - 1) {
      showResults();
    } else {
      current++;
      renderQuestion();
    }
  });

  function showResults() {
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('quizCard').style.display = 'none';
    var res = document.getElementById('results');
    res.classList.add('visible');

    var pct = Math.round((score / questions.length) * 100);
    document.getElementById('resPct').textContent = pct + '%';
    document.getElementById('resCorrect').textContent = score;
    document.getElementById('resWrong').textContent = (questions.length - score);

    var emoji = '&#128546;';
    var sub = 'Nevzdavej to, procti si material a zkus to znovu!';
    if (pct >= 90) { emoji = '&#127881;'; sub = 'Vyborne! Mas to pevneee v ruce.'; }
    else if (pct >= 75) { emoji = '&#128512;'; sub = 'Dobry vykon! Jeste trochu pilovat.'; }
    else if (pct >= 55) { emoji = '&#128528;'; sub = 'Ujde to, ale nektere temata chteji zopakovani.'; }
    document.getElementById('resEmoji').innerHTML = emoji;
    document.getElementById('resSub').textContent = sub + ' (' + score + ' z ' + questions.length + ' spravneee)';
  }

  document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
  });

  initQuiz();
});
</script>
