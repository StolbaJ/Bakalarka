<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA2 Kviz - Funkce vice promennych, Mocninne rady, Integraly</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f4f8;
    color: #111827;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e3a5f;
    margin-bottom: 6px;
  }

  header p {
    font-size: 0.95rem;
    color: #4b5563;
  }

  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .score-label {
    font-size: 0.9rem;
    color: #374151;
    font-weight: 500;
  }

  .score-value {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1e3a5f;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 8px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #1d4ed8);
    border-radius: 8px;
    transition: width 0.4s ease;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.09);
    color: #111827;
  }

  .question-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .q-number {
    font-size: 0.85rem;
    color: #6b7280;
    font-weight: 600;
  }

  .category-tag {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    color: #ffffff;
  }

  .cat-funkce    { background: #7c3aed; }
  .cat-derivace  { background: #0891b2; }
  .cat-extremy   { background: #d97706; }
  .cat-rady      { background: #059669; }
  .cat-souradnice { background: #dc2626; }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #111827;
    line-height: 1.55;
    margin-bottom: 22px;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .answer-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px 18px;
    border-radius: 10px;
    border: 2px solid #d1d5db;
    background: #f9fafb;
    color: #1a1a2e;
    font-size: 0.97rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    line-height: 1.45;
  }

  .answer-btn:hover:not(:disabled) {
    border-color: #3b82f6;
    background: #eff6ff;
    color: #1a1a2e;
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    background: #d1fae5;
    border-color: #10b981;
    color: #065f46;
  }

  .answer-btn.wrong {
    background: #fee2e2;
    border-color: #ef4444;
    color: #7f1d1d;
  }

  .explanation {
    margin-top: 18px;
    padding: 14px 18px;
    background: #eff6ff;
    border-left: 4px solid #3b82f6;
    border-radius: 0 8px 8px 0;
    font-size: 0.9rem;
    color: #1e3a5f;
    line-height: 1.55;
    display: none;
  }

  .explanation.visible {
    display: block;
  }

  .nav-buttons {
    display: none;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 12px;
  }

  .nav-buttons.visible {
    display: flex;
  }

  .nav-btn {
    padding: 10px 22px;
    border-radius: 8px;
    border: 2px solid #d1d5db;
    background: #f9fafb;
    color: #374151;
    font-size: 0.93rem;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .nav-btn:hover:not(:disabled) {
    border-color: #3b82f6;
    background: #eff6ff;
    color: #1d4ed8;
  }

  .nav-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .nav-btn.primary {
    background: #1d4ed8;
    border-color: #1d4ed8;
    color: #ffffff;
  }

  .nav-btn.primary:hover:not(:disabled) {
    background: #1e40af;
    border-color: #1e40af;
    color: #ffffff;
  }

  /* Vysledkova obrazovka */
  #results-screen {
    display: none;
    text-align: center;
  }

  #results-screen .result-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.09);
    color: #111827;
  }

  .result-emoji {
    font-size: 3.5rem;
    margin-bottom: 16px;
  }

  .result-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e3a5f;
    margin-bottom: 10px;
  }

  .result-percent {
    font-size: 3rem;
    font-weight: 800;
    color: #1d4ed8;
    margin-bottom: 8px;
  }

  .result-detail {
    font-size: 1rem;
    color: #4b5563;
    margin-bottom: 28px;
  }

  .result-grade {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .grade-excellent { background: #d1fae5; color: #065f46; }
  .grade-good      { background: #dbeafe; color: #1e3a8a; }
  .grade-ok        { background: #fef3c7; color: #78350f; }
  .grade-poor      { background: #fee2e2; color: #7f1d1d; }

  .restart-btn {
    padding: 13px 36px;
    border-radius: 10px;
    border: none;
    background: #1d4ed8;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }

  .restart-btn:hover {
    background: #1e40af;
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    body {
      background: #0f172a;
      color: #e2e8f0;
    }

    header h1 { color: #93c5fd; }
    header p  { color: #94a3b8; }

    .score-bar {
      background: #1e293b;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .score-label { color: #cbd5e1; }
    .score-value { color: #93c5fd; }

    .progress-wrap { background: #334155; }

    .card {
      background: #1e293b;
      color: #e2e8f0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .q-number { color: #94a3b8; }

    .question-text { color: #e2e8f0; }

    .answer-btn {
      background: #0f172a;
      border-color: #334155;
      color: #e2e8f0;
    }

    .answer-btn:hover:not(:disabled) {
      border-color: #60a5fa;
      background: #1e3a5f;
      color: #e2e8f0;
    }

    .answer-btn.correct {
      background: #064e3b;
      border-color: #10b981;
      color: #a7f3d0;
    }

    .answer-btn.wrong {
      background: #450a0a;
      border-color: #ef4444;
      color: #fca5a5;
    }

    .explanation {
      background: #1e3a5f;
      border-color: #60a5fa;
      color: #bfdbfe;
    }

    .nav-btn {
      background: #1e293b;
      border-color: #334155;
      color: #cbd5e1;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: #60a5fa;
      background: #1e3a5f;
      color: #93c5fd;
    }

    .nav-btn.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    .nav-btn.primary:hover:not(:disabled) {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    #results-screen .result-card {
      background: #1e293b;
      color: #e2e8f0;
    }

    .result-title { color: #93c5fd; }
    .result-percent { color: #60a5fa; }
    .result-detail { color: #94a3b8; }

    .grade-excellent { background: #064e3b; color: #a7f3d0; }
    .grade-good      { background: #1e3a5f; color: #bfdbfe; }
    .grade-ok        { background: #451a03; color: #fcd34d; }
    .grade-poor      { background: #450a0a; color: #fca5a5; }

    .restart-btn {
      background: #2563eb;
      color: #ffffff;
    }

    .restart-btn:hover {
      background: #1d4ed8;
    }
  }

  @media (max-width: 520px) {
    .card { padding: 20px 16px; }
    header h1 { font-size: 1.3rem; }
    .result-percent { font-size: 2.4rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>MA2 Kviz</h1>
    <p>Funkce vice promennych &middot; Mocninne rady &middot; Dvojny a trojny integral</p>
  </header>

  <div id="quiz-screen">
    <div class="score-bar">
      <span class="score-label" id="q-counter">Otazka 1 / 25</span>
      <span class="score-value" id="score-display">Skore: 0</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="card">
      <div class="question-meta">
        <span class="q-number" id="q-num-label">#1</span>
        <span class="category-tag" id="cat-tag"></span>
      </div>
      <div class="question-text" id="question-text"></div>
      <div class="answers" id="answers"></div>
      <div class="explanation" id="explanation"></div>
      <div class="nav-buttons" id="nav-buttons">
        <button class="nav-btn" id="btn-back">&#8592; Zpet</button>
        <button class="nav-btn primary" id="btn-next">Dalsi &#8594;</button>
      </div>
    </div>
  </div>

  <div id="results-screen">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-title">Kviz dokoncen!</div>
      <div class="result-percent" id="result-percent"></div>
      <div class="result-detail" id="result-detail"></div>
      <div class="result-grade" id="result-grade"></div>
      <br>
      <button class="restart-btn" id="restart-btn">Zkusit znovu</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var RAW_QUESTIONS = [
    {
      category: 'funkce',
      categoryLabel: 'Funkce vice promennych',
      text: 'Co je okolí bodu x v prostoru R^n?',
      answers: [
        'Mnozina vsech bodu, jejichz vzdalenost od x je presne delta',
        'Mnozina vsech bodu y takovych, ze ||x - y|| < delta',
        'Mnozina vsech bodu lezicich na hranici koule o polomeru delta',
        'Prazdna mnozina obsahujici pouze bod x'
      ],
      correct: 1,
      explanation: 'Kruhove okoli bodu x je mnozina U_delta(x) = { y : ||x - y|| < delta }, tedy otevrena koule se stredem x a poloměrem delta.'
    },
    {
      category: 'funkce',
      categoryLabel: 'Funkce vice promennych',
      text: 'Ktery z nasledujicich popisuje vnitrni bod mnoziny M?',
      answers: [
        'Pro kazde okoli U(x) plati U(x) cap M ruzne od prazdne mnoziny i U(x) cap doplnku M ruzne od prazdne mnoziny',
        'Existuje okoli U(x) takove, ze U(x) je podmnozinou M',
        'Existuje okoli U(x) takove, ze U(x) neprotina M',
        'Pro kazde prstencove okoli P(x) plati P(x) cap M ruzne od prazdne mnoziny'
      ],
      correct: 1,
      explanation: 'Vnitrni bod mnoziny M je takovy bod, kolem ktereho existuje cele okoli U(x), ktere lezi uvnitr M. Naopak hranicni bod ma kazde sve okoli protinajici se jak s M, tak s jeho doplnkem.'
    },
    {
      category: 'funkce',
      categoryLabel: 'Funkce vice promennych',
      text: 'Co je uzaver mnoziny M?',
      answers: [
        'Mnozina vsech vnitrnich bodu M',
        'Mnozina M bez hranicnich bodu',
        'Mnozina M sjednocena s jejimi hranicnimi body',
        'Mnozina vsech vnesnich bodu M'
      ],
      correct: 2,
      explanation: 'Uzaver mnoziny M je M sjednocena s jejimi hranicnimi body, tedy M union dM. Obsahuje vsechny hromadne body M.'
    },
    {
      category: 'funkce',
      categoryLabel: 'Funkce vice promennych',
      text: 'Kdy ma funkce f v bode a limitu A?',
      answers: [
        'Kdyz f(a) = A',
        'Kdyz pro kazde epsilon > 0 existuje delta > 0 tak, ze 0 < ||x - a|| < delta implikuje |f(x) - A| < epsilon',
        'Kdyz se funkce blizi A pouze z jednoho smeru',
        'Kdyz je funkce definovana v bode a'
      ],
      correct: 1,
      explanation: 'Limita funkce vice promennych vyzaduje, ze se f(x) blizi A ze vsech smeru. Formalne: pro kazde epsilon > 0 existuje delta > 0 tak, ze 0 < ||x-a|| < delta implikuje |f(x) - A| < epsilon.'
    },
    {
      category: 'derivace',
      categoryLabel: 'Derivace a gradient',
      text: 'Co vyjadruje smerova derivace funkce f v bode x0 ve smeru vektoru h?',
      answers: [
        'Maximalni hodnotu funkce f v okolí bodu x0',
        'Jak rychle se meni hodnota f v bode x0 pri pohybu ve smeru h',
        'Vzdalenost od bodu x0 k nejblizsimu extremu',
        'Soucin hodnot vsech parcialních derivaci v bode x0'
      ],
      correct: 1,
      explanation: 'Smerova derivace df/dh(x0) udava rychlost zmeny funkce f v bode x0 pri pohybu ve smeru vektoru h. Definuje se jako limita (f(x0 + t*h) - f(x0)) / t pro t -> 0.'
    },
    {
      category: 'derivace',
      categoryLabel: 'Derivace a gradient',
      text: 'Jak se vypocita parcialni derivace funkce f podle promenne x_i?',
      answers: [
        'Derivujeme f podle vsech promennych najednou',
        'Derivujeme f pouze podle x_i, ostatni promenne povazujeme za konstanty',
        'Vypocitame gradient a vezmeme jeho normu',
        'Spocitame druhou derivaci ve smeru x_i'
      ],
      correct: 1,
      explanation: 'Parcialni derivace podle x_i se pocita tak, ze pouze x_i je promennou, vsechny ostatni promenne se povazuji za konstanty. Je to specialni pripad smerove derivace ve smeru jednotkoveho vektoru e_i.'
    },
    {
      category: 'derivace',
      categoryLabel: 'Derivace a gradient',
      text: 'Co je gradient funkce f(x,y) = x^2 + y?',
      answers: [
        '(2x, 1)',
        '(x^2, y)',
        '(2, 0)',
        '(2x + y, x)'
      ],
      correct: 0,
      explanation: 'Parcialni derivace podle x je 2x, podle y je 1. Gradient je vektor (df/dx, df/dy) = (2x, 1). Napr. v bode (1,1) je gradient (2, 1).'
    },
    {
      category: 'derivace',
      categoryLabel: 'Derivace a gradient',
      text: 'Jaky je geometricky vyznam gradientu funkce f?',
      answers: [
        'Gradient je rovnobezny s vrstevnicemi funkce a ukazuje smer konstantnich hodnot',
        'Gradient je kolmy na vrstevnice a ukazuje smer nejrychlejsiho rustu funkce',
        'Gradient ukazuje smer nejrychlejsiho poklesu funkce',
        'Gradient je vzdy nulovy v extremech i v sedlovych bodech'
      ],
      correct: 1,
      explanation: 'Gradient je kolmy na vrstevnice (hladiny konstantnosti) funkce a ukazuje smer, ve kterem funkce roste nejrychleji. Velikost gradientu urcuje strmost rustu. V sedlovem bode se gradient rovná nule, ale neni vzdy tak.'
    },
    {
      category: 'derivace',
      categoryLabel: 'Derivace a gradient',
      text: 'Jak vypocitame smerovou derivaci pomoci gradientu?',
      answers: [
        'df/dh(x) = ||grad f(x)|| * ||h||',
        'df/dh(x) = grad f(x) . h (skalarni soucin)',
        'df/dh(x) = grad f(x) x h (vektorovy soucin)',
        'df/dh(x) = |grad f(x) - h|'
      ],
      correct: 1,
      explanation: 'Jakmile zname gradient, smerovou derivaci spocitame jako skalarni soucin: df/dh(x) = nabla f(x) . h = sum_i (df/dx_i) * h_i. Napr. pro grad f(1,1) = (2,1) a h = (2,1) dostaneme 2*2 + 1*1 = 5.'
    },
    {
      category: 'derivace',
      categoryLabel: 'Derivace a gradient',
      text: 'Co je Jacobiho matice vektorove funkce f: R^n -> R^m?',
      answers: [
        'Matice vsech druhych parcialních derivaci f',
        'Matice vsech prvnich parcialních derivaci f - matice tvaru m x n',
        'Hessova matice funkce f',
        'Inverzni matice k Hessove matici'
      ],
      correct: 1,
      explanation: 'Jacobiho matice J_f(a) ma rozmery m x n a obsahuje vsechny parcialni derivace: radek i odpovida slozce f_i, sloupec j odpovida derivaci podle x_j. Pro m=1 je Jacobiho matice radkovym vektorem (gradientem).'
    },
    {
      category: 'extremy',
      categoryLabel: 'Extremy funkce',
      text: 'Co je stacionarni bod funkce f?',
      answers: [
        'Bod, kde je funkce nespojita',
        'Bod, kde gradient f je nulovy vektor',
        'Bod, kde funkce dosahuje globalniho maxima',
        'Bod, kde Hessova matice je singularni'
      ],
      correct: 1,
      explanation: 'Stacionarni bod je bod, kde nabla f(x) = 0. Tyto body jsou podezrele z extremu, ale mohou byt i sedlove body. O jejich povaze rozhoduje Hessova matice druhych derivaci.'
    },
    {
      category: 'extremy',
      categoryLabel: 'Extremy funkce',
      text: 'Dle Sylvestrova kriteria: kdy ma Hessova matice lokalni minimum?',
      answers: [
        'Vsechny hlavni minory jsou zaporne',
        'Znamenko minoru se stridaji (-, +, -, ...)',
        'Vsechny hlavni minory jsou kladne',
        'Determinant Hessovy matice je nulovy'
      ],
      correct: 2,
      explanation: 'Dle Sylvestrova kriteria je matice pozitivne definitni (a tedy stacionarni bod je lokalni minimum), pokud jsou vsechny hlavni minory kladne. Pokud se znaminka stridaji, je matice negativne definitni (lokalni maximum). Jinak je indefinitni (sedlovy bod).'
    },
    {
      category: 'extremy',
      categoryLabel: 'Extremy funkce',
      text: 'Co rika Weierstrassova veta o globalnim extremu?',
      answers: [
        'Kazda funkce ma globalni extrém na libovolne mnozine',
        'Spojita funkce na kompaktni mnozine (uzavrene a omezene) nabýva globalniho minima i maxima',
        'Funkce nabýva extremu pouze ve stacionarnich bodech',
        'Globalni extremy existuji pouze pro konvexni funkce'
      ],
      correct: 1,
      explanation: 'Weierstrassova veta rece: je-li f spojita na neprazdne, uzavrene a omezene mnozine (kompaktni mnozine), pak nabýva globalniho minima i maxima. Klicove jsou vsechny tri podminky: spojitost, uzavrenost a ohranicnost.'
    },
    {
      category: 'extremy',
      categoryLabel: 'Extremy funkce',
      text: 'Jak znı Lagrangeova metoda pro hledani extremu za podmınky g(x,y)=0?',
      answers: [
        'Minimalizujeme f(x,y) + g(x,y) bez dalsıch podmınek',
        'Hledame extremy f + lambda * g pro vsechna lambda najednou',
        'Zavedeme Lagrangeovu funkci L = f - lambda * g a resıme nabla L = 0',
        'Dosadıme podmınku g = 0 prımo do Hessovy matice'
      ],
      correct: 2,
      explanation: 'Lagrangeova metoda: zavedeme L(x, y, lambda) = f(x,y) - lambda * g(x,y) a resime soustavu nabla L = 0. To dava tri rovnice (dL/dx = 0, dL/dy = 0, dL/dlambda = 0), odkud zıskame kandidaty na extremy.'
    },
    {
      category: 'extremy',
      categoryLabel: 'Extremy funkce',
      text: 'Pro funkci f(x,y) = x^2 + xy^2 - 16x, bod (8,0) je lokalnım minimem. Jake je Hessova matice v tomto bode?',
      answers: [
        'Matice [[2, 0], [0, 16]], pozitivne definitni',
        'Matice [[2, 8], [8, 0]], indefinitni',
        'Matice [[0, 0], [0, 0]], singularnı',
        'Matice [[-2, 0], [0, -16]], negativne definitni'
      ],
      correct: 0,
      explanation: 'Hessova matice f je [[2, 2y], [2y, 2x]]. V bode (8,0): [[2,0],[0,16]]. Hlavnı minory: delta_1 = 2 > 0, delta_2 = 32 > 0 -> pozitivne definitni -> lokalnı minimum.'
    },

  var CAT_CLASS = {
    funkce:      'cat-funkce',
    derivace:    'cat-derivace',
    extremy:     'cat-extremy',
    rady:        'cat-rady',
    souradnice:  'cat-souradnice'
  };

  // Stav kvizu
  var questions = [];      // zamichane otazky
  var current = 0;         // index aktualne zobrazene otazky
  var highWater = 0;       // nejdalsi dosazena otazka
  var score = 0;

  // Pro kazdou otazku: { answered: bool, chosenIdx: int|null, shuffledOrder: int[] }
  var qState = [];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(RAW_QUESTIONS);
    current = 0;
    highWater = 0;
    score = 0;
    qState = questions.map(function() {
      return { answered: false, chosenIdx: null, shuffledOrder: null };
    });
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[current];
    var st = qState[current];
    var total = questions.length;

    // Header
    document.getElementById('q-counter').textContent = 'Otazka ' + (current + 1) + ' / ' + total;
    document.getElementById('score-display').textContent = 'Skore: ' + score;
    document.getElementById('progress-fill').style.width = (((current) / total) * 100) + '%';
    document.getElementById('q-num-label').textContent = '#' + (current + 1);

    var tag = document.getElementById('cat-tag');
    tag.textContent = q.categoryLabel;
    tag.className = 'category-tag ' + (CAT_CLASS[q.category] || '');

    document.getElementById('question-text').textContent = q.text;

    // Zamichane poradi odpovedi - generujeme pri prvnim zobrazeni
    if (!st.shuffledOrder) {
      var order = [];
      for (var i = 0; i < q.answers.length; i++) order.push(i);
      st.shuffledOrder = shuffle(order);
    }
    var order = st.shuffledOrder;

    var answersEl = document.getElementById('answers');
    answersEl.innerHTML = '';

    for (var ai = 0; ai < order.length; ai++) {
      var origIdx = order[ai];
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.answers[origIdx];

      if (st.answered) {
        btn.disabled = true;
        if (origIdx === q.correct) {
          btn.classList.add('correct');
        } else if (origIdx === st.chosenIdx) {
          btn.classList.add('wrong');
        }
      } else {
        (function(oi) {
          btn.addEventListener('click', function() {
            handleAnswer(oi);
          });
        })(origIdx);
      }
      answersEl.appendChild(btn);
    }

    var expEl = document.getElementById('explanation');
    if (st.answered) {
      expEl.textContent = q.explanation;
      expEl.classList.add('visible');
    } else {
      expEl.textContent = '';
      expEl.classList.remove('visible');
    }

    var navEl = document.getElementById('nav-buttons');
    if (st.answered) {
      navEl.classList.add('visible');
    } else {
      navEl.classList.remove('visible');
    }

    var btnBack = document.getElementById('btn-back');
    var btnNext = document.getElementById('btn-next');

    btnBack.disabled = (current === 0);

    if (current < highWater) {
      // Prohlizeni historie - dalsi jde dopredu az na highWater
      btnNext.textContent = 'Dalsi \u2192';
      btnNext.disabled = false;
    } else {
      // Na aktualne rozpracovane otazce
      if (current === questions.length - 1) {
        btnNext.textContent = 'Zobrazit vysledky';
        btnNext.disabled = false;
      } else {
        btnNext.textContent = 'Dalsi \u2192';
        btnNext.disabled = false;
      }
    }
  }

  function handleAnswer(chosenOrigIdx) {
    var q = questions[current];
    var st = qState[current];

    if (st.answered) return;

    st.answered = true;
    st.chosenIdx = chosenOrigIdx;

    if (chosenOrigIdx === q.correct) {
      score++;
    }

    if (current >= highWater) {
      highWater = current;
    }

    renderQuestion();
  }

  document.getElementById('btn-back').addEventListener('click', function() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  });

  document.getElementById('btn-next').addEventListener('click', function() {
    var st = qState[current];
    if (!st.answered) return;

    if (current === questions.length - 1) {
      showResults();
      return;
    }

    if (current < highWater) {
      // Z historicke otazky - jdeme dopredu na highWater
      current = highWater;
    } else {
      current++;
      if (current > highWater) highWater = current;
    }
    renderQuestion();
  });

  document.getElementById('restart-btn').addEventListener('click', function() {
    initQuiz();
  });

  function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    var rs = document.getElementById('results-screen');
    rs.style.display = 'block';

    var total = questions.length;
    var pct = Math.round((score / total) * 100);

    document.getElementById('result-percent').textContent = pct + '%';
    document.getElementById('result-detail').textContent = 'Spravne: ' + score + ' z ' + total + ' otazek';

    var emoji, gradeText, gradeClass;
    if (pct >= 90) {
      emoji = '\uD83C\uDF1F'; gradeText = 'Vyborne!'; gradeClass = 'grade-excellent';
    } else if (pct >= 75) {
      emoji = '\uD83D\uDC4D'; gradeText = 'Velmi dobre'; gradeClass = 'grade-good';
    } else if (pct >= 55) {
      emoji = '\uD83D\uDE0A'; gradeText = 'Obstojne'; gradeClass = 'grade-ok';
    } else {
      emoji = '\uD83D\uDCDA'; gradeText = 'Zkuste to znovu'; gradeClass = 'grade-poor';
    }

    document.getElementById('result-emoji').textContent = emoji;
    var gradeEl = document.getElementById('result-grade');
    gradeEl.textContent = gradeText;
    gradeEl.className = 'result-grade ' + gradeClass;
  }

  initQuiz();
});
