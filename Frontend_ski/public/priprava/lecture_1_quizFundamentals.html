    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  var questionOrder = shuffleArray(rawQuestions.map(function(q, idx) { return idx; }));

  var quizState = questionOrder.map(function(origIdx) {
    var q = rawQuestions[origIdx];
    var optionIndices = [0, 1, 2, 3];
    var shuffledIdx = shuffleArray(optionIndices);
    var shuffledOptions = shuffledIdx.map(function(i) { return q.options[i]; });
    var newCorrectIndex = shuffledIdx.indexOf(q.correct);
    return {
      category: q.category,
      catClass: q.catClass,
      question: q.question,
      explanation: q.explanation,
      options: shuffledOptions,
      correctIndex: newCorrectIndex,
      answered: false,
      selectedIndex: null
    };
  });

  var total = quizState.length;
  var currentIndex = 0;
  var furthestIndex = 0;
  var quizFinished = false;

  var card = document.getElementById('quizCard');
  var progressFill = document.getElementById('progressFill');
  var questionCounter = document.getElementById('questionCounter');
  var scoreBox = document.getElementById('scoreBox');

  function computeScore() {
    var correctCount = 0;
    var answeredCount = 0;
    for (var i = 0; i < total; i++) {
      if (quizState[i].answered) {
        answeredCount++;
        if (quizState[i].selectedIndex === quizState[i].correctIndex) {
          correctCount++;
        }
      }
    }
    return { correct: correctCount, answered: answeredCount };
  }

  function updateTopBar() {
    var score = computeScore();
    scoreBox.textContent = 'Score: ' + score.correct + ' / ' + score.answered;
    if (quizFinished) {
      questionCounter.textContent = 'Results';
      progressFill.style.width = '100%';
    } else {
      questionCounter.textContent = 'Question ' + (currentIndex + 1) + ' of ' + total;
      var pct = Math.round((score.answered / total) * 100);
      progressFill.style.width = pct + '%';
    }
  }

  function selectAnswer(qIndex, optIndex) {
    var q = quizState[qIndex];
    if (q.answered) {
      return;
    }
    q.answered = true;
    q.selectedIndex = optIndex;

    if (qIndex === furthestIndex) {
      if (qIndex === total - 1) {
        quizFinished = true;
      } else {
        furthestIndex = qIndex + 1;
      }
    }

    renderQuestion(qIndex);
    updateTopBar();
  }

  function goBack() {
    if (currentIndex > 0) {
      currentIndex = currentIndex - 1;
      renderQuestion(currentIndex);
      updateTopBar();
    }
  }

  function goNext() {
    if (currentIndex < furthestIndex) {
      currentIndex = currentIndex + 1;
      renderQuestion(currentIndex);
      updateTopBar();
    }
  }

  function showResults() {
    quizFinished = true;
    renderResults();
    updateTopBar();
  }

  function restartQuiz() {
    questionOrder = shuffleArray(rawQuestions.map(function(q, idx) { return idx; }));
    quizState = questionOrder.map(function(origIdx) {
      var q = rawQuestions[origIdx];
      var optionIndices = [0, 1, 2, 3];
      var shuffledIdx = shuffleArray(optionIndices);
      var shuffledOptions = shuffledIdx.map(function(i) { return q.options[i]; });
      var newCorrectIndex = shuffledIdx.indexOf(q.correct);
      return {
        category: q.category,
        catClass: q.catClass,
        question: q.question,
        explanation: q.explanation,
        options: shuffledOptions,
        correctIndex: newCorrectIndex,
        answered: false,
        selectedIndex: null
      };
    });
    currentIndex = 0;
    furthestIndex = 0;
    quizFinished = false;
    renderQuestion(currentIndex);
    updateTopBar();
  }

  function renderQuestion(qIndex) {
    var q = quizState[qIndex];

    var html = '';
    html += '<span class="cat-tag ' + q.catClass + '">' + q.category + '</span>';
    html += '<p class="question-text">' + q.question + '</p>';
    html += '<div class="options" id="optionsWrap"></div>';
    if (q.answered) {
      html += '<div class="explanation">' + q.explanation + '</div>';
    }
    html += '<div class="nav-row">';
    html += '<button class="nav-btn" id="backBtn">&larr; Back</button>';
    if (qIndex === total - 1 && q.answered) {
      html += '<button class="nav-btn primary" id="finishBtn">See Results</button>';
    } else {
      html += '<button class="nav-btn primary" id="nextBtn">Next &rarr;</button>';
    }
    html += '</div>';

    card.innerHTML = html;

    var optionsWrap = document.getElementById('optionsWrap');
    q.options.forEach(function(optText, optIdx) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = optText;
      btn.type = 'button';

      if (q.answered) {
        btn.disabled = true;
        if (optIdx === q.correctIndex) {
          btn.className = 'answer-btn correct';
        } else if (optIdx === q.selectedIndex) {
          btn.className = 'answer-btn incorrect';
        }
      } else {
        btn.addEventListener('click', function() {
          selectAnswer(qIndex, optIdx);
        });
      }

      optionsWrap.appendChild(btn);
    });

    var backBtn = document.getElementById('backBtn');
    backBtn.disabled = (qIndex === 0);
    backBtn.addEventListener('click', goBack);

    if (qIndex === total - 1 && q.answered) {
      var finishBtn = document.getElementById('finishBtn');
      finishBtn.addEventListener('click', showResults);
    } else {
      var nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = !(qIndex < furthestIndex);
      nextBtn.addEventListener('click', goNext);
    }
  }

  function renderResults() {
    var score = computeScore();
    var pct = Math.round((score.correct / total) * 100);

    var html = '';
    html += '<div class="results">';
    html += '<h2>Quiz Complete</h2>';
    html += '<div class="big-score">' + pct + '%</div>';
    html += '<p>You answered ' + score.correct + ' out of ' + total + ' questions correctly.</p>';
    html += '<button class="restart-btn" id="restartBtn">Restart Quiz</button>';
    html += '</div>';

    card.innerHTML = html;

    var restartBtn = document.getElementById('restartBtn');
    restartBtn.addEventListener('click', restartQuiz);
  }

  renderQuestion(currentIndex);
  updateTopBar();

});
</script>
</body>
</html>
