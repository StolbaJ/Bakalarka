<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kviz: Jazyky, automaty a gramatiky</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    color: #111827;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 1.7rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 0.95rem;
    color: #4b5563;
  }

  .progress-bar-wrap {
    background: #e5e7eb;
    border-radius: 999px;
    height: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #4f46e5;
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #6b7280;
    margin-bottom: 22px;
  }

  .score-badge {
    background: #ede9fe;
    color: #4f46e5;
    font-weight: 600;
    border-radius: 999px;
    padding: 2px 12px;
    font-size: 0.85rem;
  }

  .card {
    background: #ffffff;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    color: #111827;
  }

  .category-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
    color: #ffffff;
  }

  .cat-zaklady    { background: #0891b2; }
  .cat-dka        { background: #7c3aed; }
  .cat-nka        { background: #b45309; }
  .cat-reg        { background: #15803d; }
  .cat-gramatiky  { background: #be185d; }
  .cat-zasobniky  { background: #b91c1c; }

  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    color: #111827;
    line-height: 1.55;
    margin-bottom: 22px;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .answer-btn {
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 13px 16px;
    text-align: left;
    font-size: 0.97rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    color: #1a1a2e;
    line-height: 1.45;
  }

  .answer-btn:not(:disabled):hover {
    border-color: #a5b4fc;
    background: #eef2ff;
    color: #1a1a2e;
  }

  .answer-btn.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #14532d;
  }

  .answer-btn.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #7f1d1d;
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .explanation {
    margin-top: 18px;
    padding: 14px 16px;
    background: #f0f9ff;
    border-left: 4px solid #0ea5e9;
    border-radius: 0 8px 8px 0;
    font-size: 0.93rem;
    color: #0c4a6e;
    line-height: 1.55;
    display: none;
  }

  .explanation.visible {
    display: block;
  }

  .nav-buttons {
    display: none;
    justify-content: space-between;
    margin-top: 22px;
    gap: 12px;
  }

  .nav-buttons.visible {
    display: flex;
  }

  .nav-btn {
    background: #4f46e5;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 0.95rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .nav-btn:hover:not(:disabled) {
    background: #3730a3;
  }

  .nav-btn:disabled {
    background: #c7d2fe;
    color: #6366f1;
    cursor: default;
  }

  .nav-btn.secondary {
    background: #e0e7ff;
    color: #3730a3;
  }

  .nav-btn.secondary:hover:not(:disabled) {
    background: #c7d2fe;
    color: #3730a3;
  }

  .results {
    display: none;
    text-align: center;
    padding: 10px 0;
  }

  .results.visible {
    display: block;
  }

  .results h2 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 10px;
  }

  .results .big-score {
    font-size: 3.5rem;
    font-weight: 800;
    color: #4f46e5;
    margin: 16px 0 8px;
  }

  .results .subtitle {
    font-size: 1rem;
    color: #6b7280;
    margin-bottom: 24px;
  }

  .results .grade {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 999px;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .grade-a { background: #dcfce7; color: #15803d; }
  .grade-b { background: #dbeafe; color: #1d4ed8; }
  .grade-c { background: #fef9c3; color: #a16207; }
  .grade-d { background: #fee2e2; color: #b91c1c; }

  .restart-btn {
    background: #4f46e5;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 13px 36px;
    font-size: 1rem;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }

  .restart-btn:hover {
    background: #3730a3;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #111827;
      color: #f3f4f6;
    }

    .header h1 { color: #f3f4f6; }
    .header p { color: #9ca3af; }

    .progress-bar-wrap { background: #374151; }
    .progress-info { color: #9ca3af; }
    .score-badge { background: #2e1065; color: #c4b5fd; }

    .card {
      background: #1f2937;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      color: #f3f4f6;
    }

    .question-text { color: #f3f4f6; }

    .answer-btn {
      background: #374151;
      border-color: #4b5563;
      color: #f3f4f6;
    }

    .answer-btn:not(:disabled):hover {
      border-color: #818cf8;
      background: #312e81;
      color: #e0e7ff;
    }

    .answer-btn.correct {
      background: #14532d;
      border-color: #16a34a;
      color: #dcfce7;
    }

    .answer-btn.wrong {
      background: #7f1d1d;
      border-color: #dc2626;
      color: #fee2e2;
    }

    .explanation {
      background: #0c4a6e;
      border-color: #38bdf8;
      color: #e0f2fe;
    }

    .nav-btn {
      background: #4f46e5;
      color: #ffffff;
    }

    .nav-btn.secondary {
      background: #312e81;
      color: #c7d2fe;
    }

    .nav-btn:disabled {
      background: #312e81;
      color: #6366f1;
    }

    .results h2 { color: #f3f4f6; }
    .results .subtitle { color: #9ca3af; }
    .results .big-score { color: #818cf8; }

    .grade-a { background: #14532d; color: #bbf7d0; }
    .grade-b { background: #1e3a5f; color: #93c5fd; }
    .grade-c { background: #78350f; color: #fde68a; }
    .grade-d { background: #7f1d1d; color: #fca5a5; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Jazyky, automaty a gramatiky</h1>
    <p>Interaktivni kviz k predmetu &mdash; 25 otazek</p>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-info">
    <span id="questionCounter">Otazka 1 z 25</span>
    <span class="score-badge" id="scoreBadge">Skore: 0 / 0</span>
  </div>

  <div class="card" id="quizCard">
    <span class="category-tag" id="categoryTag"></span>
    <div class="question-text" id="questionText"></div>
    <div class="answers" id="answersDiv"></div>
    <div class="explanation" id="explanation"></div>
    <div class="nav-buttons" id="navButtons">
      <button class="nav-btn secondary" id="prevBtn">&#8592; Zpet</button>
      <button class="nav-btn" id="nextBtn">Dalsi &#8594;</button>
    </div>
  </div>

  <div class="card results" id="resultsCard">
    <h2>Kviz dokoncen!</h2>
    <div class="big-score" id="bigScore"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="grade" id="gradeLabel"></div>
    <br>
    <button class="restart-btn" id="restartBtn">Zkusit znovu</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var allQuestions = [
    {
      category: 'zaklady',
      catLabel: 'Zaklady',
      catClass: 'cat-zaklady',
      question: 'Co je to abeceda v teorii formalnich jazyku?',
      answers: [
        'Libovolna mnozina symbolu, i nekonecna',
        'Konecna neprazdna mnozina symbolu',
        'Mnozina vsech slov nad danou mnozinou',
        'Nekonecna posloupnost pismen'
      ],
      correct: 1,
      explanation: 'Abeceda (znacena Sigma) je konecna neprazdna mnozina. Prvky nazyvame symboly nebo pismena.'
    },
    {
      category: 'zaklady',
      catLabel: 'Zaklady',
      catClass: 'cat-zaklady',
      question: 'Jak se definuje delka prazdneho slova epsilon?',
      answers: [
        'Delka prazdneho slova je 1',
        'Prazdne slovo nema definovanou delku',
        'Delka prazdneho slova je 0',
        'Delka prazdneho slova zavisi na abecede'
      ],
      correct: 2,
      explanation: 'Prazdne slovo epsilon je posloupnost neobsahujici ani jeden symbol, takze jeho delka |epsilon| = 0.'
    },
    {
      category: 'zaklady',
      catLabel: 'Zaklady',
      catClass: 'cat-zaklady',
      question: 'Co plati pro mnozinu Sigma* (hvezda)?',
      answers: [
        'Sigma* obsahuje vsechna neprazdna slova nad abecedou Sigma',
        'Sigma* obsahuje vsechna slova (vcetne prazdneho) nad abecedou Sigma',
        'Sigma* je vzdy konecna mnozina',
        'Sigma* neobsahuje prazdne slovo epsilon'
      ],
      correct: 1,
      explanation: 'Sigma* je mnozina vsech slov nad abecedou Sigma, vcetne prazdneho slova epsilon. Sigma* tvofi monoid s operaci zretezeni a neutraln prvkem epsilon.'
    },
    {
      category: 'zaklady',
      catLabel: 'Zaklady',
      catClass: 'cat-zaklady',
      question: 'Kolik jazyku (jako podmnozin Sigma*) nad konecnou abecedou existuje?',
      answers: [
        'Spocetne mnoho',
        'Konecne mnoho',
        'Nespocetne mnoho',
        'Prave tolik, kolik je prvku v abecede'
      ],
      correct: 2,
      explanation: 'Sigma* je spocetna mnozina, ale pocet vsech podmnozin spocetne mnoziny je nespocetne velky. Proto jazyku (podmnozin Sigma*) existuje nespocetne mnoho.'
    },
    {
      category: 'dka',
      catLabel: 'DKA',
      catClass: 'cat-dka',
      question: 'Co je prechozova funkce delta deterministickeho konecneho automatu (DKA)?',
      answers: [
        'Zobrazen delta: Q x Sigma -> P(Q)',
        'Zobrazen delta: Q x Sigma -> Q',
        'Zobrazen delta: Q -> Sigma',
        'Zobrazen delta: Sigma* -> Q'
      ],
      correct: 1,
      explanation: 'V DKA (DFA) prechozova funkce delta: Q x Sigma -> Q priradi kazdemu stavu a vstupnimu symbolu jednoznacne novy stav. To je klicovy rozdil od NFA, kde vysledkem je mnozina stavu.'
    },
    {
      category: 'dka',
      catLabel: 'DKA',
      catClass: 'cat-dka',
      question: 'DKA je formalne petice (Q, Sigma, delta, q0, F). Co oznacuje F?',
      answers: [
        'Vstupni abeceda',
        'Mnozina pocatecnich stavu',
        'Mnozina koncovych (prijimajicich) stavu',
        'Prechozova funkce'
      ],
      correct: 2,
      explanation: 'F je podmnozina Q a oznacuje mnozinu koncovych (prijimajicich) stavu. Slovo je prijato automatem, pokud po zpracovani skonci v nekterem stavu z F.'
    },
    {
      category: 'dka',
      catLabel: 'DKA',
      catClass: 'cat-dka',
      question: 'Jak je definovano prijimani slova u automatem DKA M = (Q, Sigma, delta, q0, F)?',
      answers: [
        'delta(q0, u) patri do F',
        'delta*(q0, u) patri do F',
        'delta*(q0, u) = q0',
        'Slovo u je podslovo nejakeho slova z F'
      ],
      correct: 1,
      explanation: 'Slovo u je prijimano automatem M, jestlize delta*(q0, u) nalezi F. Rozsirena prechozova funkce delta* popisuje chovani automatu nad celym vstupnim slovem, ne jen jednim symbolem.'
    },
    {
      category: 'dka',
      catLabel: 'DKA',
      catClass: 'cat-dka',
      question: 'Co prikaze Pumping lemma pro regularni jazyky?',
      answers: [
        'Kazdy regularni jazyk je konecny',
        'Pro kazdy regularni jazyk existuje n takove, ze kazde dostatecne dlouhe slovo jazyka lze rozdelit na tri casti splnujici specificke podmínky',
        'Kazdy regularni jazyk lze popsat prave jednim DKA',
        'Regularni jazyk musi obsahovat prazdne slovo'
      ],
      correct: 1,
      explanation: 'Pumping lemma rika, ze pro kazdy regularni jazyk L existuje prirozene cislo n, ze kazde slovo u z L delky vetsi nez n lze rozdelit na u = xwy tak, ze |xw| <= n, w != epsilon a pro kazde i >= 0 plati xw^i y v L. Je to nutna (ne postacujici) podminka pro regularitu.'
    },
    {
      category: 'dka',
      catLabel: 'DKA',
      catClass: 'cat-dka',
      question: 'Proc jazyk L = {0^m 1^m | m >= 0} neni regularni?',
      answers: [
        'Protoze neobsahuje prazdne slovo',
        'Protoze kazdy DKA pro nej potrebuje nekonecne mnoho stavu',
        'Protoze ho lze popsat regularnim vyrazem, ale neni prijiman DKA',
        'Protoze jeho abeceda ma vice nez jedno pismeno'
      ],
      correct: 1,
      explanation: 'Jazyk {0^m 1^m} vyzaduje "pocitani" symbolu, coz si konecny automat nemuze zapamatovat konecnym poctem stavu. Pumping lemma ukazuje spor: rozsireni na xw^2y da slovo s nestenym poctem 0 a 1, ktere do jazyka nepatri.'
    },
    {
      category: 'dka',
      catLabel: 'DKA',
      catClass: 'cat-dka',
      question: 'Co rika Nerodova veta o regularni jazycich?',
      answers: [
        'Kazdy jazyk prijimany NKA je regularni',
        'Jazyk L je regularni prave tehdy, kdyz existuje ekvivalence T na Sigma* s konecnym poctem trid splnujici specificke vlastnosti',
        'Regularni jazyk musi byt prijiman unikatnim redukovanym DKA',
        'Nerodova veta rika, ze vsechny jazyky jsou regularni'
      ],
      correct: 1,
      explanation: 'Nerodova veta plne charakterizuje regularni jazyky: jazyk je regularni prave tehdy, kdyz existuje prava kongruence T monoidu (Sigma*, ., epsilon) s konecnym poctem trid ekvivalence, jejiz sjednoceni nekterych trid je jazyk L.'
    },
    {
      category: 'nka',
      catLabel: 'NKA',
      catClass: 'cat-nka',
      question: 'Jak se lisi NKA (nedeterministicky konecny automat) od DKA?',
      answers: [
        'NKA muze mit vice pocatecnich stavu a prechozova funkce vraci mnozinu stavu',
        'NKA ma vzdy mene stavu nez odpovidajici DKA',
        'NKA prijima slabsi tridu jazyku nez DKA',
        'NKA nemuze mit koncove stavy'
      ],
      correct: 0,
      explanation: 'NKA muze mit vice pocatecnich stavu (mnozina I) a prechozova funkce delta: Q x Sigma -> P(Q) vraci mnozinu stavu (i prazdnou). Tato nedeterministicnost umoznuje vice vetvi vypoctu soucasne.'
    },
    {
      category: 'nka',
      catLabel: 'NKA',
      catClass: 'cat-nka',
      question: 'Co rika veta o podmnozinovem konstrukci (podmnozinova konstrukce)?',
      answers: [
        'Ke kazdemu NKA existuje DKA, ktery prijima stejny jazyk',
        'NKA vždy prijima vetsi tridu jazyku nez DKA',
        'Podmnozinova konstrukce vzdy zmensi pocet stavu',
        'Každy jazyk prijimany NKA je kontextový'
      ],
      correct: 0,
      explanation: 'Podmnozinova konstrukce dokazuje, ze ke kazdemu NKA M existuje DKA M_, ktery prijima stejny jazyk L(M) = L(M_). Stavy DKA jsou podmnoaziny stavu NKA, tj. |Q_DKA| <= 2^|Q_NKA|.'
    },
    {
      category: 'nka',
      catLabel: 'NKA',
      catClass: 'cat-nka',
      question: 'Co je epsilon-uzaver mnoziny stavu X v epsilon-NKA?',
      answers: [
        'Mnozina vsech stavu dosazitelnych ze stavu v X pomoci alespon jednoho epsilon prechodu',
        'Mnozina vsech stavu dosazitelnych ze stavu v X pomoci nulovych nebo vice epsilon prechodu (vcetne X samotneho)',
        'Mnozina vsech stavu, ze kterych vede epsilon prechod do nejakeho stavu v X',
        'Mnozina koncovych stavu automatu'
      ],
      correct: 1,
      explanation: 'Epsilon-UZ(X) je mnozina vsech stavu dosazitelnych z nejakeho stavu q v X sledem hran oznacenych epsilon (vcetne nulovych kroku, tedy X samo je podmnozinou epsilon-UZ(X)).'
    },
    {
      category: 'reg',
      catLabel: 'Regularni vyrazy',
      catClass: 'cat-reg',
      question: 'Ktery z nasledujicich zapisu je regularni vyraz nad abecedou {a, b}?',
      answers: [
        'Pouze konecne mnoziny slov',
        '(a+b)*b - cokoliv tvaru, co vznikne z zakladnich vyrazu pomoci sjednoceni, zretezeni a Kleeneho *',
        'Pouze slova s pevnou delkou',
        'Regularni vyrazy nepoukazuji na jazyky'
      ],
      correct: 1,
      explanation: 'Regularni vyrazy se budoji induktivne: zakladem jsou prazdny jazyk (empty), epsilon, jednotliva pismena. Z nich lze pomoci (r1+r2), r1r2 a r* tvorit slozitejsi vyrazy reprezentujici regularni jazyky.'
    },
    {
      category: 'reg',
      catLabel: 'Regularni vyrazy',
      catClass: 'cat-reg',
      question: 'Co rika Kleeneova veta o regularni jazycich?',
      answers: [
        'Kazdy regularni jazyk lze popsat konecnym automatem i regularnim vyrazem, a naopak',
        'Pouze regularni jazyky s epsilon maji regularni vyraz',
        'Regularni vyrazy a DKA jsou neekvivalentni formalismy',
        'Kazdy regularni vyraz lze prevest pouze na NKA, ne DKA'
      ],
      correct: 0,
      explanation: 'Kleeneova veta rika: jazyk je regularni (prijiman DKA) prave tehdy, kdyz lze reprezentovat regularnim vyrazem. Obe smery: kazdy regularni jazyk ma regularni vyraz a kazdy regularni vyraz reprezentuje regularni jazyk.'
    },
    {
      category: 'reg',
      catLabel: 'Regularni vyrazy',
      catClass: 'cat-reg',
      question: 'Jak se ziskava regularni vyraz z daneho DKA metodou upravy stavoveho diagramu?',
      answers: [
        'Pridame novy pocatecni stav start a novy koncovy stav fin, pak postupne odstranjieme vrcholy a upravujeme oznaceni hran',
        'Primy prevod prechozove tabulky na regularni vyraz bez dalsi uprahy',
        'Redukujeme automat na jeden stav',
        'Regularni vyraz je primo dana prechozovou funkci'
      ],
      correct: 0,
      explanation: 'Metodou upravy stavoveho diagramu pridame stavy start a fin, pridame epsilon prechody, a pak odstranjuji paralelni hrany (spojime regularnim vyrazem r1+r2), smycky (nahradime r* na navazujicich hranach) a vrcholy (zkombinujeme oznaceni hran) az zustane jedina hrana start->fin.'
    },
    {
      category: 'reg',
      catLabel: 'Regularni vyrazy',
      catClass: 'cat-reg',
      question: 'Tridda regularni jazyku je uzavrena na ktere operace?',
      answers: [
        'Pouze sjednoceni a prusnik',
        'Sjednoceni, doplnek, prusnik, zretezeni, Kleeneho *, reverze',
        'Pouze Kleeneho * a zretezeni',
        'Regularni jazyky nejsou uzavrene na zadne operace'
      ],
      correct: 1,
      explanation: 'Trida regularni jazyku je uzavrena na: sjednoceni, doplnek, prusnik (DeMorganem z doplnku a sjednoceni), zretezeni, Kleeneho * a reverzi. Vsechny tyto operace aplikovane na regularni jazyky daji opet regularni jazyk.'
    },
    {
      category: 'gramatiky',
      catLabel: 'Gramatiky',
      catClass: 'cat-gramatiky',

  var questions = [];
  var current = 0;
  var score = 0;
  var answered = 0;
  var answered_states = [];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function initQuiz() {
    questions = shuffle(allQuestions).map(function(q) {
      var indices = [0, 1, 2, 3];
      var shuffled = shuffle(indices);
      var newCorrect = shuffled.indexOf(q.correct);
      var newAnswers = shuffled.map(function(i) { return q.answers[i]; });
      return {
        category: q.category,
        catLabel: q.catLabel,
        catClass: q.catClass,
        question: q.question,
        answers: newAnswers,
        correct: newCorrect,
        explanation: q.explanation
      };
    });

    answered_states = questions.map(function() {
      return { answered: false, chosen: -1 };
    });

    current = 0;
    score = 0;
    answered = 0;
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[current];
    var state = answered_states[current];
    var total = questions.length;

    document.getElementById('progressBar').style.width = (((current) / total) * 100) + '%';
    document.getElementById('questionCounter').textContent = 'Otazka ' + (current + 1) + ' z ' + total;
    document.getElementById('scoreBadge').textContent = 'Skore: ' + score + ' / ' + answered;

    var tag = document.getElementById('categoryTag');
    tag.textContent = q.catLabel;
    tag.className = 'category-tag ' + q.catClass;

    document.getElementById('questionText').textContent = q.question;

    var answersDiv = document.getElementById('answersDiv');
    answersDiv.innerHTML = '';

    q.answers.forEach(function(text, i) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = text;

      if (state.answered) {
        btn.disabled = true;
        if (i === q.correct) {
          btn.classList.add('correct');
        } else if (i === state.chosen) {
          btn.classList.add('wrong');
        }
      } else {
        btn.addEventListener('click', function() { selectAnswer(i); });
      }
      answersDiv.appendChild(btn);
    });

    var expl = document.getElementById('explanation');
    if (state.answered) {
      expl.textContent = q.explanation;
      expl.className = 'explanation visible';
    } else {
      expl.textContent = '';
      expl.className = 'explanation';
    }

    var navButtons = document.getElementById('navButtons');
    if (state.answered) {
      navButtons.className = 'nav-buttons visible';
    } else {
      navButtons.className = 'nav-buttons';
    }

    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = (current === 0);

    if (current === total - 1) {
      nextBtn.textContent = 'Zobrazit vysledky';
    } else {
      nextBtn.textContent = 'Dalsi \u2192';
    }

    var allAnswered = answered_states.every(function(s) { return s.answered; });
    if (state.answered && current < total - 1) {
      nextBtn.disabled = false;
    } else if (state.answered && current === total - 1) {
      nextBtn.disabled = false;
    } else {
      nextBtn.disabled = true;
    }

    if (state.answered) {
      var futureLock = false;
      for (var i = current + 1; i < total; i++) {
        if (!answered_states[i].answered) { futureLock = true; break; }
      }
      if (futureLock && current < total - 1) {
        nextBtn.disabled = false;
        nextBtn.textContent = 'Dalsi \u2192';
      }
    }
  }

  function selectAnswer(chosenIdx) {
    var q = questions[current];
    var state = answered_states[current];
    if (state.answered) return;

    state.answered = true;
    state.chosen = chosenIdx;
    answered++;

    if (chosenIdx === q.correct) {
      score++;
    }

    renderQuestion();
  }

  function goNext() {
    var total = questions.length;
    if (current === total - 1) {
      var allAnswered = answered_states.every(function(s) { return s.answered; });
      if (allAnswered) {
        showResults();
        return;
      }
    }

    var next = current + 1;
    while (next < total && answered_states[next].answered) {
      next++;
    }
    if (next >= total) {
      for (var i = current + 1; i < total; i++) {
        if (!answered_states[i].answered) { next = i; break; }
      }
    }
    if (next < total) {
      current = next;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function goPrev() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  }

  function showResults() {
    document.getElementById('quizCard').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.className = 'card results visible';

    var pct = Math.round((score / questions.length) * 100);
    document.getElementById('bigScore').textContent = pct + '%';
    document.getElementById('subtitle').textContent = score + ' spravnych odpovedi z ' + questions.length;

    var gradeLabel = document.getElementById('gradeLabel');
    if (pct >= 90) {
      gradeLabel.textContent = 'Vyborne! Znamka A';
      gradeLabel.className = 'grade grade-a';
    } else if (pct >= 75) {
      gradeLabel.textContent = 'Dobre! Znamka B';
      gradeLabel.className = 'grade grade-b';
    } else if (pct >= 60) {
      gradeLabel.textContent = 'Dost dobre. Znamka C';
      gradeLabel.className = 'grade grade-c';
    } else {
      gradeLabel.textContent = 'Je potreba procvicit. Znamka D';
      gradeLabel.className = 'grade grade-d';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('questionCounter').textContent = 'Dokonceno!';
    document.getElementById('scoreBadge').textContent = 'Skore: ' + score + ' / ' + questions.length;
  }

  document.getElementById('nextBtn').addEventListener('click', goNext);
  document.getElementById('prevBtn').addEventListener('click', goPrev);
  document.getElementById('restartBtn').addEventListener('click', function() {
    document.getElementById('quizCard').style.display = '';
    document.getElementById('resultsCard').className = 'card results';
    initQuiz();
  });

  initQuiz();
});
