# Green stack – spouští se samostatně. Síť bp_app-network musí existovat (infra s -p bp).

services:
  backend-green:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: backend-green
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres-ski
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ski_inventory}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
      - SERVER_PORT=8080
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-green:
    build:
      context: ../Frontend_ski
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: frontend-green
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend-green
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: bp_app-network
