# Blue-green deploy: postgres + nginx vždy běží; backend/frontend v profilech "blue" nebo "green".
# První deploy: up -d --profile blue. Další: nabuildí se nová verze, spustí se druhý profil, nginx se přepne, starý profil se zastaví.

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-ski
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-ski_inventory}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - app-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # --- Blue stack (profil blue) ---
  backend-blue:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: backend-blue
    restart: unless-stopped
    profiles:
      - blue
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ski_inventory}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-blue:
    build:
      context: ../Frontend_ski
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: frontend-blue
    restart: unless-stopped
    profiles:
      - blue
    environment:
      - NODE_ENV=production
    depends_on:
      - backend-blue
    networks:
      - app-network

  # --- Green stack (profil green) ---
  backend-green:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: backend-green
    restart: unless-stopped
    profiles:
      - green
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ski_inventory}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-green:
    build:
      context: ../Frontend_ski
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: frontend-green
    restart: unless-stopped
    profiles:
      - green
    environment:
      - NODE_ENV=production
    depends_on:
      - backend-green
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
