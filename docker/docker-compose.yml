# Infra: postgres + nginx. Spouštět s -p bp (project name), aby síť byla bp_app-network.
# Aplikace (blue/green) jsou v docker-compose-app-blue.yml a docker-compose-app-green.yml.
# (version je v novém Compose zastaralá, vynechána.)

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-ski
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-ski_inventory}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - app-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
