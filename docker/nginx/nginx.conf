user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Docker internal DNS – re-resolve upstream hostnames every 10s
    # prevents stale IP cache after backend/frontend container restart (502 fix)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting na /api/auth/* – vypnuto (JMeter load testy, jinak 429 na login).
    # Zapnutí: odkomentuj zóny + limit_req v conf.d/default.conf a default-ssl.conf
    # limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    # limit_req_zone $binary_remote_addr zone=auth_login_customer:10m rate=20r/m;
    # limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=30r/m;
    # limit_req_status 429;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}

