# Rate limit zones (http context) – musí být načteno před server bloky (název 00-*)
# Použito v default.conf a default-ssl.conf v location pro /api/auth/*
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_login_customer:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_general:10m rate=30r/m;
