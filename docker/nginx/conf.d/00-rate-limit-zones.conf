# Rate limit zones (http context) – ochrana proti brute-force na přihlášení
# Použití: limit_req zone=login burst=2 nodelay;

# Login (admin + customer): 5 požadavků za minutu na IP, burst 2
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Ostatní auth (change-password, refresh): 20/min na IP
limit_req_zone $binary_remote_addr zone=auth_other:10m rate=20r/m;
